<title>מצבת תלמידים תשפ״ז — מעקב לפי פיקוח</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#12224a; --blue:#2563a8; --green:#12805c; --amber:#b07a12;
         --line:#e3e8f0; --bg:#f6f8fb; --ink:#1b2333; --mute:#6b7688; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",Arial,sans-serif;padding:30px 16px 60px}
  .wrap{max-width:900px;margin:0 auto}
  header{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-bottom:16px}
  h1{margin:0 0 4px;font-size:25px;color:var(--navy)}
  .sub{margin:0;color:var(--mute);font-size:14px}
  .sub b{color:var(--blue)}
  .kpis{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .kpi{flex:1 1 150px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .kpi .n{font-size:26px;font-weight:700;color:var(--navy);line-height:1.2}
  .kpi .l{font-size:13px;color:var(--mute)}
  .kpi.ok .n{color:var(--green)} .kpi.wait .n{color:var(--amber)}
  .barwrap{height:9px;background:#e9edf4;border-radius:6px;overflow:hidden;margin-top:16px}
  .barwrap>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0;transition:width .9s ease}
  .grp{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .ghead{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--navy);color:#fff}
  .ghead .who{font-weight:500;font-size:16px;flex:1}
  .ghead .cnt{font-size:14px;opacity:.9;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr.done{background:#fbfdfc}
  tr.wait td{color:var(--mute)}
  td.st{width:34px;text-align:center}
  td.st svg{width:19px;height:19px;display:block;margin:0 auto}
  tr.done td.st{color:var(--green)} tr.wait td.st{color:#c3ccd9}
  td.school{font-weight:500}
  tr.wait td.school{font-weight:400}
  td.rep{color:var(--mute);font-size:14px}
  td.num{width:80px;text-align:center;font-weight:700;color:var(--blue)}
  tr.wait td.num{color:#c3ccd9;font-weight:400}
  .approx{color:var(--amber);font-size:12px;margin-inline-start:5px;font-weight:400}
  .note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-top:18px}
  .note h2{margin:0 0 6px;font-size:17px;color:var(--navy)}
  .note p{margin:0 0 10px;color:var(--mute);font-size:14px;line-height:1.6}
  .legend{color:var(--mute);font-size:13px;margin-top:16px;text-align:center;line-height:1.8}
  .legend a.back{color:var(--blue);font-weight:600;text-decoration:none}
  .legend a.back:hover{text-decoration:underline}
  @media (max-width:560px){ td.rep{display:none} }
  @media print{ body{background:#fff;padding:0} header,.grp,.note{border:0;box-shadow:none}
    .ghead{background:#12224a !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .grp{break-inside:avoid} }
</style>

  return String(s==null?"":s).replace(/[\u05f4\u05f3"'`.,\-\u2013\u2014\/()0-9]/g," ")
    .replace(/\s+/g," ").trim().toLowerCase();
}

/* אינדקסים מנורמלים - עמידים בשינויי פיסוק וריווח בשם שהוקלד בטופס */
var BY_NORM = {}, ALIAS_N = {}, ASSUMED_N = {};
SCHOOLS.forEach(function(s){ BY_NORM[norm(s[0])] = s[0]; });
Object.keys(ALIAS).forEach(function(k){ ALIAS_N[norm(k)] = ALIAS[k]; });
Object.keys(ASSUMED).forEach(function(k){ ASSUMED_N[norm(k)] = ASSUMED[k]; });

function resolve(school){
  var n = norm(school);
  if (BY_NORM[n])   return { name: BY_NORM[n], approx:false };
  if (ALIAS_N[n])   return { name: ALIAS_N[n], approx:false };
  if (ASSUMED_N[n]) return { name: ASSUMED_N[n], approx:true };
  return null;
}

function render(rows, live){
  var bySchool = {}, orphans = [], total = 0;
  rows.forEach(function(r){
    var school = String(r[1]||"").trim();
    if (!school || norm(school) === "ort") return;      /* שורת הבדיקה */
    var num = Number(r[2]) || 0;
    total += num;
    var hit = resolve(school);
    if (hit) bySchool[hit.name] = { rep:String(r[0]||"").trim(), num:num, approx:hit.approx };
    else orphans.push([String(r[0]||"").trim(), school, num]);
  });

  var sups = [], bySup = {};
  SCHOOLS.forEach(function(s){
    if (!bySup[s[1]]) { bySup[s[1]] = []; sups.push(s[1]); }
    bySup[s[1]].push(s);
  });

  var done = 0, html = "";
  sups.forEach(function(sup){
    var list = bySup[sup], n = 0, rowsHtml = "";
    list.sort(function(a,b){
      var da = bySchool[a[0]] ? 1 : 0, db = bySchool[b[0]] ? 1 : 0;
      if (da !== db) return db - da;
      if (da) return bySchool[b[0]].num - bySchool[a[0]].num;
      return a[0].localeCompare(b[0], "he");
    });
    list.forEach(function(s){
      var hit = bySchool[s[0]];
      if (hit) n++;
      rowsHtml += '<tr class="'+(hit?"done":"wait")+'">'+
        '<td class="st">'+(hit?ICON_OK:ICON_WAIT)+'</td>'+
        '<td class="school">'+esc(s[0])+
          (hit && hit.approx ? '<span class="approx" title="שיוך משוער - לאימות">&#8776;</span>' : '')+'</td>'+
        '<td class="rep">'+(hit ? esc(hit.rep) : "טרם דיווח")+'</td>'+
        '<td class="num">'+(hit ? hit.num : "&#8212;")+'</td></tr>';
    });
    done += n;
    html += '<div class="grp"><div class="ghead"><span class="who">'+esc(sup)+'</span>'+
            '<span class="cnt">'+n+' מתוך '+list.length+'</span></div>'+
            '<table>'+rowsHtml+'</table></div>';
  });
  document.getElementById("groups").innerHTML = html;

  var extra = "";
  if (orphans.length){
    extra = '<div class="note"><h2>דיווחו — אך אינם בקובץ פריסת הפיקוח ('+orphans.length+')</h2>'+
      '<p>בתי ספר שדיווחו בשם שאינו מופיע ברשימת 64 בתי הספר. הם נספרים בסך התלמידים, אך לא סומנו אצל אף מפקח.</p>'+
      '<table>'+orphans.map(function(o){
        var note = NOTES[o[1]];
        return '<tr class="done"><td class="st">'+ICON_OK+'</td><td class="school">'+esc(o[1])+
               (note ? '<span class="approx" title="זוהה ידנית">'+esc(note)+'</span>' : '')+
               '</td><td class="rep">'+esc(o[0])+'</td><td class="num">'+o[2]+'</td></tr>';
      }).join("")+'</table></div>';
  }
  document.getElementById("extra").innerHTML = extra;

  document.getElementById("k1").textContent = done + " / " + SCHOOLS.length;
  document.getElementById("k2").textContent = SCHOOLS.length - done;
  document.getElementById("k3").textContent = fmt(total);
  setTimeout(function(){
    document.getElementById("bar").style.width = (done / SCHOOLS.length * 100) + "%";
  }, 60);

  var d = new Date(), t = ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  document.getElementById("sub").innerHTML = live
    ? "<b>נתונים חיים מהגיליון</b> - עודכן ב-" + t
    : "תמונת מצב מוטמעת - 27.8.2026";
}

render(SNAPSHOT, false);

fetch(API + "?mode=list", {cache:"no-store"})
  .then(function(r){ return r.json(); })
  .then(function(j){ if (j && j.ok && j.rows && j.rows.length) render(j.rows, true); })
  .catch(function(){});
</script>
</body>
</html>
