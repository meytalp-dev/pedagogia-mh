        window.addEventListener('message', receiveMessage);
        function receiveMessage(e) {
            if (e.origin.toLowerCase().indexOf('edu.gov.il') > -1) {
                var scope = angular.element($('#divView')).scope();
                scope.$apply(function () {
                    scope.getMore();
                });
            }
        }
        function sendMessage() {
            var wHeight = $('body').height() + 90;
            window.parent.postMessage(wHeight, 'http://edu.gov.il/');
        }

        $(function () {
            $("#sheelon").autocomplete({
                source: 'Ajax.ashx?autocomplete=1',
                minLength: 3
            });
        });

        function showAjax() {
            var ajax = $('#ajaxLoader');
            var top = ($(document).height() - $('#ajaxLoader').height()) / 2;
            var left = ($(document).width() - $('#ajaxLoader').width()) / 2;
            ajax.css('top', top + 'px');
            ajax.css('left', left + 'px');
        }

        function emptyNullValue(val) {
            return val == null ? '' : val;
