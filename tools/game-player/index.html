<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק לימודי – הבית של המנהיגות הפדגוגית היוצרת · מינהל הכשרה מקצועית</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 11.11.26: --wrong / --wrong-l — תשובה שגויה בכתום-אדום, לא בטורקיז של המותג */
:root{--bg:#F8FBFF;--card:#fff;--primary:#124D7A;--primary-l:#E8F2FF;--primary-d:#0D3B66;--secondary:#087B9C;--sec-l:#E4FAF7;--green:#52B788;--green-l:#D8F3DC;--accent:#E9A319;--accent-l:#FEF3C7;--wrong:#C2410C;--wrong-l:#FDECEC;--dark:#102A43;--gray:#52687A;--gray-l:#94A3B8;--border:rgba(0,0,0,.06);--shadow:0 2px 20px -4px rgba(0,0,0,.06);--shadow-md:0 8px 28px rgba(0,0,0,.07);--r:20px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.plain-btn{background:transparent;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer}
.sr-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.plain-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
body{font-family:'Assistant',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.game-wrapper{max-width:620px;width:100%;margin:0 auto}
.progress-wrap{background:rgba(0,0,0,.04);border-radius:20px;height:8px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(to left,var(--primary-l),var(--primary),var(--primary-d));border-radius:20px;transition:width .5s;width:0%}
.g-card{background:var(--card);border-radius:var(--r);padding:36px;box-shadow:var(--shadow-md);animation:fadeUp .45s ease}
.screen{display:none}.screen.active{display:block}
.ic{display:inline-block;vertical-align:-.18em;flex-shrink:0}

/* Loading */
.loading-screen{text-align:center;padding:80px 20px}
.spinner{width:48px;height:48px;border:4px solid var(--primary-l);border-top:4px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--gray);font-size:16px}
.error-box{text-align:center;padding:60px 20px}
.error-icon{color:var(--gray);margin-bottom:16px;display:flex;justify-content:center}
.error-title{font-size:22px;font-weight:700;margin-bottom:8px;color:var(--secondary)}
.error-sub{color:var(--gray);font-size:15px;line-height:1.6}

/* Intro */
.intro-icon{width:80px;height:80px;border-radius:24px;background:var(--primary-l);color:var(--primary-d);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.intro-title{font-family:'Assistant',sans-serif;font-size:28px;font-weight:900;text-align:center;margin-bottom:6px}
.intro-sub{color:var(--gray);font-size:16px;text-align:center;margin-bottom:28px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:14px;font-weight:600;color:var(--gray);margin-bottom:6px}
.input-group input,.input-group select{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:14px;font-family:'Assistant',sans-serif;font-size:16px;color:var(--dark);background:var(--bg);transition:border-color .3s}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--primary);background:white}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:'Assistant',sans-serif;font-size:17px;font-weight:700;cursor:pointer;transition:all .3s}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-d);transform:translateY(-2px)}.btn-primary:disabled{opacity:.4;pointer-events:none}
.btn-next{background:var(--primary);color:white;margin-top:16px;display:none}.btn-next:hover{background:var(--primary-d);transform:translateY(-2px)}
.game-type-badge{display:inline-flex;align-items:center;gap:6px;background:var(--primary-l);color:var(--primary-d);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin:0 auto 16px;justify-content:center}
/* איך משחקים — בפתיחה, מעל "התחילו!" */
.howto{background:var(--primary-l);border-radius:14px;padding:14px 18px;margin:4px 0 18px;text-align:right}
.howto-title{font-size:14px;font-weight:800;color:var(--primary-d);margin-bottom:8px}
.howto ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.howto li{font-size:15px;line-height:1.5;color:var(--dark);padding-right:16px;position:relative}
.howto li::before{content:'';position:absolute;right:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--primary)}
/* שורת הוראה קבועה בראש מסך המשחק */
.game-howto{font-size:14px;font-weight:700;color:var(--primary-d);background:var(--primary-l);border-radius:12px;padding:10px 14px;margin-bottom:12px;text-align:center;line-height:1.45}
.game-howto:empty{display:none}
/* הודעה קצרה בתוך המשחק (נכון / לא נכון / מידע) */
.g-msg{min-height:24px;text-align:center;font-size:14px;font-weight:700;margin:8px 0;border-radius:10px;padding:2px 8px;line-height:1.5}
.g-msg.wrong{color:var(--wrong);background:var(--wrong-l)}
.g-msg.correct{color:#2D7A54;background:var(--green-l)}
.g-msg.info{color:var(--gray)}
.fb-head{display:inline-flex;align-items:center;gap:6px}

/* Trivia */
.q-counter{font-size:13px;color:var(--primary);font-weight:700;letter-spacing:1px;margin-bottom:6px}
.q-text{font-size:20px;font-weight:700;font-family:'Assistant',sans-serif;line-height:1.5;margin-bottom:22px}
.q-options{display:flex;flex-direction:column;gap:10px}
.q-opt{background:var(--bg);border:2px solid rgba(0,0,0,.05);border-radius:14px;padding:16px 20px;font-size:16px;cursor:pointer;transition:all .3s;text-align:right;display:flex;align-items:center;gap:12px}
.q-opt:hover{background:var(--primary-l);border-color:var(--primary)}
.q-opt .opt-letter{width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.q-opt .opt-mark{margin-right:auto;display:none}
.q-opt.correct .opt-mark,.q-opt.wrong .opt-mark{display:inline-block}
.q-opt.correct{background:var(--green-l);border-color:var(--green);color:#2D7A54}.q-opt.correct .opt-letter{background:var(--green);color:white}
.q-opt.wrong{background:var(--wrong-l);border-color:var(--wrong);color:var(--wrong)}.q-opt.wrong .opt-letter{background:var(--wrong);color:white}
.q-opt.disabled{pointer-events:none;opacity:.7}.q-opt.disabled.dim{opacity:.45}
.q-opt.correct.disabled,.q-opt.wrong.disabled{opacity:1}
.q-feedback{margin-top:16px;padding:16px 20px;border-radius:14px;font-size:15px;line-height:1.6;display:none}
.q-feedback.show{display:block}.q-feedback.correct{background:var(--green-l);color:#2D7A54}.q-feedback.wrong{background:var(--wrong-l);color:var(--wrong)}

/* Matching */
.match-progress{text-align:center;font-size:14px;font-weight:700;color:var(--primary);margin-bottom:16px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.match-col-title{font-size:13px;font-weight:700;color:var(--gray);text-align:center;margin-bottom:8px}
.match-item{display:block;width:100%;min-height:44px;background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:12px 14px;text-align:center;font-size:15px;font-weight:600;line-height:1.4;cursor:pointer;transition:all .3s;margin-bottom:8px;overflow-wrap:anywhere}
.match-item:hover{border-color:var(--primary)}
.match-item.selected{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d);box-shadow:0 0 0 3px rgba(18,77,122,.15)}
.match-item.matched{background:var(--green-l);border-color:var(--green);color:#2D7A54;pointer-events:none;opacity:.7}
.match-item.wrong-flash{background:var(--wrong-l);border-color:var(--wrong);color:var(--wrong);animation:shake .4s ease}

/* Ordering */
.order-instruction{background:var(--primary-l);padding:14px 20px;border-radius:14px;text-align:center;font-size:15px;font-weight:600;color:var(--primary-d);margin-bottom:12px}
.order-ends{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gray);margin:0 4px 6px}
.order-list{display:flex;flex-direction:column;gap:8px}
.order-item{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;transition:all .3s}
.order-item .oi-num{width:30px;height:30px;border-radius:10px;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.order-item .oi-text{flex:1;font-size:15px;font-weight:600;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.order-item .oi-pos{display:block;font-size:13px;font-weight:700;margin-top:2px}
.order-item .oi-arrows{display:flex;gap:6px;flex-shrink:0}
.order-item .oi-arrows button{width:44px;height:44px;border-radius:10px;background:white;cursor:pointer;transition:background .2s;border:1px solid #CBD5E1;color:var(--primary-d);display:flex;align-items:center;justify-content:center}
.order-item .oi-arrows button:hover{background:var(--primary-l)}
.order-item .oi-arrows button:disabled{opacity:.3;cursor:default}
.order-item.correct-pos{border-color:var(--green);background:var(--green-l)}
.order-item.correct-pos .oi-pos{color:#2D7A54}
.order-item.wrong-pos{border-color:var(--wrong);background:var(--wrong-l)}
.order-item.wrong-pos .oi-pos{color:var(--wrong)}
.check-btn{margin-top:16px}

/* Escape Room */
.escape-room-card{text-align:center}
.escape-room-title{font-family:'Assistant',sans-serif;font-size:22px;font-weight:800;margin-bottom:16px;color:var(--primary-d);display:flex;align-items:center;justify-content:center;gap:8px}
.escape-story{background:var(--bg);border-radius:14px;padding:18px 20px;font-size:15px;line-height:1.8;margin-bottom:16px;text-align:right}
.escape-riddle{background:var(--accent-l);border-radius:14px;padding:18px 20px;font-size:16px;font-weight:700;line-height:1.6;margin-bottom:20px;text-align:center;border:2px solid var(--accent)}
.escape-input-row{display:flex;gap:10px;margin-bottom:12px}
.escape-input-row input{flex:1;min-width:0;padding:14px 18px;border:2px solid var(--border);border-radius:14px;font-family:'Assistant',sans-serif;font-size:16px;text-align:center}
.escape-input-row input:focus{outline:none;border-color:var(--primary)}
.escape-input-row input.shake-input{animation:shake .4s ease;border-color:var(--wrong)}
.escape-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.escape-hint-btn{background:var(--accent-l);color:#7A4E07;border:2px solid var(--accent);width:auto;min-height:44px;padding:10px 20px;font-size:14px;margin-bottom:12px}
.escape-hint-btn:hover{background:var(--accent);color:white}
.escape-hint-btn:disabled{opacity:.45;pointer-events:none}
.escape-reveal-btn{background:white;color:var(--primary-d);border:2px solid var(--primary);width:auto;min-height:44px;padding:10px 20px;font-size:14px;margin-bottom:12px}
.escape-reveal-btn:hover{background:var(--primary-l)}
.escape-hint-text{background:var(--accent-l);border-radius:12px;padding:14px 18px;font-size:14px;color:#92600e;margin-bottom:12px;display:none}
.escape-feedback{padding:16px;border-radius:14px;text-align:center;font-size:16px;font-weight:700;margin-top:12px;display:none}
.escape-feedback.correct{display:block;background:var(--green-l);color:#2D7A54}
.escape-feedback.shown{display:block;background:var(--bg);color:var(--dark);border:2px solid #CBD5E1}
.escape-celebration{text-align:center;padding:30px 20px}
.escape-celebration .big-icon{color:var(--green);margin-bottom:16px;display:flex;justify-content:center}
.escape-celebration .big-text{font-family:'Assistant',sans-serif;font-size:26px;font-weight:900;color:var(--primary-d);margin-bottom:8px}

/* Memory */
.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.memory-card{display:block;width:100%;aspect-ratio:3/4;border-radius:14px;cursor:pointer;position:relative;perspective:600px}
.memory-card-inner{display:block;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;position:relative}
.memory-card.flipped .memory-card-inner{transform:rotateY(180deg)}
.memory-card-face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;backface-visibility:hidden;font-size:14px;font-weight:700;padding:8px 6px;text-align:center;overflow-wrap:anywhere;line-height:1.3;overflow:hidden}
.memory-card-back{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:white;font-size:28px}
.memory-card-front{background:var(--bg);border:2px solid var(--border);color:var(--dark);transform:rotateY(180deg)}
.memory-card-front .mc-lbl{font-size:10px;font-weight:700;color:var(--gray);letter-spacing:.5px}
.memory-card-front .mc-txt{display:block}
.memory-card-front.long{font-size:12px}
.memory-card.miss .memory-card-front{border-color:var(--wrong);background:var(--wrong-l)}
.memory-card.matched .memory-card-front{background:var(--green-l);border-color:var(--green);color:#2D7A54}
.memory-card.matched{pointer-events:none}
.memory-counter{text-align:center;font-size:14px;font-weight:700;color:var(--primary);margin-bottom:8px}

/* Wheel */
.wheel-container{text-align:center;position:relative;margin-bottom:20px}
.wheel-canvas-wrap{position:relative;display:inline-block;margin:0 auto}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--dark);z-index:5;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.wheel-canvas{border-radius:50%;box-shadow:0 4px 24px rgba(0,0,0,.15);max-width:100%;height:auto}
.wheel-spin-btn{background:var(--primary);color:white;width:auto;padding:14px 40px;font-size:18px;margin-top:16px;border-radius:50px}
.wheel-spin-btn:hover{background:var(--primary-d);transform:translateY(-2px)}
.wheel-spin-btn:disabled{opacity:.4;pointer-events:none}
.wheel-popup{margin-top:20px;display:none;scroll-margin-top:12px}
.wheel-popup.show{display:block}
.wheel-q-text{font-size:18px;font-weight:700;font-family:'Assistant',sans-serif;margin-bottom:16px;line-height:1.5}
.wheel-counter{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:10px}

/* True/False */
.tf-statement{font-size:20px;font-weight:700;font-family:'Assistant',sans-serif;text-align:center;line-height:1.6;padding:30px 20px;margin-bottom:24px;background:var(--bg);border-radius:14px}
.tf-buttons{display:flex;gap:12px;margin-bottom:16px}
.tf-btn{flex:1;padding:20px;border:3px solid transparent;border-radius:16px;font-size:20px;font-weight:800;cursor:pointer;transition:all .3s;font-family:'Assistant',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.tf-btn-true{background:var(--green-l);color:#2D7A54;border-color:var(--green)}.tf-btn-true:hover{background:var(--green);color:white;transform:translateY(-3px)}
.tf-btn-false{background:var(--sec-l);color:#0B5E75;border-color:var(--secondary)}.tf-btn-false:hover{background:var(--secondary);color:white;transform:translateY(-3px)}
.tf-btn.selected-correct{background:var(--green);color:white;border-color:var(--green);transform:scale(1.05)}
.tf-btn.selected-wrong{background:var(--wrong);color:white;border-color:var(--wrong);transform:scale(1.05)}
.tf-btn.disabled{pointer-events:none;opacity:.5}
.tf-btn.disabled.selected-correct,.tf-btn.disabled.selected-wrong{opacity:1}

/* Fill Blank */
.fb-sentence{font-size:19px;font-weight:600;line-height:1.8;text-align:center;margin-bottom:20px;padding:20px;background:var(--bg);border-radius:14px}
.fb-blank{display:inline-block;border-bottom:3px solid var(--primary);padding:0 4px;color:var(--primary);font-weight:800;white-space:nowrap}
.fb-blank .fb-pre{color:var(--dark)}
.fb-slot{display:inline-block;min-width:60px;text-align:center}
.fb-pre+.fb-slot{text-align:right}
.fb-input-row{display:flex;gap:10px;margin-bottom:12px}
.fb-input-row input{flex:1;min-width:0;padding:14px 18px;border:2px solid var(--border);border-radius:14px;font-family:'Assistant',sans-serif;font-size:16px;text-align:center}
.fb-input-row input:focus{outline:none;border-color:var(--primary)}
.fb-input-row input.shake-input{animation:shake .4s ease;border-color:var(--wrong)}
.fb-hint-btn{background:var(--accent-l);color:#7A4E07;border:2px solid var(--accent);width:auto;min-height:44px;padding:10px 20px;font-size:14px;margin-bottom:12px}
.fb-hint-btn:hover{background:var(--accent);color:white}
.fb-hint-btn:disabled{opacity:.45;pointer-events:none}
.fb-hint-text{background:var(--accent-l);border-radius:12px;padding:12px 16px;font-size:14px;color:#92600e;margin-bottom:12px;display:none}
.fb-feedback{padding:14px;border-radius:14px;text-align:center;font-size:16px;font-weight:700;margin-top:12px;display:none}
.fb-feedback.show{display:block}
.fb-feedback.correct{background:var(--green-l);color:#2D7A54}
.fb-feedback.wrong{background:var(--wrong-l);color:var(--wrong)}

/* Sentence */
.sentence-target{min-height:60px;background:var(--bg);border:2px dashed #CBD5E1;border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;justify-content:center}
.sentence-target.empty::after{content:'המשפט ייבנה כאן';color:var(--gray-l);font-size:14px}
.sentence-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.word-chip{min-height:44px;min-width:44px;padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;line-height:1.3;cursor:pointer;transition:all .3s;user-select:none;text-align:center}
.word-chip-pool{background:var(--primary-l);color:var(--primary-d);border:2px solid var(--primary)}
.word-chip-pool:hover{background:var(--primary);color:white;transform:translateY(-2px)}
.word-chip-pool.used{opacity:.3;pointer-events:none}
.word-chip-target{background:white;color:var(--dark);border:2px solid #CBD5E1}
.word-chip-target:hover{border-color:var(--primary);color:var(--primary)}
.sentence-feedback{padding:14px;border-radius:14px;text-align:center;font-size:15px;font-weight:700;margin-top:12px;display:none}
.sentence-feedback.show{display:block}
.sentence-feedback.correct{background:var(--green-l);color:#2D7A54}
.sentence-feedback.wrong{background:var(--wrong-l);color:var(--wrong)}

/* Groups — מיון לקבוצות גלויות (11.11.26): לוחצים על כרטיס ואז על הקבוצה */
.groups-help{text-align:center;font-size:15px;font-weight:700;color:var(--dark);margin-bottom:14px;line-height:1.5}
.groups-boxes{display:grid;grid-template-columns:repeat(var(--gcols,4),minmax(0,1fr));gap:10px;margin-bottom:12px}
.groups-box{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:96px;padding:10px;border:2px dashed #B6C4D2;border-radius:14px;text-align:center;transition:border-color .2s,box-shadow .2s}
.groups-boxes.armed .groups-box:not(.full){border-style:solid;border-color:var(--primary);box-shadow:0 0 0 3px rgba(18,77,122,.12)}
.groups-box.drag-over{box-shadow:0 0 0 4px rgba(18,77,122,.3)}
.groups-box.full{border-style:solid;border-color:transparent}
.groups-box-name{font-size:15px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.groups-box-count{font-size:12px;font-weight:700;opacity:.75}
.groups-box-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.groups-chip{background:rgba(255,255,255,.85);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;animation:popIn .3s ease}
.groups-msg{min-height:24px;text-align:center;font-size:14px;font-weight:700;margin-bottom:10px;border-radius:10px;padding:2px 8px}
.groups-msg.wrong{color:var(--wrong);background:var(--wrong-l)}
.groups-msg.correct{color:#2D7A54;background:var(--green-l)}
.groups-msg.info{color:var(--gray)}
.groups-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.groups-card{min-height:48px;padding:10px 12px;background:#fff;border:2px solid #CBD5E1;border-radius:12px;text-align:center;font-size:15px;font-weight:600;line-height:1.4;color:var(--dark);white-space:normal;overflow-wrap:anywhere;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.groups-card:hover{border-color:var(--primary)}
.groups-card.selected{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d);transform:translateY(-2px);box-shadow:var(--shadow)}
.groups-card.wrong-flash{animation:shake .4s ease;border-color:var(--wrong)}
.groups-colors-0{background:#E8F2FF;color:#0D3B66}
.groups-colors-1{background:#E4FAF7;color:#0B5E55}
.groups-colors-2{background:#FEF3C7;color:#7A4E07}
.groups-colors-3{background:#EDE9FE;color:#4C2E8F}

/* Hangman */
.hangman-word{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;padding:16px 8px}
.hangman-letter-slot{width:36px;height:44px;border-bottom:3px solid var(--dark);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;font-family:'Assistant',sans-serif}
.hangman-letter-slot.revealed{color:var(--green);border-color:var(--green)}
.hangman-letter-slot.missed{color:var(--wrong);border-color:var(--wrong)}
.hangman-letter-slot.fixed{border-color:transparent;color:var(--dark)}
.hangman-hint{background:var(--accent-l);border-radius:14px;padding:14px 18px;text-align:center;font-size:15px;font-weight:600;color:#92600e;margin-bottom:16px}
.hangman-status{text-align:center;margin-bottom:8px;font-size:16px;font-weight:700;color:var(--dark)}
.hangman-status.low{color:var(--wrong)}
.hangman-lives{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.hangman-lives .life-dot{width:14px;height:14px;border-radius:50%;background:var(--green);transition:all .3s}
.hangman-lives .life-dot.lost{background:var(--wrong);opacity:.35}
.hangman-keyboard{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.hangman-key{width:44px;height:44px;border:2px solid #CBD5E1;border-radius:10px;background:var(--bg);font-size:18px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-family:'Assistant',sans-serif}
.hangman-key:hover{background:var(--primary-l);border-color:var(--primary)}
.hangman-key.correct-key{background:var(--green-l);border-color:var(--green);color:#2D7A54;pointer-events:none}
.hangman-key.wrong-key{background:var(--wrong-l);border-color:var(--wrong);color:var(--wrong);pointer-events:none;opacity:.55}
.hangman-result{padding:16px;border-radius:14px;text-align:center;font-size:16px;font-weight:700;margin-top:12px;display:none}
.hangman-result.show{display:block}
.hangman-result.win{background:var(--green-l);color:#2D7A54}
.hangman-result.lose{background:var(--wrong-l);color:var(--wrong)}

/* Millionaire */
.mill-layout{display:flex;gap:20px;align-items:flex-start}
.mill-main{flex:1;min-width:0}
.mill-side{width:140px;flex-shrink:0}
.mill-ladder{display:flex;flex-direction:column-reverse;gap:4px}
.mill-ladder-item{padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;text-align:center;background:var(--bg);color:var(--gray);transition:all .3s;font-family:'Assistant',sans-serif;border:2px solid transparent}
.mill-ladder-item.current{background:var(--accent);color:white;transform:scale(1.08);box-shadow:0 2px 10px rgba(233,163,25,.3)}
.mill-ladder-item.passed{background:var(--green-l);color:#2D7A54}
.mill-ladder-item.checkpoint{border-color:var(--accent);font-weight:800}
.mill-ladder-item.checkpoint.passed{border-color:var(--accent)}
.mill-legend{font-size:12px;color:var(--gray);text-align:center;margin-top:8px;line-height:1.4}
.mill-legend .sw{display:inline-block;width:14px;height:10px;border:2px solid var(--accent);border-radius:3px;vertical-align:-1px;margin-left:4px}
.mill-lifeline{display:flex;gap:10px;margin-bottom:16px;justify-content:center}
.mill-lifeline-btn{min-height:44px;min-width:88px;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s;background:var(--accent-l);color:#7A4E07;border:2px solid var(--accent);font-family:'Assistant',sans-serif}
.mill-lifeline-btn:hover{background:var(--accent);color:white}
.mill-lifeline-btn.used{opacity:.3;pointer-events:none;text-decoration:line-through}
.mill-q-text{font-size:18px;font-weight:700;font-family:'Assistant',sans-serif;line-height:1.5;margin-bottom:18px}

/* Score */
.score-icon{text-align:center;margin-bottom:12px;display:flex;justify-content:center}
.score-num{font-size:5rem;font-weight:900;font-family:'Assistant',sans-serif;text-align:center;line-height:1}
.score-label{font-size:16px;color:var(--gray);text-align:center;margin-top:4px}
.score-msg{font-size:20px;font-weight:700;text-align:center;margin-top:20px;padding:16px;border-radius:14px}
.score-details{margin-top:20px;display:flex;gap:12px;justify-content:center}
.score-detail{background:var(--bg);border-radius:14px;padding:14px 20px;text-align:center;flex:1}
.score-detail .num{font-size:24px;font-weight:900;font-family:'Assistant',sans-serif}
.score-detail .lbl{font-size:12px;color:var(--gray);margin-top:4px}
.send-status{margin-top:16px;padding:14px;border-radius:12px;text-align:center;font-size:15px;display:none}
.send-status.success{display:block;background:var(--green-l);color:#2D7A54}
.send-status.error{display:block;background:var(--wrong-l);color:var(--wrong)}
.retry-btn{margin-top:16px;background:var(--bg);color:var(--primary-d);border:2px solid var(--primary);font-weight:600}
.retry-btn:hover{background:var(--primary-l)}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes popIn{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes celebrate{0%{transform:scale(1)}25%{transform:scale(1.1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}75%{transform:scale(1.1) rotate(-2deg)}100%{transform:scale(1)}}

@media(max-width:500px){

  .mill-layout{flex-direction:column}

  .mill-ladder{flex-direction:row;flex-wrap:wrap;justify-content:center}

  .order-item{padding:8px 10px;gap:8px}
}

const FINAL_LETTERS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
function normAnswer(s) {
  let t = String(s == null ? '' : s).toLowerCase();
  t = t.replace(/[־\-‐‑‒–—_\/]/g, ' ');            /* מקף עברי ומקפים — רווח */
  t = t.replace(/[֑-ׇ]/g, '');                 /* ניקוד וטעמים */
  t = t.replace(/['"`׳״’‘“”„.,!?;:()\[\]{}…]/g, '');     /* גרשיים, מירכאות וסימני פיסוק */
  t = t.replace(/[ךםןףץ]/g, ch => FINAL_LETTERS[ch]);
  return t.split(/\s+/).filter(Boolean).map(w => (w.length > 2 && w[0] === 'ה') ? w.slice(1) : w).join(' ');
}
function answerMatches(typed, answer) {
  const a = normAnswer(typed);
  return !!a && a === normAnswer(answer);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(str) {
  if (str == null || str === '') return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function setProgress(fraction) {
  document.getElementById('progressFill').style.width = (fraction * 100) + '%';

function fbHead(ok, okText, badText) {

function optMark() { return '<span class="opt-mark"></span>'; }
function markOptions(els, correctIdx, chosenIdx) {
  els.forEach((o, i) => {
    o.classList.add('disabled');
    o.disabled = true;
    const mk = o.querySelector('.opt-mark');
    if (i === correctIdx) { o.classList.add('correct'); if (mk) mk.innerHTML = svgIcon('check', 18); }
    else if (i === chosenIdx) { o.classList.add('wrong'); if (mk) mk.innerHTML = svgIcon('x', 18); }
    else o.classList.add('dim');
  });
}

// ===== LOAD GAME FROM GOOGLE SHEETS =====
/* משחק שנבנה במחולל השיעורים (11.10.26): ?lid=<32 תווים> — נטען מהשרת "מחולל - מוח".
   התוצאה נשלחת לשרת של המחולל (לא לגיליון של נגן המשחקים), ולכן כפתור "שלחו תוצאות למורה" מוסתר:
   הציון נשלח לבד — כל כמה שניות בזמן המשחק (בשביל הלוח החי של המורה) ובסוף.
   השם והכיתה — מה שהתלמיד/ה כבר כתב/ה בעמוד השיעור (pmh.student), כיתה בטקסט חופשי.
   &t=1 = התצוגה אצל המורה במחולל: בלי שם ובלי שליחה. */
const MECHOLEL_API = 'https://script.google.com/macros/s/AKfycbwAAve_lLJpWGxxh1gUHmJ_1aZ4J8bt7ush3WQYcgOfdCtWcz1TxOn1_YhUn0K-dnlr3w/exec';
let GP = null;
function gpLS(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function gpSid() {
  let s = gpLS('pmh.sid');
  if (s && /^[a-f0-9]{16}$/.test(s)) return s;
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  s = Array.from(a, b => ('0' + b.toString(16)).slice(-2)).join('');
  try { localStorage.setItem('pmh.sid', JSON.stringify(s)); } catch (e) {}
  return s;
}
function gpSend(done) {
  if (!GP || GP.teacher || !studentName) return;
  const m = Math.max(1, totalItems || 1), s = Math.min(m, Math.max(0, Math.round(correctItems)));
  const key = s + '/' + m + '/' + done;
  if (key === GP.last) return;
  GP.last = key;
  const st = document.getElementById('sendStatus');
  fetch(MECHOLEL_API, { method: 'POST', body: JSON.stringify({ action: 'submit', lid: GP.lid, kind: 'game', sid: gpSid(),
    name: studentName, cls: studentClass, score: s, max: m, done: done }) })
    .then(r => r.json()).then(d => { if (done && st) { st.className = 'send-status ' + (d && d.ok ? 'success' : 'error'); st.innerHTML = d && d.ok ? svgIcon('check', 18) + ' התוצאה נשלחה למורה' : 'התוצאה לא נשלחה. נסו לשחק שוב כשיש חיבור.'; } })
    .catch(() => { GP.last = ''; if (done && st) { st.className = 'send-status error'; st.textContent = 'התוצאה לא נשלחה. נסו לשחק שוב כשיש חיבור.'; } });
}
/* בזמן המשחק — עדכון כל 3 שניות, רק כשהציון השתנה */
function gpStart() {
  if (!GP || GP.teacher) return;
  clearInterval(GP.tm); GP.last = '';
  setTimeout(() => gpSend(false), 400);   /* אחרי שהמשחק אתחל את מספר הפריטים */
  GP.tm = setInterval(() => gpSend(false), 3000);
}
function loadGeneratedGame(lid, teacher) {
  fetch(MECHOLEL_API + '?lesson=' + lid).then(r => r.json()).then(d => {
    const g = d && d.ok && d.data && d.data.game;
    if (!g || !g.gameType) { showError('המשחק לא נמצא', 'ייתכן שהקישור שגוי או שהמשחק עוד נבנה. נסו שוב בעוד רגע.'); return; }
    gameMeta = { name: d.data.topic || '', subject: d.data.subject || '', grade: String(d.data.grade || '').replace(/[׳״'"]/g, ''), noSend: true };
    gameConfig = g;
    GP = { lid: lid, teacher: !!teacher, last: '', tm: 0 };
    document.querySelectorAll('[onclick="sendResults()"]').forEach(b => { b.style.display = 'none'; });
    /* כיתה בטקסט חופשי במקום רשימה קבועה */
    const sel = document.getElementById('studentClass'), inp = document.createElement('input');
    inp.type = 'text'; inp.id = 'studentClass'; inp.maxLength = 20; inp.placeholder = 'למשל: י׳2';
    sel.parentNode.replaceChild(inp, sel);
    inp.addEventListener('input', checkInputs);
    const me = gpLS('pmh.student') || {};
    if (teacher) {
      nameInput.value = 'מורה'; inp.value = '-';
      document.querySelectorAll('#introScreen .input-group').forEach(x => { x.style.display = 'none'; });
    } else { nameInput.value = me.name || ''; inp.value = me.cls || ''; }
    setupIntro();
    checkInputs();
  }).catch(() => showError('שגיאה בחיבור', 'לא ניתן להתחבר לשרת. בדקו את החיבור לאינטרנט.'));
}

function loadGame() {
  const params = new URLSearchParams(window.location.search);
  const lid = params.get('lid');
  if (/^[a-f0-9]{32}$/.test(lid || '')) { loadGeneratedGame(lid, params.get('t') === '1'); return; }
  const gameId = params.get('id');

  if (!gameId) {
    showError('לא צוין מזהה משחק', 'הקישור חסר פרמטר id. בקשו מהמורה קישור חדש.');
    return;
  }

  const callbackName = 'gameCallback_' + Date.now();
  window[callbackName] = function(data) {
    delete window[callbackName];
    if (data.error) {
      showError('המשחק לא נמצא', 'ייתכן שהקישור שגוי או שהמשחק הוסר.');
      return;
    }
    try {
      gameMeta = data;
      gameConfig = JSON.parse(data.gameJSON);
      setupIntro();
    } catch (e) {
      showError('שגיאה בטעינת המשחק', 'הנתונים לא תקינים. נסו לרענן את הדף.');
    }
  };

  const script = document.createElement('script');
  script.src = SHEETS_URL + '?action=getGame&id=' + encodeURIComponent(gameId) + '&callback=' + callbackName;
  script.onerror = function() {
    delete window[callbackName];
    showError('שגיאה בחיבור', 'לא ניתן להתחבר לשרת. בדקו את החיבור לאינטרנט.');
  };

  setTimeout(function() {
    if (window[callbackName]) {
      delete window[callbackName];
      showError('זמן הטעינה עבר', 'השרת לא מגיב. נסו לרענן את הדף.');
    }
  }, 15000);

  document.body.appendChild(script);
}

let triviaQ = 0, triviaItems = [];
function initTrivia() {
  triviaItems = gameConfig.settings && gameConfig.settings.shuffleItems ? shuffle(gameConfig.items) : [...gameConfig.items];
  totalItems = triviaItems.length; triviaQ = 0; score = 0; correctItems = 0; wrongItems = 0;
  renderTriviaQ();
}
function renderTriviaQ() {
  const q = triviaItems[triviaQ], n = triviaQ + 1;
  setProgress(n / totalItems);
  const L = ['א','ב','ג','ד'];
  document.getElementById('gameArea').innerHTML =
    '<div class="q-counter">שאלה ' + n + ' מתוך ' + totalItems + '</div>' +
    '<div class="q-text">' + escapeHtml(q.text) + '</div>' +
    '<div class="q-options">' + q.options.map((o, i) =>
      '<button type="button" class="q-opt plain-btn" onclick="triviaAnswer(' + i + ')"><span class="opt-letter">' + L[i] + '</span><span>' + escapeHtml(o) + '</span>' + optMark() + '</button>'
    ).join('') + '</div>' +
    '<div class="q-feedback" id="qFeedback" role="status"></div>' +
    '<button class="btn btn-next" id="nextBtn" onclick="nextTrivia()">הבא</button>';
}
function triviaAnswer(idx) {
  const q = triviaItems[triviaQ], ok = idx === q.correct;
  markOptions(document.querySelectorAll('.q-opt'), q.correct, idx);
  const fb = document.getElementById('qFeedback');
  fb.className = 'q-feedback show ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = fbHead(ok, 'נכון!', 'לא נכון.') + ' ' + escapeHtml(q.explanation || '');
  if (ok) { score++; correctItems++; } else wrongItems++;
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').textContent = triviaQ < totalItems - 1 ? 'הבא' : 'סיום';
}
function nextTrivia() {
  triviaQ++;
  if (triviaQ >= totalItems) { showScore(); return; }
  animateCard();
  renderTriviaQ();
}
