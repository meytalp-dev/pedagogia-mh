// ===== MATCHING =====
// ==========================================
/* 11.11.26: כל טעות נספרת. זוג נחשב "נכון" רק אם המושג הותאם בלי טעות. המושג נשאר בחור אחרי טעות.
   בטלפון עמודת המושגים דבוקה למעלה (CSS) — אין גלילה הלוך-חזור. */
let matchPairs = [], matchedCount = 0, selectedRight = null, matchMistakes = 0, matchMissed = {};
function initMatching() {
  matchPairs = [...gameConfig.items]; totalItems = matchPairs.length;
  matchedCount = 0; selectedRight = null; score = 0; correctItems = 0; wrongItems = 0;
  matchMistakes = 0; matchMissed = {};
  const rightItems = shuffle(matchPairs.map((p, i) => ({ text: p.right, idx: i })));
  const leftItems = shuffle(matchPairs.map((p, i) => ({ text: p.left, idx: i })));
  const rTitle = gameConfig.columnRightTitle || 'מושג';
  const lTitle = gameConfig.columnLeftTitle || 'הגדרה';
  setProgress(0);
  document.getElementById('gameArea').innerHTML =
    '<div class="match-progress" id="matchProg"></div>' +
    '<div class="match-grid">' +
    '<div class="match-col match-col-r"><div class="match-col-title">' + escapeHtml(rTitle) + '</div><div class="match-list">' + rightItems.map(r =>
      '<button type="button" class="match-item match-right plain-btn" data-idx="' + r.idx + '" aria-pressed="false" onclick="selectRight(this)">' + escapeHtml(r.text) + '</button>'
    ).join('') + '</div><div class="g-msg" id="matchMsg" role="status" aria-live="polite"></div></div>' +
    '<div class="match-col match-col-l"><div class="match-col-title">' + escapeHtml(lTitle) + '</div><div class="match-list">' + leftItems.map(l =>
      '<button type="button" class="match-item match-left plain-btn" data-idx="' + l.idx + '" onclick="selectLeft(this)">' + escapeHtml(l.text) + '</button>'
    ).join('') + '</div></div>' +
    '</div>';
  matchUpdateProg();
}
function matchUpdateProg() {
  document.getElementById('matchProg').textContent = matchedCount + ' מתוך ' + totalItems + ' זוגות · טעויות: ' + matchMistakes;
}
function matchMsg(t, cls) {
  const m = document.getElementById('matchMsg');
  if (m) { m.className = 'g-msg' + (cls ? ' ' + cls : ''); m.textContent = t || ''; }
}
function selectRight(el) {
  if (el.classList.contains('matched')) return;
  document.querySelectorAll('.match-right').forEach(r => { r.classList.remove('selected'); r.setAttribute('aria-pressed', 'false'); });
  el.classList.add('selected'); el.setAttribute('aria-pressed', 'true'); selectedRight = el;
  matchMsg('עכשיו לחצו על ההגדרה המתאימה', 'info');
}
function selectLeft(el) {
  if (el.classList.contains('matched')) return;
  if (!selectedRight) { matchMsg('קודם בחרו מושג', 'info'); return; }
  const rIdx = parseInt(selectedRight.dataset.idx), lIdx = parseInt(el.dataset.idx);
  if (rIdx === lIdx) {
    selectedRight.classList.remove('selected'); selectedRight.classList.add('matched');
    selectedRight.setAttribute('aria-pressed', 'false');
    selectedRight.disabled = true; el.disabled = true;
    el.classList.add('matched'); matchedCount++;
    if (!matchMissed[rIdx]) { correctItems++; score++; }
    matchUpdateProg();
    setProgress(matchedCount / totalItems);
    selectedRight = null;
    matchMsg('נכון!', 'correct');
    if (matchedCount === totalItems) setTimeout(matchEnd, 700);
  } else {
    matchMistakes++; wrongItems = matchMistakes; matchMissed[rIdx] = true;
    matchUpdateProg();
    const r = selectedRight;
    r.classList.add('wrong-flash'); el.classList.add('wrong-flash');
    setTimeout(() => { r.classList.remove('wrong-flash'); el.classList.remove('wrong-flash'); }, 600);
    matchMsg('זה לא הזוג, נסו שוב', 'wrong');
  }
}
function matchEnd() {
  showScore({ details: [[correctItems, 'זוגות בלי טעות', 'var(--green)'], [matchMistakes, 'טעויות', 'var(--wrong)'], [totalItems, 'זוגות', 'var(--primary)']] });
}

// ==========================================
// ===== ORDERING =====
// ==========================================
/* 11.11.26: הציון לפי צמדים סמוכים בסדר הנכון (פריט אחד שזז לא מוחק את כל השאר).
   אחרי "בדקו" — המקום הנכון של כל פריט, וכפתור "לסיכום" (בלי מעבר אוטומטי). */
let orderItems = [], orderChecked = false;
function initOrdering() {
  const base = gameConfig.items.map((item, i) => ({ ...item, correctPos: item.position || i + 1 }));
  orderItems = shuffle(base);
  for (let k = 0; k < 10 && base.length > 1 && orderItems.every((it, i) => i === 0 || orderItems[i - 1].correctPos < it.correctPos); k++) orderItems = shuffle(base);
  totalItems = Math.max(1, orderItems.length - 1); score = 0; correctItems = 0; wrongItems = 0; orderChecked = false;
  setProgress(0);
  renderOrder();
}
function renderOrder(focusIdx, focusDir) {
  const inst = gameConfig.instruction || 'סדרו את הפריטים בסדר הנכון';
  const n = orderItems.length;
  let html = '<div class="order-instruction">' + escapeHtml(inst) + '</div>' +
    '<div class="order-ends"><span>הראשון</span></div>' +
    '<div class="order-list" id="orderList">' + orderItems.map((item, i) => {
      let cls = 'order-item', pos = '';
      if (orderChecked) {
        const right = item.correctPos === i + 1;
        cls += right ? ' correct-pos' : ' wrong-pos';
        pos = '<span class="oi-pos">' + (right ? svgIcon('check', 14) + ' במקום הנכון' : 'מקום נכון: ' + item.correctPos) + '</span>';
      }
      return '<div class="' + cls + '" data-idx="' + i + '">' +
        '<div class="oi-num">' + (i + 1) + '</div>' +
        '<div class="oi-text">' + escapeHtml(item.text) + pos + '</div>' +
        (orderChecked ? '' : '<div class="oi-arrows">' +
          '<button type="button" data-dir="-1" aria-label="הזזה למעלה"' + (i === 0 ? ' disabled' : '') + ' onclick="moveItem(' + i + ',-1)">' + svgIcon('up', 22) + '</button>' +
          '<button type="button" data-dir="1" aria-label="הזזה למטה"' + (i === n - 1 ? ' disabled' : '') + ' onclick="moveItem(' + i + ',1)">' + svgIcon('down', 22) + '</button>' +
          '</div>') +
        '</div>';
    }).join('') + '</div>' +
    '<div class="order-ends"><span></span><span>האחרון</span></div>';
  if (orderChecked) {
    html += '<div class="g-msg ' + (correctItems === totalItems ? 'correct' : 'info') + '" role="status">' +
      correctItems + ' מתוך ' + totalItems + ' צמדים סמוכים בסדר הנכון</div>' +
      '<button class="btn btn-next" style="display:block" onclick="orderEnd()">לסיכום</button>';
  } else {
    html += '<button class="btn btn-primary check-btn" onclick="checkOrder()">בדקו</button>';
  }
  document.getElementById('gameArea').innerHTML = html;
  if (focusIdx != null) {
    const b = document.querySelector('.order-item[data-idx="' + focusIdx + '"] button[data-dir="' + focusDir + '"]');
    const alt = document.querySelector('.order-item[data-idx="' + focusIdx + '"] button:not([disabled])');
    if (b && !b.disabled) b.focus(); else if (alt) alt.focus();
  }
}
function moveItem(idx, dir) {
  if (orderChecked) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= orderItems.length) return;
  [orderItems[idx], orderItems[newIdx]] = [orderItems[newIdx], orderItems[idx]];
  renderOrder(newIdx, dir);
}
function checkOrder() {
  correctItems = 0;
  for (let i = 0; i + 1 < orderItems.length; i++) if (orderItems[i + 1].correctPos === orderItems[i].correctPos + 1) correctItems++;
  if (orderItems.length < 2) correctItems = 1;
  score = correctItems; wrongItems = totalItems - correctItems;
  orderChecked = true;
  setProgress(1);
  renderOrder();
}
function orderEnd() {
  showScore({ details: [[correctItems, 'צמדים בסדר נכון', 'var(--green)'], [wrongItems, 'צמדים לא בסדר', 'var(--wrong)'], [totalItems, 'צמדים סמוכים', 'var(--primary)']] });
}

// ==========================================
// ===== ESCAPE ROOM =====
// ==========================================
/* 11.11.26: השוואה סלחנית (normAnswer); טעות = "עוד לא"; אחרי 3 ניסיונות — "הראו את התשובה" (0 נקודות לחדר);
   רמז = חצי נקודה; מספר החדר מוצג פעם אחת (מהכותרת יורד "חדר 1 ·"). */
let escapeRooms = [], escapeIdx = 0, escapeHintsUsed = {}, escapeTries = 0, escapeDone = false, escapeSolved = 0, escapeRevealed = 0;
function initEscape() {
  escapeRooms = [...gameConfig.items];
  totalItems = escapeRooms.length;
  escapeIdx = 0; score = 0; correctItems = 0; wrongItems = 0;
  escapeHintsUsed = {}; escapeSolved = 0; escapeRevealed = 0;
  renderEscapeRoom();
}
function escapeTitle(t) {
  return String(t || '').replace(/^\s*חדר\s*(מספר\s*)?\d+\s*[·:\-–—.|,]*\s*/, '').trim();
}
function renderEscapeRoom() {
  const room = escapeRooms[escapeIdx];
  const n = escapeIdx + 1;
  const title = escapeTitle(room.title);
  escapeTries = 0; escapeDone = false;
  setProgress(n / (totalItems + 1));
  document.getElementById('gameArea').innerHTML =
    '<div class="q-counter">חדר ' + n + ' מתוך ' + totalItems + '</div>' +
    (title ? '<div class="escape-room-card"><div class="escape-room-title">' + svgIcon('lock', 22) + '<span>' + escapeHtml(title) + '</span></div></div>' : '') +
    '<div class="escape-story">' + escapeHtml(room.story) + '</div>' +
    '<div class="escape-riddle">' + escapeHtml(room.riddle) + '</div>' +
    '<div class="escape-input-row">' +
    '<label class="sr-label" for="escapeInput">התשובה שלכם</label>' +
    '<input type="text" id="escapeInput" placeholder="הקלידו את התשובה..." autocomplete="off">' +
    '<button class="btn btn-primary" id="escapeCheckBtn" style="width:auto;padding:14px 24px" onclick="checkEscapeAnswer()">בדקו</button>' +
    '</div>' +
    '<div class="g-msg" id="escapeMsg" role="status" aria-live="polite"></div>' +
    '<div class="escape-actions">' +
    (room.hint ? '<button class="btn escape-hint-btn" onclick="showEscapeHint()">רמז (חצי נקודה)</button>' : '') +
    '<button class="btn escape-reveal-btn" id="escapeRevealBtn" style="display:none" onclick="revealEscape()">הראו את התשובה</button>' +
    '</div>' +
    '<div class="escape-hint-text" id="escapeHint">' + escapeHtml(room.hint || '') + '</div>' +
    '<div class="escape-feedback" id="escapeFeedback" role="status"></div>' +
    '<button class="btn btn-next" id="escapeNextBtn" onclick="nextEscapeRoom()" style="display:none">החדר הבא</button>';

  document.getElementById('escapeInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkEscapeAnswer();
  });
}
function showEscapeHint() {
  if (escapeDone) return;
  escapeHintsUsed[escapeIdx] = true;
  document.getElementById('escapeHint').style.display = 'block';
  const btn = document.querySelector('.escape-hint-btn');
  if (btn) btn.disabled = true;
}
function escapeFinish(nextLabel) {
  escapeDone = true;
  document.getElementById('escapeInput').disabled = true;
  document.getElementById('escapeCheckBtn').disabled = true;
  const hb = document.querySelector('.escape-hint-btn'); if (hb) hb.style.display = 'none';
  document.getElementById('escapeRevealBtn').style.display = 'none';
  document.getElementById('escapeMsg').textContent = '';
  document.getElementById('escapeMsg').className = 'g-msg';
  const nextBtn = document.getElementById('escapeNextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = escapeIdx < totalItems - 1 ? 'החדר הבא' : 'סיום';
}
function checkEscapeAnswer() {
  if (escapeDone) return;
  const input = document.getElementById('escapeInput');
  const answer = input.value.trim();
  if (!answer) return;
  const room = escapeRooms[escapeIdx];
  if (answerMatches(answer, room.answer)) {
    const hint = !!escapeHintsUsed[escapeIdx];
    score += hint ? 0.5 : 1; correctItems = score; escapeSolved++;
    const fb = document.getElementById('escapeFeedback');
    fb.className = 'escape-feedback correct';
    fb.innerHTML = fbHead(true, 'נכון! פתחתם את החדר.', '') + (hint ? ' (חצי נקודה, כי נעזרתם ברמז)' : '');
    escapeFinish();
  } else {
    escapeTries++;
    input.classList.add('shake-input');
    setTimeout(() => input.classList.remove('shake-input'), 400);
    const m = document.getElementById('escapeMsg');
    m.className = 'g-msg wrong';
    m.textContent = (room.hint && !escapeHintsUsed[escapeIdx]) ? 'עוד לא. נסו שוב או פתחו רמז' : 'עוד לא. נסו שוב';
    if (escapeTries >= 3) document.getElementById('escapeRevealBtn').style.display = '';
    input.select();
  }
}
function revealEscape() {
  if (escapeDone) return;
  const room = escapeRooms[escapeIdx];
  escapeRevealed++; wrongItems = escapeRevealed;
  const fb = document.getElementById('escapeFeedback');
  fb.className = 'escape-feedback shown';
  fb.innerHTML = 'התשובה: <strong>' + escapeHtml(room.answer) + '</strong>. הדלת נפתחה, בלי נקודה על החדר הזה.';
  escapeFinish();
}
function nextEscapeRoom() {
  escapeIdx++;
  if (escapeIdx >= totalItems) {
    setProgress(1);
    document.getElementById('gameArea').innerHTML =
      '<div class="escape-celebration">' +
      '<div class="big-icon" style="animation:celebrate 1s ease">' + svgIcon('unlock', 64) + '</div>' +
      '<div class="big-text">ברחתם בהצלחה!</div>' +
      '<p style="color:var(--gray);margin-top:8px">יצאתם מכל ' + totalItems + ' החדרים</p>' +
      '</div>';
    correctItems = score;   /* חצי נקודה על חדר עם רמז; השרת מעגל */
    totalItems = escapeRooms.length;
    setTimeout(() => showScore({ pct: Math.round(score / Math.max(1, totalItems) * 100),
      details: [[escapeSolved, 'חדרים שפתרתם', 'var(--green)'], [escapeRevealed, 'חדרים שבהם ראיתם את התשובה', 'var(--wrong)'], [totalItems, 'חדרים', 'var(--primary)']] }), 2000);
    return;
  }
  animateCard();
  renderEscapeRoom();
}

// ==========================================
// ===== MEMORY =====
// ==========================================
/* 11.11.26: מונה ניסיונות. ציון = עד 2 ניסיונות לכל זוג = 100; יותר ניסיונות — הציון יורד בהדרגה. */
let memoryCards = [], memoryFlipped = [], memoryMatched = 0, memoryTotal = 0, memoryLocked = false, memoryAttempts = 0, memoryMisses = 0;
function initMemory() {
  const items = gameConfig.items;
  memoryTotal = items.length;
  totalItems = memoryTotal;
  memoryMatched = 0; score = 0; correctItems = 0; wrongItems = 0; memoryLocked = false; memoryAttempts = 0; memoryMisses = 0;

  // Create card pairs: for each item {front, back}, create two cards with the same pairId
  let cards = [];
  items.forEach((item, i) => {
    cards.push({ text: item.front, pairId: i, type: 'front' });
    cards.push({ text: item.back, pairId: i, type: 'back' });
  });
  memoryCards = shuffle(cards);
  memoryFlipped = [];

  setProgress(0);
  renderMemory();
}
function memoryRatio() { return memoryAttempts ? Math.min(1, (2 * memoryTotal) / memoryAttempts) : 1; }
function memoryCounterText() { return 'זוגות: ' + memoryMatched + ' מתוך ' + memoryTotal + ' · ניסיונות: ' + memoryAttempts; }
function renderMemory() {
  const fl = gameConfig.columnRightTitle || 'מושג', bl = gameConfig.columnLeftTitle || 'הגדרה';
  document.getElementById('gameArea').innerHTML =
    '<div class="memory-counter" id="memoryCounter" role="status">' + memoryCounterText() + '</div>' +
    '<div class="memory-grid">' +
    memoryCards.map((card, i) =>
      '<button type="button" class="memory-card plain-btn' + (card.matched ? ' flipped matched' : '') + '" data-idx="' + i + '"' + (card.matched ? ' disabled' : '') + ' aria-label="קלף ' + (i + 1) + '" onclick="flipMemoryCard(' + i + ')">' +
      '<span class="memory-card-inner">' +
      '<span class="memory-card-face memory-card-back">?</span>' +
      '<span class="memory-card-face memory-card-front' + (String(card.text || '').length > 26 ? ' long' : '') + '">' +
      '<span class="mc-lbl">' + escapeHtml(card.type === 'front' ? fl : bl) + '</span>' +
      '<span class="mc-txt">' + escapeHtml(card.text) + '</span></span>' +
      '</span></button>'
    ).join('') +
    '</div>';
}
function flipMemoryCard(idx) {
  if (memoryLocked) return;
  const card = memoryCards[idx];
  if (card.matched) return;

  const el = document.querySelectorAll('.memory-card')[idx];
  if (el.classList.contains('flipped')) return;
  if (memoryFlipped.length >= 2) return;

  el.classList.add('flipped');
  el.setAttribute('aria-label', card.text);
  memoryFlipped.push(idx);

  if (memoryFlipped.length === 2) {
    memoryLocked = true;
    memoryAttempts++;
    const first = memoryCards[memoryFlipped[0]];
    const second = memoryCards[memoryFlipped[1]];

    if (first.pairId === second.pairId && memoryFlipped[0] !== memoryFlipped[1]) {
      // Match!
      setTimeout(() => {
        memoryCards[memoryFlipped[0]].matched = true;
        memoryCards[memoryFlipped[1]].matched = true;
        const cardA = document.querySelectorAll('.memory-card')[memoryFlipped[0]];
        const cardB = document.querySelectorAll('.memory-card')[memoryFlipped[1]];
        cardA.classList.add('matched'); cardB.classList.add('matched');
        cardA.disabled = true; cardB.disabled = true;
        memoryMatched++;
        correctItems = Math.round(memoryMatched * memoryRatio());
        score = correctItems;
        document.getElementById('memoryCounter').textContent = memoryCounterText();
        setProgress(memoryMatched / memoryTotal);
        memoryFlipped = [];
        memoryLocked = false;
        if (memoryMatched === memoryTotal) setTimeout(memoryEnd, 600);
      }, 500);
    } else {
      // No match - flip back
      memoryMisses++; wrongItems = memoryMisses;
      correctItems = Math.round(memoryMatched * memoryRatio());
      document.getElementById('memoryCounter').textContent = memoryCounterText();
      const a = document.querySelectorAll('.memory-card')[memoryFlipped[0]], b = document.querySelectorAll('.memory-card')[memoryFlipped[1]];
      a.classList.add('miss'); b.classList.add('miss');
      setTimeout(() => {
        [a, b].forEach(c => { c.classList.remove('flipped', 'miss'); c.setAttribute('aria-label', 'קלף ' + (+c.dataset.idx + 1)); });
        memoryFlipped = [];
        memoryLocked = false;
      }, 1000);
    }
  }
}
function memoryEnd() {
  const ratio = memoryRatio();
  correctItems = Math.round(memoryTotal * ratio); score = correctItems;
  showScore({ pct: Math.round(ratio * 100),
    details: [[memoryTotal, 'זוגות שמצאתם', 'var(--green)'], [memoryMisses, 'ניסיונות לא מוצלחים', 'var(--wrong)'], [memoryAttempts, 'ניסיונות', 'var(--primary)']] });
}

// ==========================================
// ===== WHEEL OF FORTUNE =====
// ==========================================
/* 11.11.26: בלי מספרים על הפלחים; אחרי תשובה — הסבר וכפתור "סובבו שוב" (בלי טיימר); השאלה נגללת לתצוגה */
let wheelItems = [], wheelAnswered = [], wheelCurrentQ = -1, wheelSpinning = false, wheelCanvas = null, wheelCtx = null, wheelRotation = 0;
function initWheel() {
  wheelItems = gameConfig.settings && gameConfig.settings.shuffleItems ? shuffle(gameConfig.items) : [...gameConfig.items];
  totalItems = wheelItems.length; score = 0; correctItems = 0; wrongItems = 0;
  wheelAnswered = new Array(totalItems).fill(false);
  wheelCurrentQ = -1; wheelSpinning = false; wheelRotation = 0;
  renderWheel();
}
function renderWheel() {
  const size = 300;
  document.getElementById('gameArea').innerHTML =
    '<div class="wheel-container" id="wheelTop">' +
    '<div class="wheel-canvas-wrap">' +
    '<div class="wheel-pointer"></div>' +
    '<canvas id="wheelCanvas" width="' + size + '" height="' + size + '" class="wheel-canvas" aria-hidden="true"></canvas>' +
    '</div>' +
    '</div>' +
    '<div style="text-align:center">' +
    '<div class="wheel-counter" id="wheelCounter">נענו 0 מתוך ' + totalItems + ' שאלות</div>' +
    '<button class="btn wheel-spin-btn" id="wheelSpinBtn" onclick="spinWheel()">סובבו!</button>' +
    '</div>' +
    '<div class="wheel-popup" id="wheelPopup"></div>';

  wheelCanvas = document.getElementById('wheelCanvas');
  wheelCtx = wheelCanvas.getContext('2d');
  drawWheel(0);
  setProgress(0);
}
function drawWheel(rotation) {
  const canvas = wheelCanvas, ctx = wheelCtx;
  const size = canvas.width, cx = size / 2, cy = size / 2, r = size / 2 - 4;
  const n = totalItems;
  const colors = ['#124D7A','#087B9C','#E9A319','#52B788','#6366f1','#1677FF','#f59e0b','#14b8a6','#8b5cf6','#f43f5e','#27C6F3','#84cc16'];

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  for (let i = 0; i < n; i++) {
    const startAngle = (2 * Math.PI / n) * i;
    const endAngle = (2 * Math.PI / n) * (i + 1);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = wheelAnswered[i] ? '#cbd5e1' : colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
  ctx.fillStyle = 'white';
  ctx.fill();
  ctx.strokeStyle = '#D8E6F2';
  ctx.lineWidth = 2;
  ctx.stroke();
}
function spinWheel() {
  if (wheelSpinning) return;
  // Find unanswered questions
  const unanswered = [];
  for (let i = 0; i < totalItems; i++) { if (!wheelAnswered[i]) unanswered.push(i); }
  if (unanswered.length === 0) return;

  wheelSpinning = true;
  document.getElementById('wheelSpinBtn').disabled = true;
  document.getElementById('wheelPopup').className = 'wheel-popup';

  // Pick a random unanswered question
  const targetIdx = unanswered[Math.floor(Math.random() * unanswered.length)];
  const n = totalItems;
  const sliceAngle = 2 * Math.PI / n;
  // The pointer is at the top (angle = -PI/2 = 3PI/2)
  // Target slice center angle = sliceAngle * targetIdx + sliceAngle/2 ; we want A + R = -PI/2 (mod 2PI)
  const targetAngle = sliceAngle * targetIdx + sliceAngle / 2;
  const fullSpins = 4 + Math.floor(Math.random() * 3); // 4-6 full spins
  const finalRotation = fullSpins * 2 * Math.PI + (3 * Math.PI / 2 - targetAngle);

  const startRotation = wheelRotation;
  const totalRotation = finalRotation - (startRotation % (2 * Math.PI));
  const endRotation = startRotation + totalRotation + (totalRotation < 0 ? 2 * Math.PI : 0);

  const duration = 3000;
  const startTime = Date.now();

  function animateSpin() {
    const elapsed = Date.now() - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);   // Ease out cubic
    wheelRotation = startRotation + (endRotation - startRotation) * eased;
    drawWheel(wheelRotation);

    if (t < 1) {
      requestAnimationFrame(animateSpin);
    } else {
      wheelSpinning = false;
      wheelCurrentQ = targetIdx;
      showWheelQuestion(targetIdx);
    }
  }
  requestAnimationFrame(animateSpin);
}
function showWheelQuestion(idx) {
  const q = wheelItems[idx];
  const L = ['א','ב','ג','ד'];
  const popup = document.getElementById('wheelPopup');
  popup.className = 'wheel-popup show';
  popup.innerHTML =
    '<div class="wheel-q-text">' + escapeHtml(q.text) + '</div>' +
    '<div class="q-options">' + q.options.map((o, i) =>
      '<button type="button" class="q-opt plain-btn" onclick="wheelAnswer(' + idx + ',' + i + ')"><span class="opt-letter">' + L[i] + '</span><span>' + escapeHtml(o) + '</span>' + optMark() + '</button>'
    ).join('') + '</div>' +
    '<div class="q-feedback" id="wheelFeedback" role="status"></div>' +
    '<button class="btn btn-next" id="wheelNextBtn"></button>';
  try { popup.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { popup.scrollIntoView(); }
}
function wheelAnswer(qIdx, ansIdx) {
  const q = wheelItems[qIdx];
  const ok = ansIdx === q.correct;
  const popup = document.getElementById('wheelPopup');
  markOptions(popup.querySelectorAll('.q-opt'), q.correct, ansIdx);
  if (ok) { score++; correctItems++; } else wrongItems++;
  wheelAnswered[qIdx] = true;

  const fb = document.getElementById('wheelFeedback');
  fb.className = 'q-feedback show ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = fbHead(ok, 'נכון!', 'לא נכון.') + ' ' + escapeHtml(q.explanation || '');

  const answeredCount = wheelAnswered.filter(Boolean).length;
  document.getElementById('wheelCounter').textContent = 'נענו ' + answeredCount + ' מתוך ' + totalItems + ' שאלות';
  setProgress(answeredCount / totalItems);
  drawWheel(wheelRotation);   // הפלח שנענה — באפור

  const nb = document.getElementById('wheelNextBtn');
  nb.style.display = 'block';
  if (answeredCount >= totalItems) { nb.textContent = 'לסיכום'; nb.onclick = () => showScore(); }
  else { nb.textContent = 'סובבו שוב'; nb.onclick = wheelAgain; }
}
function wheelAgain() {
  document.getElementById('wheelPopup').className = 'wheel-popup';
  const top = document.getElementById('wheelTop');
  try { top.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { top.scrollIntoView(); }
  document.getElementById('wheelSpinBtn').disabled = false;
  spinWheel();
}

// ==========================================
// ===== TRUE / FALSE =====
// ==========================================
let tfItems = [], tfIdx = 0;
function initTrueFalse() {
  tfItems = gameConfig.settings && gameConfig.settings.shuffleItems ? shuffle(gameConfig.items) : [...gameConfig.items];
  totalItems = tfItems.length; tfIdx = 0; score = 0; correctItems = 0; wrongItems = 0;
  renderTrueFalse();
}
function renderTrueFalse() {
  const item = tfItems[tfIdx], n = tfIdx + 1;
  setProgress(n / totalItems);
  document.getElementById('gameArea').innerHTML =
    '<div class="q-counter">משפט ' + n + ' מתוך ' + totalItems + '</div>' +
    '<div class="tf-statement">' + escapeHtml(item.text) + '</div>' +
    '<div class="tf-buttons">' +
    '<button class="tf-btn tf-btn-true" onclick="tfAnswer(true)">' + svgIcon('check', 22) + 'נכון</button>' +
    '<button class="tf-btn tf-btn-false" onclick="tfAnswer(false)">' + svgIcon('x', 22) + 'לא נכון</button>' +
    '</div>' +
    '<div class="q-feedback" id="tfFeedback" role="status"></div>' +
    '<button class="btn btn-next" id="tfNextBtn" onclick="nextTrueFalse()" style="display:none">הבא</button>';
}
/* הסבר ישן שמתחיל ב"נכון." / "לא נכון." — הכותרת כבר אומרת את זה */
function tfExplain(s) { return String(s || '').replace(/^\s*(לא\s+)?נכון\s*[.!:,–—-]\s*/, ''); }
function tfAnswer(answer) {
  const item = tfItems[tfIdx];
  const ok = answer === item.correct;

  document.querySelectorAll('.tf-btn').forEach(b => { b.classList.add('disabled'); b.disabled = true; });
  const trueBtn = document.querySelector('.tf-btn-true');
  const falseBtn = document.querySelector('.tf-btn-false');

  if (item.correct === true) {
    trueBtn.classList.add('selected-correct');
    if (!ok) falseBtn.classList.add('selected-wrong');
  } else {
    falseBtn.classList.add('selected-correct');
    if (!ok) trueBtn.classList.add('selected-wrong');
  }

  if (ok) { score++; correctItems++; } else wrongItems++;

  const fb = document.getElementById('tfFeedback');
  fb.className = 'q-feedback show ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = fbHead(ok, 'צדקתם!', 'טעיתם.') + ' ' + (item.correct ? 'המשפט נכון. ' : 'המשפט לא נכון. ') + escapeHtml(tfExplain(item.explanation));

  const nextBtn = document.getElementById('tfNextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = tfIdx < totalItems - 1 ? 'הבא' : 'סיום';
}
function nextTrueFalse() {
  tfIdx++;
  if (tfIdx >= totalItems) { showScore(); return; }
  animateCard();
  renderTrueFalse();
}

// ==========================================
// ===== FILL IN THE BLANK =====
// ==========================================
/* 11.11.26: השוואה סלחנית, ניסיון שני (חצי נקודה), וחסר באמצע מילה ("מבקר ה___") — האותיות הצמודות נכנסות לקו */
let fbItems = [], fbIdx = 0, fbTries = 0, fbDone = false, fbRight = 0, fbWrong = 0;
function initFillBlank() {
  fbItems = gameConfig.settings && gameConfig.settings.shuffleItems ? shuffle(gameConfig.items) : [...gameConfig.items];
  totalItems = fbItems.length; fbIdx = 0; score = 0; correctItems = 0; wrongItems = 0; fbRight = 0; fbWrong = 0;
  renderFillBlank();
}
function fbSentenceHtml(sentence) {
  const s = String(sentence || '');
  const m = /([א-ת]*)_{2,}([א-ת]*)/.exec(s);
  if (!m) return escapeHtml(s) + ' <span class="fb-blank"><span class="fb-slot" id="fbSlot">?</span></span>';
  const before = s.slice(0, m.index), after = s.slice(m.index + m[0].length);
  return escapeHtml(before) +
    '<span class="fb-blank">' + (m[1] ? '<span class="fb-pre">' + escapeHtml(m[1]) + '</span>' : '') +
    '<span class="fb-slot" id="fbSlot" data-pre="' + escapeHtml(m[1]) + '">?</span>' +
    (m[2] ? '<span class="fb-pre">' + escapeHtml(m[2]) + '</span>' : '') + '</span>' +
    escapeHtml(after).replace(/_{2,}/g, '<span class="fb-blank"><span class="fb-slot">?</span></span>');
}
function renderFillBlank() {
  const item = fbItems[fbIdx], n = fbIdx + 1;
  fbTries = 0; fbDone = false;
  setProgress(n / totalItems);

  document.getElementById('gameArea').innerHTML =
    '<div class="q-counter">משפט ' + n + ' מתוך ' + totalItems + '</div>' +
    '<div class="fb-sentence">' + fbSentenceHtml(item.sentence) + '</div>' +
    '<div class="fb-input-row">' +
    '<label class="sr-label" for="fbInput">המילה החסרה</label>' +
    '<input type="text" id="fbInput" placeholder="מילה אחת..." autocomplete="off">' +
    '<button class="btn btn-primary" id="fbCheckBtn" style="width:auto;padding:14px 24px" onclick="checkFillBlank()">בדקו</button>' +
    '</div>' +
    (item.hint ? '<button class="btn fb-hint-btn" onclick="showFbHint()">רמז</button>' : '') +
    '<div class="fb-hint-text" id="fbHintText">' + escapeHtml(item.hint || '') + '</div>' +
    '<div class="fb-feedback" id="fbFeedback" role="status"></div>' +
    '<button class="btn btn-next" id="fbNextBtn" onclick="nextFillBlank()" style="display:none">הבא</button>';

  document.getElementById('fbInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkFillBlank();
  });
}
function showFbHint() {
  document.getElementById('fbHintText').style.display = 'block';
  const btn = document.querySelector('.fb-hint-btn');
  if (btn) btn.disabled = true;
}
function checkFillBlank() {
  const input = document.getElementById('fbInput');
  if (fbDone || input.disabled) return;
  const answer = input.value.trim();
  if (!answer) return;
  const item = fbItems[fbIdx];
  const slot = document.getElementById('fbSlot');
  const pre = slot ? slot.getAttribute('data-pre') || '' : '';
  /* "מבקר ה___" — גם "מדינה" וגם "המדינה" נכונות */
  const ok = answerMatches(answer, item.answer) || (pre && answerMatches(pre + answer, pre + item.answer));
  const fb = document.getElementById('fbFeedback');

  if (!ok && fbTries === 0) {
    fbTries = 1;
    fb.className = 'fb-feedback show wrong';
    fb.innerHTML = fbHead(false, '', 'עוד לא.') + ' יש לכם עוד ניסיון אחד.';
    input.classList.add('shake-input');
    setTimeout(() => input.classList.remove('shake-input'), 400);
    input.select();
    return;
  }

  fbDone = true;
  input.disabled = true;
  document.getElementById('fbCheckBtn').disabled = true;
  fb.className = 'fb-feedback show ' + (ok ? 'correct' : 'wrong');
  if (ok) {
    score += fbTries ? 0.5 : 1; correctItems = score; fbRight++;
    fb.innerHTML = fbHead(true, 'נכון!', '') + (fbTries ? ' (בניסיון השני, חצי נקודה)' : '');
  } else {
    fbWrong++; wrongItems = fbWrong;
    fb.innerHTML = fbHead(false, '', 'לא נכון.') + ' התשובה הנכונה: ' + escapeHtml(item.answer);
  }

  // Fill the blank with the answer
  if (slot) {
    let shown = String(item.answer || '');
    if (pre && shown.indexOf(pre) === 0) shown = shown.slice(pre.length);
    slot.textContent = shown;
    const bl = slot.parentNode;
    bl.style.color = ok ? '#2D7A54' : 'var(--wrong)';
    bl.style.borderColor = ok ? 'var(--green)' : 'var(--wrong)';
  }

  const nextBtn = document.getElementById('fbNextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = fbIdx < totalItems - 1 ? 'הבא' : 'סיום';
}
function nextFillBlank() {
  fbIdx++;
  if (fbIdx >= totalItems) {
    showScore({ pct: Math.round(score / Math.max(1, totalItems) * 100),
      details: [[fbRight, 'נכונים', 'var(--green)'], [fbWrong, 'שגויים', 'var(--wrong)'], [totalItems, 'סה״כ', 'var(--primary)']] });
    return;
  }
  animateCard();
  renderFillBlank();
}

// ==========================================
// ===== SENTENCE ORDERING =====
// ==========================================
/* 11.11.26: סימני פיסוק יורדים מהמילים (אין "ישראל." כמילה שמסגירה את הסוף) */
let sentItems = [], sentIdx = 0, sentBuilt = [], sentWords = [];
function sentTokens(s) {
  return String(s || '').trim().split(/\s+/).map(w => w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '')).filter(Boolean);
}
function initSentence() {
  sentItems = gameConfig.settings && gameConfig.settings.shuffleItems ? shuffle(gameConfig.items) : [...gameConfig.items];
  totalItems = sentItems.length; sentIdx = 0; score = 0; correctItems = 0; wrongItems = 0;
  renderSentence();
}
function renderSentence() {
  const item = sentItems[sentIdx], n = sentIdx + 1;
  setProgress(n / totalItems);

  sentWords = sentTokens(item.sentence);
  let shuffled = shuffle(sentWords.map((w, i) => ({ text: w, origIdx: i })));
  for (let k = 0; k < 10 && sentWords.length > 1 && shuffled.map(w => w.text).join(' ') === sentWords.join(' '); k++) shuffled = shuffle(shuffled);
  sentBuilt = [];

  document.getElementById('gameArea').innerHTML =
    '<div class="q-counter">משפט ' + n + ' מתוך ' + totalItems + '</div>' +
    '<div class="sentence-target empty" id="sentTarget" aria-label="המשפט שלכם"></div>' +
    '<div class="sentence-pool" id="sentPool">' +
    shuffled.map((w, i) =>
      '<button type="button" class="word-chip word-chip-pool plain-btn" data-pool-idx="' + i + '" data-word="' + escapeHtml(w.text) + '" onclick="addWordToSentence(this)">' + escapeHtml(w.text) + '</button>'
    ).join('') +
    '</div>' +
    '<button class="btn btn-primary check-btn" id="sentCheckBtn" onclick="checkSentence()" style="display:none">בדקו</button>' +
    '<div class="sentence-feedback" id="sentFeedback" role="status"></div>' +
    '<button class="btn btn-next" id="sentNextBtn" onclick="nextSentence()" style="display:none">הבא</button>';

  window._sentShuffled = shuffled;
}
function addWordToSentence(el) {
  if (el.classList.contains('used')) return;
  el.classList.add('used');
  el.disabled = true;
  const word = el.getAttribute('data-word');
  const poolIdx = el.getAttribute('data-pool-idx');
  sentBuilt.push({ word: word, poolIdx: poolIdx });
  updateSentenceTarget();
}
function removeWordFromSentence(idx) {
  const removed = sentBuilt.splice(idx, 1)[0];
  document.querySelectorAll('.word-chip-pool').forEach(c => {
    if (c.getAttribute('data-pool-idx') === removed.poolIdx) {
      c.classList.remove('used');
      c.disabled = false;
    }
  });
  updateSentenceTarget();
}
function updateSentenceTarget() {
  const target = document.getElementById('sentTarget');
  if (sentBuilt.length === 0) {
    target.className = 'sentence-target empty';
    target.innerHTML = '';
  } else {
    target.className = 'sentence-target';
    target.innerHTML = sentBuilt.map((w, i) =>
      '<button type="button" class="word-chip word-chip-target plain-btn" aria-label="' + escapeHtml(w.word) + ' — החזרה" onclick="removeWordFromSentence(' + i + ')">' + escapeHtml(w.word) + '</button>'
    ).join('');
  }
  document.getElementById('sentCheckBtn').style.display = sentBuilt.length === sentWords.length ? 'block' : 'none';
}
function checkSentence() {
  const ok = sentBuilt.map(w => w.word).join(' ') === sentWords.join(' ');
  const original = String(sentItems[sentIdx].sentence || '').trim();

  const fb = document.getElementById('sentFeedback');
  fb.className = 'sentence-feedback show ' + (ok ? 'correct' : 'wrong');

  if (ok) {
    fb.innerHTML = fbHead(true, 'מצוין! המשפט נכון.', '');
    score++; correctItems++;
  } else {
    wrongItems++;
    fb.innerHTML = fbHead(false, '', 'לא מדויק.') + ' המשפט הנכון: ' + escapeHtml(original);
  }

  document.getElementById('sentCheckBtn').style.display = 'none';
  document.querySelectorAll('.word-chip-pool').forEach(c => c.style.pointerEvents = 'none');
  document.querySelectorAll('.word-chip-target').forEach(c => c.style.pointerEvents = 'none');

  const nextBtn = document.getElementById('sentNextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = sentIdx < totalItems - 1 ? 'הבא' : 'סיום';
}
function nextSentence() {
  sentIdx++;
  if (sentIdx >= totalItems) { showScore(); return; }
  animateCard();
  renderSentence();
}

// ==========================================
// ===== GROUPS (Connections) =====
// ==========================================
/* מיון לקבוצות (11.11.26): שמות הקבוצות גלויים למעלה; לוחצים על כרטיס ואז על הקבוצה (או גוררים במחשב).
   נכון — הכרטיס עובר לתוך הקבוצה. לא נכון — רעידה קלה, הכרטיס נשאר וממשיכים לנסות. אין "חיים".
   הציון = כמה פריטים מוינו נכון בניסיון הראשון, מתוך כל הפריטים. מבנה הנתונים לא השתנה: [{name, items:[...]}],
   גם לקבוצות עם יותר/פחות מ-4 פריטים ולמספר קבוצות שונה מ-4. */
let groupsData = [], groupsAllItems = [], groupsSelected = -1, groupsDone = false;
function groupsNorm(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }
function initGroups() {
  groupsData = (Array.isArray(gameConfig.items) ? gameConfig.items : [])
    .filter(g => g && Array.isArray(g.items))
    .map((g, gi) => ({ name: groupsNorm(g.name) || ('קבוצה ' + (gi + 1)), items: g.items.map(groupsNorm).filter(Boolean) }))
    .filter(g => g.items.length);
  groupsSelected = -1; groupsDone = false;
  score = 0; correctItems = 0;
  let allItems = [];
  groupsData.forEach((group, gi) => group.items.forEach(text => allItems.push({ text, groupIdx: gi, placed: -1, missed: false })));
  groupsAllItems = shuffle(allItems);
  totalItems = groupsAllItems.length;
  if (!totalItems) {
    document.getElementById('gameArea').innerHTML = '<div class="groups-help">אין פריטים במשחק הזה.</div>';
    return;
  }
  renderGroups('', '');
}
function renderGroups(msg, msgType) {
  const placed = groupsAllItems.filter(it => it.placed >= 0).length;
  setProgress(placed / totalItems);
  const cols = Math.min(4, Math.max(1, groupsData.length));
  let html = '<div class="groups-help">לחצו על כרטיס, ואז על הקבוצה שהוא שייך אליה</div>';
  html += '<div class="groups-boxes' + (groupsSelected >= 0 ? ' armed' : '') + '" style="--gcols:' + cols + '">';
  groupsData.forEach((g, gi) => {
    const inBox = groupsAllItems.filter(it => it.placed === gi);
    const full = inBox.length >= g.items.length;
    html += '<button type="button" class="groups-box plain-btn groups-colors-' + (gi % 4) + (full ? ' full' : '') + '" data-gi="' + gi + '"' +
      ' onclick="placeGroupItem(' + gi + ')" ondragover="groupsDragOver(event)" ondragleave="this.classList.remove(\'drag-over\')" ondrop="groupsDrop(event,' + gi + ')"' +
      ' aria-label="' + escapeHtml(g.name) + ' — ' + inBox.length + ' מתוך ' + g.items.length + '">' +
      '<span class="groups-box-name">' + escapeHtml(g.name) + '</span>' +
      '<span class="groups-box-count">' + inBox.length + ' מתוך ' + g.items.length + '</span>' +
      '<span class="groups-box-items">' + inBox.map(it => '<span class="groups-chip">' + escapeHtml(it.text) + '</span>').join('') + '</span>' +
      '</button>';
  });
  html += '</div>';
  html += '<div class="groups-msg' + (msgType ? ' ' + msgType : '') + '" id="groupsMsg" role="status" aria-live="polite">' + escapeHtml(msg || '') + '</div>';
  html += '<div class="groups-cards">';
  groupsAllItems.forEach((it, i) => {
    if (it.placed >= 0) return;
    const sel = i === groupsSelected;
    html += '<button type="button" class="groups-card plain-btn' + (sel ? ' selected' : '') + '" data-idx="' + i + '" draggable="true"' +
      ' aria-pressed="' + (sel ? 'true' : 'false') + '" onclick="selectGroupItem(' + i + ')" ondragstart="groupsDragStart(event,' + i + ')">' +
      escapeHtml(it.text) + '</button>';
  });
  html += '</div>';
  document.getElementById('gameArea').innerHTML = html;
}
function selectGroupItem(idx) {
  if (groupsDone) return;
  groupsSelected = groupsSelected === idx ? -1 : idx;
  renderGroups('', '');
}
function placeGroupItem(gi) {
  if (groupsDone) return;
  if (groupsSelected < 0) { renderGroups('קודם בחרו כרטיס', 'info'); return; }
  const it = groupsAllItems[groupsSelected], g = groupsData[gi];
  if (!it || !g) return;
  /* נכון אם הפריט שייך לקבוצה (גם אם אותו פריט מופיע בטעות בשתי קבוצות) — ויש בה עוד מקום */
  const inBox = groupsAllItems.filter(x => x.placed === gi).length;
  const ok = (it.groupIdx === gi || g.items.indexOf(it.text) > -1) && inBox < g.items.length;
  if (ok) {
    it.placed = gi;
    if (!it.missed) { correctItems++; score++; }
    groupsSelected = -1;
    const left = groupsAllItems.filter(x => x.placed < 0).length;
    if (!left) {
      groupsDone = true;
      renderGroups('כל הכרטיסים מוינו!', 'correct');
      setTimeout(showScore, 1200);
    } else {
      renderGroups('נכון!', 'correct');
    }
  } else {
    it.missed = true;
    const sel = groupsSelected;
    renderGroups('לא בדיוק — נסו קבוצה אחרת', 'wrong');
    const card = document.querySelector('.groups-card[data-idx="' + sel + '"]');
    if (card) { card.classList.add('wrong-flash'); setTimeout(() => card.classList.remove('wrong-flash'), 450); }
  }
}
/* גרירה במחשב — אותה פעולה כמו לחיצה על כרטיס ואז על קבוצה */
function groupsDragStart(e, idx) {
  groupsSelected = idx;
  try { e.dataTransfer.setData('text/plain', String(idx)); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
}
function groupsDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function groupsDrop(e, gi) {
  e.preventDefault();
  let idx = parseInt((e.dataTransfer && e.dataTransfer.getData('text/plain')) || '', 10);
  if (!isNaN(idx) && groupsAllItems[idx] && groupsAllItems[idx].placed < 0) groupsSelected = idx;
  placeGroupItem(gi);
}

// ==========================================
// ===== HANGMAN =====
// ==========================================
/* 11.11.26: אותיות סופיות — ניחוש נ חושף גם ן (וכן כ/ך, מ/ם, פ/ף, צ/ץ). תו שאינו אות (מקף, גרש, רווח) גלוי מההתחלה.
   "נשארו X טעויות" במקום פרצופים. */
let hangmanWords = [], hangmanIdx = 0, hangmanRevealed = [], hangmanWrong = 0, hangmanGuessedLetters = [], hangmanMaxWrong = 6, hangmanOver = false;
const hebrewLetters = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ל','מ','נ','ס','ע','פ','צ','ק','ר','ש','ת'];
function hmBase(ch) { return FINAL_LETTERS[ch] || ch; }
function initHangman() {
  hangmanWords = gameConfig.settings && gameConfig.settings.shuffleItems ? shuffle(gameConfig.items) : [...gameConfig.items];
  totalItems = hangmanWords.length; hangmanIdx = 0; score = 0; correctItems = 0; wrongItems = 0;
  startHangmanWord();
}
function hmWord() { return String(hangmanWords[hangmanIdx].word || '').trim().replace(/[֑-ׇ]/g, ''); }
function startHangmanWord() {
  const word = hmWord();
  hangmanRevealed = [...word].map(ch => hebrewLetters.indexOf(hmBase(ch)) < 0);
  hangmanWrong = 0;
  hangmanGuessedLetters = [];
  hangmanOver = false;
  renderHangman();
}
function hmLeftText() {
  const left = hangmanMaxWrong - hangmanWrong;
  return left <= 0 ? 'לא נשארו טעויות' : left === 1 ? 'נשארה טעות אחת' : 'נשארו ' + left + ' טעויות';
}
function renderHangman(result) {
  const item = hangmanWords[hangmanIdx];
  const word = [...hmWord()];
  const n = hangmanIdx + 1;
  setProgress(n / (totalItems + 1));

  let wordHtml = '<div class="hangman-word" aria-label="המילה">';
  word.forEach((ch, i) => {
    if (ch === ' ') { wordHtml += '<div style="width:20px"></div>'; return; }
    const isLetter = hebrewLetters.indexOf(hmBase(ch)) > -1;
    let cls = 'hangman-letter-slot';
    if (!isLetter) cls += ' fixed';
    else if (hangmanRevealed[i]) cls += ' revealed';
    else if (hangmanOver) cls += ' missed';
    const show = hangmanRevealed[i] || hangmanOver;
    wordHtml += '<div class="' + cls + '">' + (show ? escapeHtml(ch) : '') + '</div>';
  });
  wordHtml += '</div>';

  let livesHtml = '<div class="hangman-status' + (hangmanMaxWrong - hangmanWrong <= 2 ? ' low' : '') + '" role="status">' + hmLeftText() + '</div>';
  livesHtml += '<div class="hangman-lives" aria-hidden="true">';
  for (let i = 0; i < hangmanMaxWrong; i++) livesHtml += '<div class="life-dot' + (i < hangmanWrong ? ' lost' : '') + '"></div>';
  livesHtml += '</div>';

  const hintHtml = item.hint ? '<div class="hangman-hint">רמז: ' + escapeHtml(item.hint) + '</div>' : '';

  let kbHtml = '<div class="hangman-keyboard">';
  hebrewLetters.forEach(letter => {
    let cls = 'hangman-key';
    const used = hangmanGuessedLetters.includes(letter);
    if (used) cls += word.some(ch => hmBase(ch) === letter) ? ' correct-key' : ' wrong-key';
    kbHtml += '<button type="button" class="' + cls + ' plain-btn"' + (used || hangmanOver ? ' disabled' : '') + ' onclick="hangmanGuess(\'' + letter + '\')">' + letter + '</button>';
  });
  kbHtml += '</div>';

  const last = hangmanIdx >= totalItems - 1;
  document.getElementById('gameArea').innerHTML =
    '<div class="q-counter">מילה ' + n + ' מתוך ' + totalItems + '</div>' +
    wordHtml + livesHtml + hintHtml + kbHtml +
    '<div class="hangman-result' + (result ? ' show ' + result.cls : '') + '" id="hangmanResult" role="status">' + (result ? result.html : '') + '</div>' +
    '<button class="btn btn-next" id="hangmanNextBtn" onclick="nextHangman()" style="display:' + (hangmanOver ? 'block' : 'none') + '">' + (last ? 'סיום' : 'המילה הבאה') + '</button>';
}
function hangmanGuess(letter) {
  if (hangmanOver || hangmanGuessedLetters.includes(letter)) return;
  hangmanGuessedLetters.push(letter);

  const word = [...hmWord()];
  let found = false;
  word.forEach((ch, i) => { if (hmBase(ch) === letter) { hangmanRevealed[i] = true; found = true; } });
  if (!found) hangmanWrong++;

  if (hangmanRevealed.every(Boolean)) {
    score++; correctItems++;
    hangmanOver = true;
    renderHangman({ cls: 'win', html: fbHead(true, 'כל הכבוד! ניחשתם את המילה.', '') });
  } else if (hangmanWrong >= hangmanMaxWrong) {
    wrongItems++;
    hangmanOver = true;
    renderHangman({ cls: 'lose', html: fbHead(false, '', 'המילה הייתה:') + ' ' + escapeHtml(word.join('')) });
  } else {
    renderHangman();
  }
}
function nextHangman() {
  hangmanIdx++;
  if (hangmanIdx >= totalItems) { showScore(); return; }
  animateCard();
  startHangmanWord();
}

// ==========================================
// ===== MILLIONAIRE =====
// ==========================================
/* 11.11.26: ההסבר נשאר על המסך עם כפתור (בלי מעבר אוטומטי); הודעת "הגעתם לפסגה" — כשעונים נכון על השאלה האחרונה;
   בסיכום: שגויים = 1 (או 0), ובנפרד כמה שאלות לא הגעתם אליהן. */
let millItems = [], millIdx = 0, millLadder = [], millUsed5050 = false, millCheckpoints = [], millLost = false;
function initMillionaire() {
  millItems = [...gameConfig.items];
  totalItems = millItems.length; millIdx = 0; score = 0; correctItems = 0; wrongItems = 0;
  millUsed5050 = false; millLost = false;
  isMillionaire = true;

  const fullLadder = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
  millLadder = totalItems <= fullLadder.length ? fullLadder.slice(0, totalItems) : fullLadder;

  // Checkpoints at level 5 and 10 (0-indexed: 4 and 9)
  millCheckpoints = [];
  if (millLadder.length >= 5) millCheckpoints.push(4);
  if (millLadder.length >= 10) millCheckpoints.push(9);

  millionaireMoneyReached = 0;
  renderMillionaire();
}
function renderMillionaire() {
  const q = millItems[millIdx];

  setProgress(n / totalItems);
  const L = ['א','ב','ג','ד'];

  let ladderHtml = '<div class="mill-side"><div class="mill-ladder">';
  for (let i = 0; i < millLadder.length; i++) {
    let cls = 'mill-ladder-item';
    if (i === millIdx) cls += ' current';
    else if (i < millIdx) cls += ' passed';
    if (millCheckpoints.includes(i)) cls += ' checkpoint';
    ladderHtml += '<div class="' + cls + '">' + millLadder[i].toLocaleString() + ' ₪</div>';
  }
  ladderHtml += '</div>' + (millCheckpoints.length ? '<div class="mill-legend"><span class="sw"></span>מסגרת כתומה = סכום שנשמר</div>' : '') + '</div>';

  const lifelineHtml = '<div class="mill-lifeline">' +
    '<button type="button" class="mill-lifeline-btn' + (millUsed5050 ? ' used' : '') + '"' + (millUsed5050 ? ' disabled' : '') + ' onclick="mill5050()" id="mill5050Btn" aria-label="50:50 — הורדת שתי תשובות שגויות, פעם אחת במשחק">50:50</button>' +
    '</div>';

  const qHtml =
    '<div class="mill-main">' +

function mill5050() {

  millUsed5050 = true;
  const lifelineBtn = document.getElementById('mill5050Btn');
  lifelineBtn.classList.add('used');
  lifelineBtn.disabled = true;

  const q = millItems[millIdx];
  const wrongIndices = [];
  for (let i = 0; i < q.options.length; i++) if (i !== q.correct) wrongIndices.push(i);
  shuffle(wrongIndices).slice(0, 2).forEach(i => {
    const opt = document.getElementById('millOpt' + i);
    if (opt) {

}
function millAnswer(idx) {

  const b = document.getElementById('mill5050Btn'); if (b) b.disabled = true;

  const fb = document.getElementById('millFeedback');

  const nb = document.getElementById('millNextBtn');

  } else {
    millLost = true; wrongItems = 1;
    let fallTo = 0;
    for (const cp of millCheckpoints) if (cp < millIdx) fallTo = millLadder[cp];
    millionaireMoneyReached = fallTo;
    score = correctItems;
    nb.textContent = 'לסיכום';
  }
  nb.onclick = millNext;
}
function millNext() {
  if (millLost || millIdx >= totalItems - 1) { showMillionaireScore(); return; }
  millIdx++;
  animateCard();
  renderMillionaire();
}
function showMillionaireScore() {
  setProgress(1);
  const p = Math.round(correctItems / Math.max(1, totalItems) * 100);
  const top = !millLost && correctItems >= totalItems;
  let ic, msg, bg, col;
  if (top) { ic = 'trophy'; msg = 'הגעתם לפסגה! ענקי!'; bg = 'var(--accent-l)'; col = 'var(--accent)'; }
  else if (p >= 70) { ic = 'award'; msg = 'כל הכבוד! הרווחתם יפה!'; bg = 'var(--green-l)'; col = 'var(--green)'; }
  else if (p >= 50) { ic = 'trend'; msg = 'לא רע! אפשר לשפר!'; bg = 'var(--primary-l)'; col = 'var(--primary)'; }
  else { ic = 'book'; msg = 'כדאי לחזור על החומר'; bg = 'var(--bg)'; col = 'var(--gray)'; }

  const si = document.getElementById('scoreIcon'); si.innerHTML = svgIcon(ic, 56); si.style.color = col;
  document.getElementById('scoreNum').textContent = millionaireMoneyReached.toLocaleString();
  document.getElementById('scoreNum').style.color = top ? 'var(--accent)' : millionaireMoneyReached > 0 ? 'var(--green)' : 'var(--gray)';
  document.getElementById('scoreLabel').textContent = millionaireMoneyReached > 0 ? 'הגעתם ל-' + millionaireMoneyReached.toLocaleString() + ' ₪' : 'הפעם לא נשמר סכום';
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('scoreMsg').style.background = bg;
  const notReached = Math.max(0, totalItems - correctItems - (millLost ? 1 : 0));
  setScoreDetails([[correctItems, 'נכונים', 'var(--green)'], [millLost ? 1 : 0, 'שגויים', 'var(--wrong)'], [notReached, 'שאלות שלא הגעתם אליהן', 'var(--primary)']]);
  showScreen('scoreScreen');
}

// ==========================================
// ===== SCORE =====
// ==========================================
function setScoreDetails(rows) {
  document.getElementById('scoreDetails').innerHTML = rows.map(r =>
    '<div class="score-detail"><div class="num" style="color:' + r[2] + '">' + r[0] + '</div><div class="lbl">' + escapeHtml(r[1]) + '</div></div>').join('');
}
/* o.pct — ציון מוכן (כשיש חצאי נקודות או ציון לפי ניסיונות); o.details — [[מספר, תווית, צבע], ...] */
function showScore(o) {
  o = o || {};
  const p = o.pct != null ? o.pct : Math.round(correctItems / Math.max(1, totalItems) * 100);
  setProgress(1);
  let ic, msg, bg, col;
  if (p >= 90) { ic = 'star'; msg = 'מצוין! שליטה מעולה!'; bg = 'var(--green-l)'; col = 'var(--accent)'; }
  else if (p >= 70) { ic = 'award'; msg = 'כל הכבוד! ביצוע טוב מאוד!'; bg = 'var(--primary-l)'; col = 'var(--green)'; }
  else if (p >= 50) { ic = 'trend'; msg = 'אפשר לשפר – נסו שוב!'; bg = 'var(--accent-l)'; col = 'var(--primary)'; }
  else { ic = 'book'; msg = 'כדאי לחזור על החומר'; bg = 'var(--bg)'; col = 'var(--gray)'; }
  const si = document.getElementById('scoreIcon'); si.innerHTML = svgIcon(ic, 56); si.style.color = col;
  document.getElementById('scoreNum').textContent = p;
  document.getElementById('scoreNum').style.color = p >= 70 ? 'var(--green)' : p >= 50 ? 'var(--accent)' : 'var(--gray)';
  document.getElementById('scoreLabel').textContent = 'מתוך 100';
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('scoreMsg').style.background = bg;
  /* שגויים = טעויות אמיתיות. במיון לקבוצות כל הפריטים ממוינים בסוף, ולכן = פריטים שלא מוינו בניסיון הראשון */
  const w = (gameConfig && gameConfig.gameType === 'groups') ? Math.max(0, totalItems - correctItems) : wrongItems;
  setScoreDetails(o.details || [[correctItems, 'נכונים', 'var(--green)'], [w, 'שגויים', 'var(--wrong)'], [totalItems, 'סה״כ', 'var(--primary)']]);
  showScreen('scoreScreen');
}

// ===== SEND RESULTS =====
function sendResults() {
  const btn = event.target; btn.disabled = true; btn.textContent = 'שולח...';
  const p = isMillionaire ? millionaireMoneyReached : Math.round(correctItems / totalItems * 100);
  const sheetName = gameMeta.name + ' – ' + gameMeta.grade;
  const params = new URLSearchParams({
    action: 'submit',
    quizName: sheetName,
    studentName: studentName,
    classroom: studentClass,
    score: p,
    totalQuestions: totalItems,
    correctAnswers: Math.round(correctItems),
    level: '',
    teacherEmail: gameMeta.email || ''
  });
  const s = document.createElement('script');
  s.src = SHEETS_URL + '?' + params.toString();
  s.onload = s.onerror = function() {
    const st = document.getElementById('sendStatus');
    st.className = 'send-status success';
    st.innerHTML = svgIcon('check', 18) + ' התוצאות נשלחו בהצלחה למורה!';
    btn.textContent = 'נשלח!';
    s.remove();
  };
  document.body.appendChild(s);
}

// ===== INIT =====
loadGame();
</script>
