<style>
  [hidden] { display: none !important; }
  .nk-kpis { display:grid; grid-template-columns:repeat(7, 1fr); gap:12px; margin-bottom:20px; }
  @media (max-width: 900px) { .nk-kpis { grid-template-columns:repeat(2, 1fr); } }
  .nk-kpi { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .nk-kpi .l { font-size:12px; color:var(--text-muted); font-weight:600; }
  .nk-kpi .v { font-size:28px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums; color:var(--primary-dark,#143E4C); }
  .nk-kpi .s { font-size:11.5px; color:var(--text-muted); }
  .nk-kpi.red { border-color:#E7C0B5; background:#FDF4F1; } .nk-kpi.red .v { color:#a4442f; }
  .nk-kpi.amber .v { color:#9a6400; }

  .ms-pick { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
  .ms-pick select { padding:8px 12px; border:1px solid var(--border); border-radius:9px; background:var(--surface); font:inherit; font-size:.86rem; color:var(--text); max-width:100%; }
  .ms-pick .sp { flex:1; }
  .ms-pick small { color:var(--text-muted); font-size:12px; }
  .nk-btn { font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer; text-decoration:none; }
  .nk-btn:hover { border-color:var(--primary,#1A5365); color:var(--primary,#1A5365); }
  .nk-kpis { grid-template-columns:repeat(5, 1fr); }
  @media (max-width: 900px) { .nk-kpis { grid-template-columns:repeat(2, 1fr); } }
  .ms-meet { margin-bottom:14px; }
  .ms-when { display:flex; flex-wrap:wrap; gap:8px; }
  .ms-when span { background:var(--surface-soft); border:1px solid var(--border); border-radius:999px; padding:4px 12px; font-size:13px; font-variant-numeric:tabular-nums; }
  .ms-topic { margin-top:8px; font-size:13.5px; color:var(--text-2); line-height:1.7; }
  .ms-status { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width: 640px) { .ms-status { grid-template-columns:1fr; } }
  .ms-q { border-radius:14px; padding:14px 16px; border:1px solid var(--border); background:var(--surface); box-shadow:inset 4px 0 0 var(--border); }
  .ms-q span { display:block; font-size:12px; color:var(--text-muted); font-weight:600; }
  .ms-q b { display:block; font-size:18px; margin-top:2px; }
  .ms-q.ok { box-shadow:inset 4px 0 0 #2f8f6b; } .ms-q.ok b { color:#1f7a5c; }
  .ms-q.warn { box-shadow:inset 4px 0 0 #d19a2a; background:#FFF8EC; } .ms-q.warn b { color:#8a5a00; }
  .ms-q.bad { box-shadow:inset 4px 0 0 #c56b5c; background:#FDF4F1; } .ms-q.bad b { color:#a4442f; }
  .ms-q.wait b { color:var(--text-muted); }
  .ms-grp { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-bottom:10px; }
  .ms-grp summary { cursor:pointer; font-weight:700; font-size:14px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .ms-grp summary b { font-variant-numeric:tabular-nums; }
  .ms-grp summary span { font-weight:400; font-size:12px; color:var(--text-muted); }
  .ms-grp.ok summary b { color:#1f7a5c; } .ms-grp.warn summary b { color:#8a5a00; } .ms-grp.bad summary b { color:#a4442f; }
  .ms-grp .mv-people { max-height:none; }
</style>
</head>
