<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אימות רשימות מול בתי הספר — אדמין</title>
<link rel="stylesheet" href="assets/fonts-local.css">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .sum-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .sum-strip .cell { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: center; }
  .sum-strip .cell b { display: block; font-size: 26px; }
  .sum-strip .cell small { color: var(--text-2); }
  .school-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
  }
  .school-card.ok-border { border-inline-start: 4px solid var(--mint, #6FB7A6); }

  /* ---- פאנל שליחה מהנייד ---- */
  .send-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 20px;
  }
  .sp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sp-head b { font-size: 16px; }
  .sp-progress { font-size: 13px; color: var(--text-2); }
  .sp-note {
    background: #FFF9EC; border: 1px solid #F0DCAE; border-radius: 10px;
    padding: 10px 12px; margin-top: 10px; font-size: 13px; line-height: 1.65; color: #6b4b06;
  }
  .sp-loader { margin-top: 10px; }
  .sp-loader textarea {
    width: 100%; box-sizing: border-box; font-family: monospace; font-size: 12px;
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 84px;
  }
  .sp-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 0; border-top: 1px solid var(--border);
  }
  .sp-row:first-of-type { border-top: none; }
  .sp-row .sp-name { flex: 1 1 150px; min-width: 0; font-size: 14px; font-weight: 600; }
  .sp-row.sent .sp-name { color: var(--text-3); font-weight: 400; text-decoration: line-through; }
  .sp-btn {
    font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--text-1); cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  }
  .sp-btn.wa { background: #25D366; border-color: #1da851; color: #fff; }
  .sp-btn.tick { min-width: 40px; justify-content: center; }
  .sp-btn.tick.on { background: var(--ok-soft, #e7f6ef); border-color: #6FB7A6; color: #14532d; }
  .sp-miss { font-size: 12.5px; color: #8a5a00; }
  .sp-phone-in { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px dashed #D9A441; background: #FFF9EC; width: 130px; }
  .sc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sc-head .nm { font-weight: 700; font-size: 16px; }
  .sc-head .meta { font-size: 13px; color: var(--text-2); }
  .v-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .v-chip.approved { background: var(--ok-soft, #e7f6ef); color: #14532d; }
  .v-chip.fixed    { background: #E6F0F4; color: #17324D; }
  .v-chip.pending  { background: var(--surface-2); color: var(--text-3); }
  .v-detail { font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
  .v-detail .note { color: #92400e; }
  .sc-roster {
    font-size: 13px; color: var(--text-2); line-height: 1.8;
    margin: 10px 0 12px; padding: 10px 14px;
    background: var(--surface-2); border-radius: 10px;
  }
  .sc-roster b { color: var(--text); }
  .sc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .copy-mini {
    background: var(--brand-accent); color: white;
    border: none; border-radius: 8px; padding: 7px 14px;
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .copy-mini.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .copy-mini.copied { background: var(--ok); color: white; }
  .warn-note { font-size: 12.5px; color: #92400e; background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; margin-top: 8px; display: inline-block; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar select { min-width: 150px; }
</style>
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <a href="./" style="display:flex;align-items:center;color:var(--text-3);text-decoration:none;" title="חזרה">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div class="brand-stack">
        <span class="ministry">משרד העבודה — אדמין</span>
        <span class="system-name">אימות רשימות המורים · לוח מעקב</span>
      </div>
    </div>
  </header>

  <main class="container">

    <h1 style="margin: 24px 0 8px;">אימות הרשימות — כל האישורים במקום אחד</h1>
    <p style="color: var(--text-2); margin-bottom: 20px; max-width: 720px;">
      כל בית ספר מקבל קישור אישי לטופס האימות: רואה את הרשימה שלו לפי מקצוע,
      מתקן אם צריך, ומאשר בחתימת שם. האישורים נאספים לכאן אוטומטית.
    </p>

    <div class="sum-strip" id="summary"></div>

    <div class="send-panel" id="send-panel">
      <div class="sp-head">
        <b>שליחה מהנייד</b>
        <span class="sp-progress" id="sp-progress"></span>
      </div>
      <div class="sp-note" id="sp-note" hidden></div>
      <div class="sp-loader" id="sp-loader" hidden>
        <textarea id="sp-blob" placeholder="מדביקים כאן את המחרוזת מהקובץ 'ניידי-מנהלים-להדבקה.txt'"></textarea>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button type="button" class="sp-btn" id="sp-save">שמירה במכשיר הזה</button>
          <button type="button" class="sp-btn" id="sp-clear">מחיקת המספרים מהמכשיר</button>
          <span class="sp-progress" id="sp-load-msg"></span>
        </div>
      </div>
      <div id="sp-list"></div>
    </div>

    <div class="toolbar">
      <input type="search" class="input" id="q" placeholder="חיפוש בית ספר…">
      <select class="select" id="fStatus">
        <option value="">כל הסטטוסים</option>
        <option value="pending">⚪ טרם אישרו</option>
        <option value="approved">🟢 אושר כפי שהוא</option>
        <option value="fixed">🔵 אושר אחרי תיקונים</option>
      </select>
    </div>

    <div id="list"><div class="empty" style="padding:32px;">טוען את הגיליון…</div></div>

  </main>

  <footer style="text-align:center; padding: 32px 16px; color: var(--text-3); font-size: 13px;">
    דף אדמין · אימות רשימות · משרד העבודה
  </footer>
</div>

<script src="assets/app.js?v=20260909d"></script>
<script src="assets/auth-guard.js" data-roles="ministry_admin"></script>
<script>
const BASE = location.origin + location.pathname.replace(/\/admin-verify\.html$/, '');
const SUBJECT_ORDER = ['מתמטיקה','אנגלית','עברית','ספרות','היסטוריה','אזרחות','תנ"ך','ערבית','מורשת אסלאמית','מורשת דרוזית'];
const SUBJECT_DISPLAY = { 'תנ': 'תנ"ך' };
let schools = [];

async function init() {
  const [tRes, sRes, qRes] = await Promise.all([
    TS.api('teachers.list', {}, { cache: 'no' }),
    TS.api('schools.list', {}, { cache: 'no' }),
    TS.api('questions.list', {}, { cache: 'no' })
  ]);
  if (!tRes.ok || !sRes.ok) {
    document.getElementById('list').innerHTML =
      '<div class="alert err"><div class="alert-body">שגיאה בקריאת הגיליון</div></div>';
    return;
  }
  const teachers = tRes.data || [];
  const byId = {};
  (sRes.data || []).forEach(s => byId[s.id] = s);

  // אישורים: הרשומה האחרונה לכל בית ספר
  const verifyBySchool = {};
  ((qRes.ok && qRes.data) || []).forEach(q => {
    if (!(q.teacherId || '').startsWith('verify:')) return;
    let p = null;
    try { p = JSON.parse(q.question); } catch (e) { return; }
    if (!p || p.kind !== 'school-verify') return;
    const sid = (q.teacherId || '').slice(7);
    const prev = verifyBySchool[sid];
    if (!prev || (p.at || q.createdAt) > (prev.at || '')) verifyBySchool[sid] = Object.assign({ createdAt: q.createdAt }, p);
  });

  const grouped = {};
  teachers.forEach(t => {
    const key = t.school || ('name:' + t.schoolName);
    (grouped[key] = grouped[key] || []).push(t);
  });

  schools = Object.keys(grouped).map(key => {
    const rows = grouped[key];
    const info = byId[key] || {};
    const bySubj = {};
    rows.forEach(t => {
      const disp = SUBJECT_DISPLAY[t.subject] || t.subject;
      (bySubj[disp] = bySubj[disp] || []).push(t);
    });
    const subjOrder = [...SUBJECT_ORDER.filter(s => bySubj[s]),
                       ...Object.keys(bySubj).filter(s => !SUBJECT_ORDER.includes(s)).sort()];
    const missing = ['מתמטיקה','אנגלית','עברית'].filter(s => !bySubj[s]);
    const v = verifyBySchool[key.startsWith('name:') ? '' : key] || null;
    return {
      id: key.startsWith('name:') ? '' : key,
      name: info.name || rows[0].schoolName || key,
      principalName: info.principalName || '',
      principalPhone: (info.principalPhone || '').toString(),
      count: rows.length,
      subjSummary: subjOrder.map(s => s + ' ' + bySubj[s].length).join(' · '),
      roster: subjOrder.map(s => ({ subject: s, names: bySubj[s].map(t => t.name + (t.type === 'gemer' ? ' [גמר]' : '')) })),
      missing: rows.length >= 5 ? missing : [],
      verify: v
    };
  }).sort((a, b) => a.name.localeCompare(b.name, 'he'));

  render();
}

function msgFor(s) {
  const link = BASE + '/verify.html?school=' + encodeURIComponent(s.id);
  return [
    'שלום' + (s.principalName ? ' ' + s.principalName : '') + ',',
    '',
    'לקראת פתיחת שנת ההדרכות — הוזנו למצפן ההדרכות ' + s.count + ' מורים עבור ' + s.name + ':',
    s.subjSummary + '.',
    '',
    'נא להיכנס לטופס האימות, לוודא שכל מורה משויך/ת למקצוע ולמסלול הנכונים (בגרות/גמר), לתקן אם צריך — ולאשר:',
    link,
    '',
    'לוקח 2 דקות. תודה רבה!',
    'מיטל פלג · יחידת הפיקוח על הדרכות מורים'
  ].join('\n');
}

// ---- ניידי המנהלים: נשמרים במכשיר הזה בלבד, לא בקוד ולא בשרת ----
// המספרים מגיעים מהדבקה חד-פעמית של מחרוזת שמיטל מקבלת בקובץ מקומי.
// זו הסיבה שהם לא יושבים בקובץ באתר: הדף הזה מוגן רק בצד הלקוח.
const PHONES_KEY = 'ts.verify.phones.v1';
const SENT_KEY   = 'ts.verify.sent.v1';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch (e) { return {}; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function normPhone(p) {
  const d = (p || '').toString().replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('972')) return d;
  if (d.startsWith('0')) return '972' + d.slice(1);
  return d.length >= 9 ? '972' + d : '';
}
// wa.me ולא api.whatsapp.com — רק הראשון נפתח באפליקציה בנייד
function waLink(phone, text) {
  return 'https://wa.me/' + normPhone(phone) + '?text=' + encodeURIComponent(text);
}
function phoneFor(s) {
  return normPhone(lsGet(PHONES_KEY)[s.id] || s.principalPhone || '');
}

// המחרוזת היא base64 של {"v":1,"m":{"<schoolId>":"972..."}} — או JSON גולמי
function parseBlob(raw) {
  let txt = (raw || '').trim().replace(/^PHV1:/, '').replace(/\s+/g, '');
  if (!txt) return null;
  let obj = null;
  try { obj = JSON.parse(raw); } catch (e) {}
  if (!obj) { try { obj = JSON.parse(decodeURIComponent(escape(atob(txt)))); } catch (e) {} }
  if (!obj || !obj.m || typeof obj.m !== 'object') return null;
  const out = {};
  Object.entries(obj.m).forEach(([k, v]) => { const p = normPhone(v); if (p) out[k] = p; });
  return Object.keys(out).length ? out : null;
}

function saveBlob() {
  const msg = document.getElementById('sp-load-msg');
  const parsed = parseBlob(document.getElementById('sp-blob').value);
  if (!parsed) { msg.textContent = 'לא זוהתה רשימה תקינה — לוודא שהועתקה כל המחרוזת.'; return; }
  const merged = Object.assign(lsGet(PHONES_KEY), parsed);   // מיזוג, כדי לא למחוק מספרים שהוזנו ידנית
  lsSet(PHONES_KEY, merged);
  const known = schools.filter(s => merged[s.id]).length;
  msg.textContent = 'נשמרו ' + Object.keys(parsed).length + ' מספרים · מזוהים ' + known + ' מבתי הספר ברשימה.';
  document.getElementById('sp-blob').value = '';
  render();
}

function clearPhones() {
  if (!confirm('למחוק מהמכשיר הזה את כל ניידי המנהלים?')) return;
  try { localStorage.removeItem(PHONES_KEY); } catch (e) {}
  document.getElementById('sp-load-msg').textContent = 'המספרים נמחקו מהמכשיר.';
  render();
}

function toggleSent(sid) {
  const sent = lsGet(SENT_KEY);
  if (sent[sid]) delete sent[sid]; else sent[sid] = true;
  lsSet(SENT_KEY, sent);
  render();
}

function addPhone(sid, val) {
  const p = normPhone(val);
  if (!p) return;
  const map = lsGet(PHONES_KEY);
  map[sid] = p;
  lsSet(PHONES_KEY, map);
  render();
}

function renderSendPanel() {
  const pending = schools.filter(s => s.id && !s.verify);
  const sent = lsGet(SENT_KEY);
  const withPhone = pending.filter(s => phoneFor(s));
  const doneN = pending.filter(s => sent[s.id]).length;

  document.getElementById('sp-progress').textContent =
    pending.length ? 'נשלחו ' + doneN + ' מתוך ' + pending.length + ' שטרם אישרו' : 'כולם אישרו — אין למי לשלוח';

  const note = document.getElementById('sp-note');
  const loader = document.getElementById('sp-loader');
  if (!withPhone.length) {
    note.hidden = false;
    note.innerHTML = '<b>הניידים לא נטענו במכשיר הזה.</b> המספרים לא נשמרים באתר — ' +
      'מדביקים אותם פעם אחת וכל כפתורי הוואטסאפ נדלקים. ' +
      '<button type="button" class="sp-btn" style="margin-top:6px;" id="sp-toggle">הדבקת רשימת הניידים</button>';
    loader.hidden = false;
  } else {
    note.hidden = false;
    note.innerHTML = 'המספרים שמורים <b>במכשיר הזה בלבד</b> — ' + withPhone.length + ' מתוך ' +
      pending.length + ' בתי הספר שטרם אישרו. ' +
      '<button type="button" class="sp-btn" style="margin-top:6px;" id="sp-toggle">עדכון הרשימה</button>';
    loader.hidden = true;
  }

  document.getElementById('sp-list').innerHTML = pending.map(s => {
    const ph = phoneFor(s);
    const isSent = !!sent[s.id];
    const right = ph
      ? `<a class="sp-btn wa" target="_blank" rel="noopener" href="${waLink(ph, msgFor(s))}"
            onclick="markSent('${s.id}')">וואטסאפ</a>`
      : `<span class="sp-miss">אין מספר</span>
         <input class="sp-phone-in" placeholder="נייד" inputmode="tel"
                onchange="addPhone('${s.id}', this.value)">`;
    return `<div class="sp-row ${isSent ? 'sent' : ''}">
      <span class="sp-name">${escapeHtml(s.name)}</span>
      ${right}
      <button type="button" class="sp-btn tick ${isSent ? 'on' : ''}" title="סימון כנשלח"
              onclick="toggleSent('${s.id}')">${isSent ? '✓' : '○'}</button>
    </div>`;
  }).join('') || '<div class="sp-progress" style="padding:10px 0;">אין בתי ספר שממתינים לאישור.</div>';

  const tgl = document.getElementById('sp-toggle');
  if (tgl) tgl.addEventListener('click', () => { loader.hidden = !loader.hidden; });
}

function markSent(sid) {
  const sent = lsGet(SENT_KEY);
  sent[sid] = true;
  lsSet(SENT_KEY, sent);
  setTimeout(render, 400);   // אחרי שהקישור נפתח, כדי לא לבטל את המעבר לוואטסאפ
}

function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function render() {
  const q = (document.getElementById('q').value || '').trim();
  const fs = document.getElementById('fStatus').value;

  const nApproved = schools.filter(s => s.verify && s.verify.status === 'approved').length;
  const nFixed = schools.filter(s => s.verify && s.verify.status === 'fixed').length;
  const nPending = schools.length - nApproved - nFixed;
  document.getElementById('summary').innerHTML = `
    <div class="cell"><b>${schools.length}</b><small>בתי ספר עם מורים</small></div>
    <div class="cell"><b style="color:var(--ok, #1F7A4D);">${nApproved + nFixed}</b><small>אישרו את הרשימה</small></div>
    <div class="cell"><b>${nFixed}</b><small>מהם אחרי תיקונים</small></div>
    <div class="cell"><b style="color:${nPending ? '#92400e' : 'inherit'};">${nPending}</b><small>טרם אישרו</small></div>`;

  const shown = schools.filter(s => {
    if (q && !s.name.includes(q)) return false;
    const st = s.verify ? s.verify.status : 'pending';
    if (fs && st !== fs) return false;
    return true;
  });

  document.getElementById('list').innerHTML = shown.map((s, i) => {
    const v = s.verify;
    const chip = !v
      ? '<span class="v-chip pending">⚪ טרם אושר</span>'
      : v.status === 'fixed'
        ? '<span class="v-chip fixed">🔵 אושר אחרי תיקונים</span>'
        : '<span class="v-chip approved">🟢 אושר</span>';
    return `
    <div class="school-card ${v ? 'ok-border' : ''}">
      <div class="sc-head">
        <span class="nm">${s.name}</span>
        <span>${chip}</span>
      </div>
      <div class="sc-head" style="margin-top:2px;">
        <span class="meta">${s.count} מורים · ${s.subjSummary}${s.principalName ? ' · מנהל/ת: ' + s.principalName : ''}</span>
      </div>
      ${v ? `<div class="v-detail">אושר ע"י <b>${escapeHtml(v.by || '—')}</b> · ${fmtDate(v.at || v.createdAt)}${v.notes ? ' · <span class="note">הערה: ' + escapeHtml(v.notes) + '</span>' : ''}</div>` : ''}
      ${s.missing.length ? '<span class="warn-note">⚠ אין אף מורה ב: ' + s.missing.join(', ') + '</span><br>' : ''}
      <div class="sc-actions" style="margin-top:10px;">
        <button type="button" class="copy-mini" onclick="copyMsg(this, '${s.id}')">העתקת הודעה עם קישור הטופס</button>
        ${phoneFor(s) ? `<a class="copy-mini secondary" target="_blank" rel="noopener" href="${waLink(phoneFor(s), msgFor(s))}" onclick="markSent('${s.id}')">שליחה ישירה בוואטסאפ</a>` : ''}
        ${s.id ? `<a class="copy-mini secondary" target="_blank" rel="noopener" href="${BASE}/verify.html?school=${encodeURIComponent(s.id)}">צפייה בטופס</a>` : ''}
        ${s.id ? `<a class="copy-mini secondary" target="_blank" rel="noopener" href="${BASE}/admin-school/setup.html?school=${encodeURIComponent(s.id)}">פתיחת רשימת ההזנה</a>` : ''}
      </div>
    </div>`;
  }).join('') || '<div class="empty" style="padding:32px;">אין בתי ספר בסינון הזה</div>';

  renderSendPanel();
}

function copyMsg(btn, sid) {
  const s = schools.find(x => x.id === sid);
  if (!s) return;
  navigator.clipboard.writeText(msgFor(s)).then(() => {
    const orig = btn.textContent;
    btn.classList.add('copied');
    btn.textContent = '✓ הועתק — הדביקי בוואטסאפ';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 2200);
  });
}

function escapeHtml(s) {
  return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.getElementById('sp-save').addEventListener('click', saveBlob);
document.getElementById('sp-clear').addEventListener('click', clearPhones);
document.getElementById('q').addEventListener('input', render);
document.getElementById('fStatus').addEventListener('change', render);
init();
</script>
