<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבט בית ספר — מצפן הפיקוח</title>
<link rel="stylesheet" href="../assets/fonts-local.css">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  /* command-strip עם 4 KPIs (במקום 6 ברירת המחדל) */
  .command-strip { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 760px) { .command-strip { grid-template-columns: repeat(2, 1fr); } }
  /* גשר: ה-JS דורס stat-rate/stat-risk ל-class "stat-value" — שיֵראה כמו cmd-metric-value בתוך הפס הכהה */
  .command-strip .stat-value {
    font-family: 'Heebo', sans-serif; font-size: 30px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1; color: #fff;
  }
  .command-strip .stat-value.ok   { color: #fff; }
  .command-strip .stat-value.warn { color: var(--sand); }
  .command-strip .stat-value.err  { color: var(--coral); }

  .tabs-bar { display:flex; gap:4px; border-bottom:2px solid var(--border); margin-bottom:24px; overflow-x:auto; }
  .tab-btn { background:none; border:none; padding:12px 20px; font-family:inherit; font-size:15px; font-weight:600; color:var(--text-2); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap; }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--brand-accent); border-bottom-color:var(--brand-accent); }
  .tab-pane { display:none; }
  .tab-pane.active { display:block; }

  .att-grid { width:100%; border-collapse:collapse; font-size:14px; }
  .att-grid th, .att-grid td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:center; }
  .att-grid th { background:var(--surface-2); font-weight:700; color:var(--text); }
  .att-grid td.name-cell { text-align:right; font-weight:600; }
  .att-grid td.subject-cell { text-align:right; font-size:13px; color:var(--text-2); }
  .att-cell { width:50px; }
  .att-mark { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; font-weight:700; font-size:13px; }
  .att-mark.present { background:var(--ok-soft); color:var(--ok); }
  .att-mark.partial { background:var(--warn-soft); color:#92400e; }
  .att-mark.absent { background:var(--surface-2); color:var(--text-3); }
  .att-mark.future { background:#f1f5f9; color:var(--text-3); border:1px dashed var(--border); }
  .rate-cell { font-weight:700; }
  .rate-cell.high { color:var(--ok); }
  .rate-cell.mid { color:#d97706; }
  .rate-cell.low { color:var(--err); }

  .subject-group { margin-bottom:28px; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .subject-header { padding:12px 16px; background:var(--surface-2); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .subject-header h3 { margin:0; font-size:16px; }
  .subject-header .meta { font-size:13px; color:var(--text-2); }

  .filter-bar { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
  .filter-bar .filter-item { flex:1; min-width:160px; }
  .filter-bar label { display:block; font-size:13px; color:var(--text-2); margin-bottom:4px; }

  .low-rate-card { background: linear-gradient(135deg, #fef3c7 0%, #fff7ed 100%); border:1px solid #fcd34d; border-radius:12px; padding:16px; margin-bottom:16px; }
  .low-rate-card h4 { margin:0 0 8px; color:#78350f; }
  .reminder-btn { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:6px; background:white; border:1px solid #fcd34d; color:#78350f; font-family:inherit; font-size:12px; font-weight:600; text-decoration:none; cursor:pointer; }
  .reminder-btn svg { width:12px; height:12px; }

  @media (max-width: 720px) {
    .att-grid { font-size:12px; }
    .att-grid th, .att-grid td { padding:6px 4px; }
  }
</style>
</head>
<body data-role="school">

  <!-- System Command Bar -->
  <header class="command-bar">
    <div class="command-bar-left">
      <a href="../" style="display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;" title="חזרה לדף הבית">
        <svg class="compass-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="2" fill="currentColor"/>
          <path d="M16 6 L18 16 L16 16 Z M16 26 L14 16 L16 16 Z" fill="currentColor" opacity="0.85"/>
          <path d="M6 16 L16 14 L16 16 Z M26 16 L16 18 L16 16 Z" fill="currentColor" opacity="0.45"/>
        </svg>
        <div class="command-bar-text">
          <span class="unit">משרד העבודה</span>
          <span class="sub" id="role-label">מנהל בית ספר</span>
        </div>
      </a>
    </div>
    <div class="command-bar-status">
      <span class="status-dot" aria-hidden="true"></span>
      <span>מבט בית ספר</span>
    </div>
  </header>

  <main class="dashboard-shell">

    <!-- Page Header -->
    <section class="page-header">
      <div>
        <div class="page-header-eyebrow">מבט בית ספר · ניהול פדגוגי</div>
        <h1 id="page-title">דשבורד בית ספר</h1>
        <p class="page-header-sub" id="page-subtitle">—</p>
      </div>
      <div class="page-compass">
        <svg class="page-compass-svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
          <circle cx="40" cy="40" r="34" stroke="#D8E1E5" stroke-width="1" stroke-dasharray="3 4"/>
          <circle cx="40" cy="40" r="22" stroke="#D8E1E5" stroke-width="1"/>
          <circle cx="40" cy="40" r="10" stroke="#6FB7A6" stroke-width="1.2" opacity="0.7"/>
          <path d="M40 18 L43 40 L40 38 L37 40 Z" fill="#256A8A"/>
          <path d="M40 62 L37 40 L40 42 L43 40 Z" fill="#C8B9D9" opacity="0.7"/>
          <circle cx="40" cy="40" r="3.5" fill="#FFFFFF" stroke="#256A8A" stroke-width="1.2"/>
          <circle cx="40" cy="40" r="1.5" fill="#256A8A"/>
          <text x="40" y="15" text-anchor="middle" font-family="Frank Ruhl Libre" font-size="8" font-weight="700" fill="#256A8A">N</text>
        </svg>
        <div class="page-compass-info">
          <strong id="user-name">—</strong>
          <span id="user-school">—</span>
          <div class="page-compass-status">
            <span>מערכת מעודכנת</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Compass Divider -->
    <div class="compass-divider" aria-hidden="true">
      <span class="label">תמונת מצב</span>
      <div class="line"></div>
      <div class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></div>
      <div class="line"></div>
    </div>

    <!-- Command Strip — 4 KPIs -->
    <section class="command-strip" aria-label="נתוני בית הספר">
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          מורים
        </div>
        <div class="cmd-metric-value" id="stat-teachers">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          מקצועות
        </div>
        <div class="cmd-metric-value" id="stat-subjects">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
          אחוז נוכחות ממוצע
        </div>
        <div class="cmd-metric-value" id="stat-rate">—</div>
        <div class="cmd-metric-sub" id="stat-rate-sub">יעד: 80%</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></svg>
          מורים בסיכון
        </div>
        <div class="cmd-metric-value" id="stat-risk">—</div>
        <div class="cmd-metric-sub">מתחת ל-50%</div>
      </div>
    </section>

    <div id="alerts-section"></div>

    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="teachers">המורים שלי</button>
      <button class="tab-btn" data-tab="trainings">ההדרכות</button>
    </div>

    <div class="tab-pane active" id="tab-teachers">
      <div class="filter-bar">
        <div class="filter-item">
          <label>חיפוש</label>
          <input type="search" class="input" id="filter-search" placeholder="שם מורה...">
        </div>
        <div class="filter-item">
          <label>מקצוע</label>
          <select class="select" id="filter-subject">
            <option value="">כל המקצועות</option>
          </select>
        </div>
      </div>

      <div id="teachers-container">
        <div class="empty" style="padding:32px;">טוען...</div>
      </div>
    </div>

    <div class="tab-pane" id="tab-trainings">
      <div class="card" style="padding:0;">
        <div id="trainings-list">
          <div class="empty" style="padding:32px;">טוען...</div>
        </div>
      </div>
    </div>

  </main>

<script src="../assets/app.js"></script>
<script src="../assets/auth-guard.js" data-roles="school_admin,school_subject_coordinator,network_admin"></script>
<script src="dashboard.js"></script>
</body>
</html>
