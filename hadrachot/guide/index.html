<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבט מקצועי — מצפן הפיקוח</title>
<link rel="stylesheet" href="../assets/fonts-local.css">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  /* command-strip עם 4 KPIs */
  .command-strip { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 760px) { .command-strip { grid-template-columns: repeat(2, 1fr); } }

  /* כפתור פעולה בראש העמוד */
  .page-header-actions { display:flex; flex-direction:column; align-items:flex-end; gap:16px; }

  /* כרטיס חומרים וקישורים */
  .resources-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg, 16px); padding: 20px 24px; margin-bottom: 24px; box-shadow: var(--shadow-card); }
  .resources-head { display:flex; align-items:center; gap:10px; font-family:'Frank Ruhl Libre', serif; font-size:18px; font-weight:700; color:var(--text); margin-bottom:14px; }
  .resources-head svg { width:20px; height:20px; color:var(--primary); }
  .resources-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .resource-link { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface-soft); text-decoration:none; color:var(--text); transition: border-color .15s, box-shadow .2s, transform .15s; cursor:pointer; font-family:inherit; text-align:right; width:100%; }
  .resource-link:hover { border-color: var(--primary); box-shadow: var(--shadow-card); transform: translateY(-1px); text-decoration:none; }
  .resource-link .ic { width:40px; height:40px; flex-shrink:0; border-radius:10px; display:grid; place-items:center; }
  .resource-link .ic svg { width:20px; height:20px; }
  .resource-link .ic.drive { background:#E6F0F4; color:var(--primary); }
  .resource-link .ic.zoom  { background:#DBEDE6; color:var(--mint); }
  .resource-link .ic.send  { background:#F8DDD0; color:var(--coral); }
  .resource-link .tx { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .resource-link .tx strong { font-size:14px; font-weight:700; }
  .resource-link .tx span { font-size:12px; color:var(--text-muted); }
  .resource-link.copied { border-color: var(--mint); }

  .tabs-bar {
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-2);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--brand-accent); border-bottom-color: var(--brand-accent); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .att-grid { width: 100%; border-collapse: collapse; font-size: 14px; }
  .att-grid th, .att-grid td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
  .att-grid th { background: var(--surface-2); font-weight: 700; color: var(--text); }
  .att-grid td.name-cell { text-align: right; font-weight: 600; }
  .te-row-head { display:flex; align-items:center; gap:6px; }
  .te-name-text { font-weight:700; }
  .te-actions { display:inline-flex; gap:2px; opacity:0.55; transition:opacity .15s; }
  tr:hover .te-actions { opacity:1; }
  .te-icon { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:3px; border-radius:6px; line-height:0; }
  .te-icon:hover { background:var(--surface-2); color:var(--brand-primary); }
  .te-icon-danger:hover { background:#fdeaea; color:var(--err); }
  .te-note { display:flex; align-items:flex-start; gap:5px; font-weight:400; font-size:12px; line-height:1.45; color:var(--text-2); margin-top:4px; max-width:260px; cursor:pointer; }
  .te-note:hover { color:var(--brand-primary); }
  .te-note svg { color: var(--coral, #d97757); opacity:0.9; }
  .te-addnote { background:none; border:none; cursor:pointer; color:var(--text-3, #9aa7b2); font-family:inherit; font-size:11.5px; padding:3px 0 0; margin-top:2px; }
  .te-addnote:hover { color:var(--brand-accent); text-decoration:underline; }
  .att-grid td.school-cell { text-align: right; color: var(--text-2); font-size: 13px; }
  .att-cell { width: 50px; }
  .att-mark { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; font-weight:700; font-size:13px; }
  .att-mark.present { background: var(--ok-soft); color: var(--ok); }
  .att-mark.partial { background: var(--warn-soft); color: #92400e; }
  .att-mark.absent { background: var(--surface-2); color: var(--text-3); }
  .att-mark.future { background: #f1f5f9; color: var(--text-3); border: 1px dashed var(--border); }

  .rate-cell { font-weight: 700; }
  .rate-cell.high { color: var(--ok); }
  .rate-cell.mid { color: #d97706; }
  .rate-cell.low { color: var(--err); }

  .school-group { margin-bottom: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .school-header { padding: 12px 16px; background: var(--surface-2); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .school-header h3 { margin: 0; font-size: 16px; }
  .school-header .meta { font-size: 13px; color: var(--text-2); }

  .search-bar { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .search-bar input { flex: 1; min-width: 220px; }

  /* צ'יפ מסלול — בגרות / גמר */
  .track-chip {
    display: inline-flex; align-items: center;
    padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; line-height: 1.6;
  }
  .track-chip.bagrut { background: #E6F0F4; color: var(--primary, #256A8A); }
  .track-chip.gemer  { background: #F8DDD0; color: #9a3f1d; }

  .copy-link-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding: 6px 12px; border-radius: 8px;
    background: var(--brand-accent); color: white;
    border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
  }
  .copy-link-btn.copied { background: var(--ok); }
  .copy-link-btn svg { width: 14px; height: 14px; }

  .training-row { padding: 14px 16px; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .training-row:last-child { border-bottom: none; }
  .training-row .when { font-weight: 700; }
  .training-row .where { color: var(--text-2); font-size: 13px; }
  .training-row .actions { display:flex; gap:8px; flex-wrap:wrap; }

  @media (max-width: 720px) {
    .att-grid { font-size: 12px; }
    .att-grid th, .att-grid td { padding: 6px 4px; }
    .att-grid .school-cell { display: none; }
    .page-header-actions { align-items: stretch; }
  }
</style>
</head>
<body data-role="guide">

  <!-- System Command Bar -->
  <header class="command-bar">
    <div class="command-bar-left">
      <a href="../" style="display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;" title="חזרה לדף הבית">
        <svg class="compass-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="2" fill="currentColor"/>
          <path d="M16 6 L18 16 L16 16 Z M16 26 L14 16 L16 16 Z" fill="currentColor" opacity="0.85"/>
          <path d="M6 16 L16 14 L16 16 Z M26 16 L16 18 L16 16 Z" fill="currentColor" opacity="0.45"/>
        </svg>
        <div class="command-bar-text">
          <span class="unit">משרד העבודה</span>
          <span class="sub">מבט מקצועי · מדריך/ה</span>
        </div>
      </a>
    </div>
    <div class="command-bar-status">
      <span class="status-dot" aria-hidden="true"></span>
      <span>מבט מקצועי</span>
    </div>
  </header>

  <main class="dashboard-shell">

    <!-- Page Header -->
    <section class="page-header">
      <div>
        <div class="page-header-eyebrow">מבט מקצועי · המורים שלי</div>
        <h1 id="page-title">דשבורד מדריכה</h1>
        <p class="page-header-sub" id="page-subtitle">—</p>
      </div>
      <div class="page-header-actions">
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          <button class="btn btn-primary" id="btn-new-training">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            הדרכה חדשה
          </button>
          <button class="btn btn-secondary" id="btn-add-teacher">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            הוספת מורה
          </button>
        </div>
        <div class="page-compass">
          <svg class="page-compass-svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
            <circle cx="40" cy="40" r="34" stroke="#D8E1E5" stroke-width="1" stroke-dasharray="3 4"/>
            <circle cx="40" cy="40" r="22" stroke="#D8E1E5" stroke-width="1"/>
            <circle cx="40" cy="40" r="10" stroke="#6FB7A6" stroke-width="1.2" opacity="0.7"/>
            <path d="M40 18 L43 40 L40 38 L37 40 Z" fill="#256A8A"/>
            <path d="M40 62 L37 40 L40 42 L43 40 Z" fill="#C8B9D9" opacity="0.7"/>
            <circle cx="40" cy="40" r="3.5" fill="#FFFFFF" stroke="#256A8A" stroke-width="1.2"/>
            <circle cx="40" cy="40" r="1.5" fill="#256A8A"/>
            <text x="40" y="15" text-anchor="middle" font-family="Frank Ruhl Libre" font-size="8" font-weight="700" fill="#256A8A">N</text>
          </svg>
          <div class="page-compass-info">
            <strong id="user-name">—</strong>
            <div class="page-compass-status">
              <span>מערכת מעודכנת</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Compass Divider -->
    <div class="compass-divider" aria-hidden="true">
      <span class="label">תמונת מצב</span>
      <div class="line"></div>
      <div class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></div>
      <div class="line"></div>
    </div>

    <!-- Command Strip — 4 KPIs -->
    <section class="command-strip" aria-label="נתוני המדריך/ה">
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          מורים שלי
        </div>
        <div class="cmd-metric-value" id="stat-teachers">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M3 10l9-7 9 7M5 10v11M19 10v11M9 14h6v7H9z"/></svg>
          בתי ספר
        </div>
        <div class="cmd-metric-value" id="stat-schools">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          הדרכות השנה
        </div>
        <div class="cmd-metric-value" id="stat-trainings">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
          אחוז נוכחות ממוצע
        </div>
        <div class="cmd-metric-value mint" id="stat-rate">—</div>
      </div>
    </section>

    <!-- Resources — Drive / Zoom / שליחת חומרים -->
    <section class="resources-card" id="resources-card" hidden>
      <div class="resources-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7l-2-3H5a2 2 0 0 0-2 2z"/></svg>
        <span>חומרים וקישורים</span>
      </div>
      <div class="resources-grid" id="resources-grid"></div>
    </section>

    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="teachers">המורים שלי</button>
      <button class="tab-btn" data-tab="trainings">ההדרכות שלי</button>
      <button class="tab-btn" data-tab="stats">סטטיסטיקה חודשית</button>
    </div>

    <div class="tab-pane active" id="tab-teachers">
      <div class="subject-filter-bar" id="track-filter" style="margin-bottom:12px;"></div>
      <div class="search-bar">
        <input type="search" class="input" id="teacher-search" placeholder="חיפוש מורה / בית ספר...">
      </div>
      <div id="teachers-container">
        <div class="empty" style="padding:32px;">טוען...</div>
      </div>
    </div>

    <div class="tab-pane" id="tab-trainings">
      <div class="card" style="padding:0;">
        <div id="trainings-list">
          <div class="empty" style="padding:32px;">טוען...</div>
        </div>
      </div>
    </div>

    <div class="tab-pane" id="tab-stats">
      <div class="card">
        <div class="card-title">אחוז נוכחות חודשי</div>
        <div id="stats-chart"></div>
      </div>
    </div>
  </main>

<!-- New training modal -->
<div class="modal-overlay" id="modal-training">
  <div class="modal">
    <div class="modal-head">
      <h3>הדרכה חדשה</h3>
      <button class="modal-close" onclick="closeNewTraining()">×</button>
    </div>
    <form id="form-training">
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">מקצוע *</label>
          <select class="select" name="subject" id="t-subject" required>
            <option value="">בחרי מקצוע</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">תאריך *</label>
          <input type="date" class="input" name="date" id="t-date" required>
        </div>
        <div class="form-row">
          <label class="form-label">מיקום</label>
          <input class="input" name="location" placeholder='זום / בית הספר X'>
        </div>
        <div class="form-row">
          <label class="form-label">שם מדריך/ה</label>
          <input class="input" name="guideName">
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">מייל מדריך/ה</label>
          <input type="email" class="input" name="guideEmail">
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">הערות</label>
          <textarea class="textarea" name="notes" placeholder="נושאים, חומרים..."></textarea>
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button type="submit" class="btn btn-primary">צרי הדרכה</button>
        <button type="button" class="btn btn-secondary" onclick="closeNewTraining()">ביטול</button>
      </div>
    </form>
  </div>
</div>

<!-- Add / Edit teacher modal -->
<div class="modal-overlay" id="modal-teacher">
  <div class="modal">
    <div class="modal-head">
      <h3 id="teacher-modal-title">הוספת מורה</h3>
      <button class="modal-close" onclick="closeTeacherModal()">×</button>
    </div>
    <form id="form-teacher">
      <input type="hidden" name="id" id="te-id">
      <div class="form-grid">
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">שם המורה *</label>
          <input class="input" name="name" id="te-name" required>
        </div>
        <div class="form-row">
          <label class="form-label">בית ספר</label>
          <input class="input" name="schoolName" id="te-school" placeholder="שם בית הספר">
        </div>
        <div class="form-row">
          <label class="form-label">רשת</label>
          <select class="select" name="network" id="te-network">
            <option value="">בחרי רשת</option>
            <option value="ort">אורט</option>
            <option value="amal">עמל</option>
            <option value="atid">עתיד</option>
            <option value="sakhnin">סכנין</option>
            <option value="dror">דרור</option>
            <option value="ezraei_haredi">עצמאי חרדי</option>
            <option value="beit_el">בית אל</option>
            <option value="kanada_israel">קנדה ישראל</option>
            <option value="shulamit_haredi">שלומית חרדי</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">מסלול</label>
          <select class="select" name="type" id="te-type">
            <option value="bagrut">בגרות</option>
            <option value="gemer">גמר</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">טלפון (לוואטסאפ)</label>
          <input class="input" name="phone" id="te-phone" placeholder="05...">
        </div>
        <div class="form-row">
          <label class="form-label">מייל</label>
          <input type="email" class="input" name="email" id="te-email">
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">הערה אישית (נראית רק לך)</label>
          <textarea class="textarea" name="notes" id="te-notes" placeholder="לדוגמה: מורה חדשה, זקוקה לליווי בנושא X, פספסה בגלל מילואים..."></textarea>
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button type="submit" class="btn btn-primary" id="te-submit">שמירה</button>
        <button type="button" class="btn btn-secondary" onclick="closeTeacherModal()">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/app.js?v=20260901"></script>
<script src="../assets/guides.js?v=20260901"></script>
<script src="dashboard.js?v=20260901"></script>
</body>
</html>
