<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבט מקצועי — מנור</title>
<!-- נעילה: רק בעל התפקיד שלו רואה את המבט (24.9.26) -->
<script src="../assets/staff.js?v=20260924" data-view="guide"></script>

<style>
  .gl-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; }
  .gl-btn:hover { border-color:var(--primary,#1A5365); color:var(--primary,#1A5365); text-decoration:none; }
  .gl-btn svg { width:15px; height:15px; }
  .gl-btn.wa { background:#1f7a5c; border-color:#1f7a5c; color:#fff; }
  .gl-btn.wa:hover { background:#18654b; color:#fff; }
  .gl-btn.done { border-color:var(--ok,#16a34a); color:var(--ok,#16a34a); }
  .lib-ask { border:2px solid var(--primary,#1A5365); border-radius:12px; padding:14px; margin-top:10px; background:var(--surface); }
  .lib-ask-q { font-weight:800; font-size:15px; margin-bottom:10px; }
  .lib-ask-list { display:flex; flex-wrap:wrap; gap:8px; }
  .lib-ask-list button { border:1px solid var(--border); background:var(--surface-soft); border-radius:10px; padding:8px 12px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .lib-ask-list button:hover { border-color:var(--primary,#1A5365); color:var(--primary,#1A5365); }
  .lib-ask-list button svg { width:15px; height:15px; }
  .lib-ask-list .sub-h { flex-basis:100%; font-size:12px; color:var(--text-muted); margin-top:4px; }
  .lib-ask-new { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .lib-ask-new .input { flex:1; min-width:200px; }
  .lib-ask-cancel { background:none; border:none; color:var(--text-muted); font-family:inherit; margin-top:8px; cursor:pointer; text-decoration:underline; }
  .lib-folder > summary .up { font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:3px 9px; cursor:pointer; font-family:inherit; color:var(--primary,#1A5365); }
  .lib-upload { background:var(--surface-soft); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
  .lib-to { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:8px; }
  .lib-to .select { flex:1; max-width:420px; }
  .lib-addlink { margin-top:8px; font-size:13px; }
  .lib-addlink summary { cursor:pointer; color:var(--primary,#1A5365); font-weight:600; }
  .lib-linkform { display:grid; grid-template-columns: 2fr 1.4fr auto; gap:8px; margin-top:8px; }
  @media (max-width: 640px) { .lib-linkform { grid-template-columns: 1fr; } }
  .lib-drive { display:flex; align-items:center; gap:10px; background:#EEF6F3; border:1px solid #CFE5DC; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:13.5px; }
  .lib-drive a { font-weight:700; }
  .lib-drive-edit { margin-inline-start:auto; background:none; border:none; color:var(--text-muted); font-family:inherit; font-size:12.5px; text-decoration:underline; cursor:pointer; }
  .lib-drive-ask { flex-direction:column; align-items:stretch; gap:8px; }
  .lib-drive-q { display:flex; gap:10px; align-items:flex-start; line-height:1.55; }
  .lib-drive-q svg { width:18px; height:18px; flex:none; margin-top:2px; }
  .lib-drive-row { display:flex; gap:8px; flex-wrap:wrap; }
  .lib-drive-row .input { flex:1; min-width:220px; }
  .lib-drive-status { font-size:12.5px; color:var(--coral,#b3413a); min-height:1em; }
  .lib-folder { border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--surface); }
  .lib-folder > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:11px 14px; font-weight:700; font-size:14.5px; }
  .lib-folder > summary::-webkit-details-marker { display:none; }
  .lib-folder > summary .mm-chev { width:16px; height:16px; transition:transform .15s; flex:none; }
  .lib-folder[open] > summary .mm-chev { transform:rotate(180deg); }
  .lib-folder > summary .c { margin-inline-start:auto; font-size:12px; font-weight:600; color:var(--text-muted); background:var(--surface-soft); border-radius:99px; padding:2px 9px; }
  .lib-folder > summary .auto { font-size:11px; font-weight:600; color:#1f7a5c; background:#EEF6F3; border-radius:99px; padding:1px 8px; }
  .lib-folder .lib-body { padding:0 14px 8px; }
  .lib-folder .lib-folder { margin:6px 0; }
  .file-row .fr-move { font-size:12px; border:1px solid var(--border); border-radius:8px; padding:3px 6px; background:var(--surface); max-width:150px; font-family:inherit; }
  .drop-zone { border:2px dashed var(--border); border-radius:12px; padding:22px 16px; text-align:center; cursor:pointer; background:var(--surface-soft); transition:border-color .15s, background .15s; }
  .drop-zone:hover, .drop-zone.over { border-color:var(--primary,#1A5365); background:#EDF4F7; }
  .drop-zone svg { width:26px; height:26px; color:var(--primary,#1A5365); margin-bottom:6px; }
  .drop-zone .dz-main { font-weight:700; font-size:14px; }
  .drop-zone .dz-sub { font-size:12px; color:var(--text-muted); margin-top:3px; }
  .file-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .file-row:last-child { border-bottom:none; }
  .file-row .fr-icon { width:32px; height:32px; flex:none; border-radius:8px; background:#E6F0F4; display:flex; align-items:center; justify-content:center; color:var(--primary,#1A5365); }
  .file-row .fr-icon svg { width:16px; height:16px; }
  .file-row .fr-body { flex:1; min-width:0; }
  .file-row .fr-name { font-weight:600; font-size:13.5px; word-break:break-word; }
  .file-row .fr-meta { font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .from-insp { display:inline-block; font-size:10.5px; font-weight:700; color:#6b4f99; background:#F0EAF7; border-radius:999px; padding:0 7px; margin-inline-start:4px; }
  .row-del { background:none; border:none; cursor:pointer; color:var(--text-3,#8b9aa3); font-family:inherit; font-size:12px; padding:4px 6px; border-radius:6px; }
  .row-del:hover { background:var(--err-soft,#fee2e2); color:#991b1b; }
  .ws-status { font-size:12.5px; color:var(--text-muted); margin-top:8px; min-height:18px; }
  .mm-chev { width:18px; height:18px; flex:none; color:var(--primary,#1A5365); transition:transform .18s; }
  .gsec { display:block; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 22px; margin:0 0 18px; }
  .gsec-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .gsec h2 { display:flex; align-items:center; gap:10px; margin:0; font-size:19px; font-weight:800; color:var(--primary-dark,#143E4C); }
  .gsec-ic { width:30px; height:30px; flex:none; padding:6px; box-sizing:border-box; border-radius:9px; background:var(--primary,#1A5365); color:#fff; }
  .gsec-head .n { display:inline-block; min-width:20px; padding:0 7px; border-radius:999px; font-size:12px; line-height:20px; text-align:center; background:var(--primary,#1A5365); color:#fff; }
  .gsec-head .n.zero { display:none; }
  .gsec .group-link-card { margin-bottom:14px; }
  .lib-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:18px 0 14px; }
  .lib-top h1 { margin:0; font-size:24px; font-weight:800; color:var(--text); }
</style>
</head>
<body data-role="guide" data-look="menor">
  <!-- System Command Bar -->
  <header class="command-bar">
    <div class="command-bar-left">
      <a href="../" style="display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;" title="חזרה לדף הבית">
        <img class="compass-icon" src="../assets/menor-sail.png" alt="" aria-hidden="true">
        <div class="command-bar-text">
          <span class="unit"><img class="menor-word" src="../assets/menor-word.png" alt="מנור"></span>
          <span class="sub">מבט מקצועי · מדריך/ה</span>
        </div>
      </a>
    </div>
    <div class="command-bar-status">
      <span class="status-dot" aria-hidden="true"></span>
      <span>מבט מקצועי</span>
    </div>
  </header>

  <main class="dashboard-shell">
    <div class="lib-top">
      <h1 id="lib-title">מאגר החומרים</h1>
      <a class="gl-btn" id="back-guide" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg><span>חזרה למבט המדריכ/ה</span></a>
    </div>
    <!-- מאגר החומרים — עמוד נפרד (מיטל 28.9.26: "זה יוצר עומס על הדף") — כל קובץ שהמדריכ/ה מעלה נכנס לכאן, לפי תיקיות (library.js, 28.9.26) -->
    <section class="gsec" id="sec-library">
      <div class="gsec-head"><h2><svg class="gsec-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7l-2-3H5a2 2 0 0 0-2 2z"/></svg><span>מאגר החומרים</span></h2><span class="n zero" id="lib-count">0</span></div>
      <div id="lib-drive"></div>
      <div class="lib-upload">
        <div class="drop-zone" id="gdrop-zone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          <div class="dz-main">העלאת חומר חדש — גררי לכאן או לחצי לבחירה</div>
          <div class="dz-sub">אחרי הבחירה נשאל לאיזו תיקייה · עד 8MB לקובץ · בלי שמות תלמידים או ציונים</div>
          <input type="file" id="gfile-input" multiple hidden>
        </div>
        <div class="lib-ask" id="lib-ask" hidden>
          <div class="lib-ask-q" id="lib-ask-q">לאיזו תיקייה להעלות?</div>
          <div class="lib-ask-list" id="lib-ask-list"></div>
          <div class="lib-ask-new">
            <input class="input" id="lib-newfolder" placeholder="אין תיקייה מתאימה? שם לתיקייה חדשה" maxlength="60">
            <button type="button" class="btn btn-primary" id="lib-newfolder-go">פתיחת התיקייה והעלאה</button>
          </div>
          <button type="button" class="lib-ask-cancel" id="lib-ask-cancel">ביטול</button>
        </div>
        <details class="lib-addlink">
          <summary>הוספת קישור (דרייב, יוטיוב, אתר)</summary>
          <div class="lib-linkform">
            <input class="input" id="lib-link-url" dir="ltr" placeholder="https://">
            <input class="input" id="lib-link-name" placeholder="שם שיוצג">
            <button type="button" class="btn btn-secondary" id="lib-link-add">הוספה</button>
          </div>
        </details>
        <div class="ws-status" id="gfiles-status"></div>
      </div>
      <input type="search" class="input" id="lib-search" placeholder="חיפוש במאגר…" style="margin:4px 0 10px;">
      <div id="gfiles-list"></div>
    </section>
  </main>
<script src="../assets/app.js?v=20260924h"></script>
<script src="../assets/guides.js?v=20260928a"></script>

</body>
