<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מאגר ידע — מצפן הפיקוח</title>
<link rel="stylesheet" href="../assets/fonts-local.css">
<link rel="stylesheet" href="../assets/styles.css">
<style>
.kn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.kn-card {
  display: block;
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s, box-shadow 0.2s;
}
.kn-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  text-decoration: none;
}
</style>
</head>
<body data-role="ministry">

  <!-- System Command Bar -->
  <header class="command-bar">
    <div class="command-bar-left">
      <a href="../" style="display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;" title="חזרה לדף הבית">
        <svg class="compass-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="2" fill="currentColor"/>
          <path d="M16 6 L18 16 L16 16 Z M16 26 L14 16 L16 16 Z" fill="currentColor" opacity="0.85"/>
          <path d="M6 16 L16 14 L16 16 Z M26 16 L16 18 L16 16 Z" fill="currentColor" opacity="0.45"/>
        </svg>
        <div class="command-bar-text">
          <span class="unit">משרד העבודה</span>
          <span class="sub">מאגר ידע משותף</span>
        </div>
      </a>
    </div>
    <button class="command-bar-cta" onclick="openAddItem()">
      הוספת פריט
    </button>
  </header>

  <main class="dashboard-shell">

    <!-- Page Header -->
    <section class="page-header">
      <div>
        <div class="page-header-eyebrow">מאגר ידע · חומרי הדרכה</div>
        <h1>מאגר ידע משותף</h1>
        <p class="page-header-sub">מערכי שיעור, תבניות, סרטונים וחומרי הדרכה — לכל המקצועות והתפקידים.</p>
      </div>
      <div class="page-compass">
        <svg class="page-compass-svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
          <circle cx="40" cy="40" r="34" stroke="#D8E1E5" stroke-width="1" stroke-dasharray="3 4"/>
          <circle cx="40" cy="40" r="22" stroke="#D8E1E5" stroke-width="1"/>
          <circle cx="40" cy="40" r="10" stroke="#6FB7A6" stroke-width="1.2" opacity="0.7"/>
          <path d="M40 18 L43 40 L40 38 L37 40 Z" fill="#256A8A"/>
          <path d="M40 62 L37 40 L40 42 L43 40 Z" fill="#C8B9D9" opacity="0.7"/>
          <circle cx="40" cy="40" r="3.5" fill="#FFFFFF" stroke="#256A8A" stroke-width="1.2"/>
          <circle cx="40" cy="40" r="1.5" fill="#256A8A"/>
          <text x="40" y="15" text-anchor="middle" font-family="Frank Ruhl Libre" font-size="8" font-weight="700" fill="#256A8A">N</text>
        </svg>
        <div class="page-compass-info">
          <strong>חומרים משותפים</strong>
          <div class="page-compass-status">
            <span>מתעדכן</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Compass Divider -->
    <div class="compass-divider" aria-hidden="true">
      <span class="label">סינון וחיפוש</span>
      <div class="line"></div>
      <div class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
      <div class="line"></div>
    </div>

    <div class="filter-bar">
      <input type="search" id="search" class="input" placeholder="חיפוש בכותרת או בתיאור..." style="max-width:280px;">
      <select id="cat-filter" class="select">
        <option value="">כל הקטגוריות</option>
      </select>
      <select id="aud-filter" class="select">
        <option value="">לכל קהל היעד</option>
        <option value="teacher">למורים</option>
        <option value="guide">למדריכים</option>
        <option value="principal">למנהלים</option>
      </select>
      <span id="count" style="color:var(--text-2); font-size:14px;">—</span>
    </div>

    <div class="kn-grid" id="items">
      <div class="empty card">טוען...</div>
    </div>
  </main>

<!-- Add modal -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <div class="modal-head">
      <h3>הוספת פריט חדש</h3>
      <button class="modal-close" onclick="closeAddItem()">×</button>
    </div>
    <form id="form-knowledge">
      <div class="form-row">
        <label class="form-label">כותרת *</label>
        <input class="input" name="title" required>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">קטגוריה</label>
          <input class="input" name="category" placeholder="למשל: מתמטיקה / מנהלי">
        </div>
        <div class="form-row">
          <label class="form-label">קהל יעד</label>
          <select class="select" name="audience">
            <option value="all">לכולם</option>
            <option value="teacher">למורים</option>
            <option value="guide">למדריכים</option>
            <option value="principal">למנהלים</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">קישור *</label>
        <input type="url" class="input" name="link" required placeholder="https://...">
        <small class="form-hint">קישור ל-Google Doc / Drive / YouTube / אתר חיצוני</small>
      </div>
      <div class="form-row">
        <label class="form-label">תיאור קצר</label>
        <textarea class="textarea" name="description"></textarea>
      </div>
      <div class="btn-row" style="margin:0;">
        <button type="submit" class="btn btn-primary">הוספה</button>
        <button type="button" class="btn btn-secondary" onclick="closeAddItem()">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="app.js"></script>
</body>
</html>
