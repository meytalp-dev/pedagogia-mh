<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסה — מצפן ההדרכות</title>
<link rel="stylesheet" href="assets/fonts-local.css">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 32px 30px;
    box-shadow: var(--shadow-card);
  }
  .login-head { text-align: center; margin-bottom: 24px; }
  .login-head .compass-icon { width: 44px; height: 44px; color: var(--primary, #256A8A); margin-bottom: 10px; }
  .login-head h1 { font-family: 'Frank Ruhl Libre', serif; font-size: 24px; margin: 0 0 4px; }
  .login-head p { color: var(--text-2); font-size: 14px; margin: 0; }
  .form-label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  .input { width: 100%; box-sizing: border-box; }
  .btn-full { width: 100%; justify-content: center; margin-top: 18px; }
  .login-msg { margin-top: 14px; font-size: 14px; line-height: 1.7; border-radius: 10px; padding: 12px 14px; display: none; }
  .login-msg.err  { display: block; background: var(--err-soft, #fdeaea); color: #7f1d1d; }
  .login-msg.ok   { display: block; background: var(--ok-soft, #e7f6ef); color: #14532d; }
  .login-msg.info { display: block; background: var(--surface-2); color: var(--text-2); }
  .step { display: none; }
  .step.active { display: block; }
  .hello-name { font-weight: 700; color: var(--primary, #256A8A); }
  .back-link { background: none; border: none; color: var(--text-3); font-family: inherit; font-size: 13px; cursor: pointer; margin-top: 12px; text-decoration: underline; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-head">
    <svg class="compass-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="2" fill="currentColor"/>
      <path d="M16 6 L18 16 L16 16 Z M16 26 L14 16 L16 16 Z" fill="currentColor" opacity="0.85"/>
      <path d="M6 16 L16 14 L16 16 Z M26 16 L16 18 L16 16 Z" fill="currentColor" opacity="0.45"/>
    </svg>
    <h1>מצפן ההדרכות</h1>
    <p>כניסת בעלי תפקידים — יחידת הפיקוח על הדרכות מורים</p>
  </div>

  <!-- שלב 1: מייל -->
  <form class="step active" id="step-email">
    <label class="form-label" for="email">כתובת המייל שלך (Gmail)</label>
    <input type="email" class="input" id="email" required autocomplete="email" placeholder="name@gmail.com" dir="ltr" style="text-align:left;">
    <button type="submit" class="btn btn-primary btn-full" id="btn-email">המשך</button>
  </form>

  <!-- שלב 2א: קביעת סיסמה ראשונה -->
  <form class="step" id="step-set">
    <div class="login-msg info" style="display:block;">
      שלום <span class="hello-name" id="hello-set"></span>! זו הכניסה הראשונה שלך —
      בחר/י סיסמה אישית (לפחות 6 תווים). איתה תיכנס/י מעכשיו.
    </div>
    <label class="form-label" for="pw-new">סיסמה חדשה</label>
    <input type="password" class="input" id="pw-new" required minlength="6" autocomplete="new-password">
    <label class="form-label" for="pw-new2">שוב, לאימות</label>
    <input type="password" class="input" id="pw-new2" required minlength="6" autocomplete="new-password">
    <button type="submit" class="btn btn-primary btn-full">קביעת סיסמה וכניסה</button>
    <button type="button" class="back-link" onclick="showStep('email')">→ חזרה</button>
  </form>

  <!-- שלב 2ב: התחברות -->
  <form class="step" id="step-login">
    <div class="login-msg info" style="display:block;">
      שלום <span class="hello-name" id="hello-login"></span> — נא להזין את הסיסמה שקבעת.
    </div>
    <label class="form-label" for="pw">סיסמה</label>
    <input type="password" class="input" id="pw" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary btn-full">כניסה</button>
    <button type="button" class="back-link" onclick="showStep('email')">→ חזרה</button>
  </form>

  <div class="login-msg" id="msg"></div>
</div>

<script src="assets/app.js?v=20260901"></script>
<script src="assets/guides.js?v=20260901"></script>
<script>
const msg = document.getElementById('msg');
let curEmail = '';

function showStep(name) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step-' + name).classList.add('active');
  msg.className = 'login-msg';
  const first = document.querySelector('#step-' + name + ' input');
  if (first) first.focus();
}

function showMsg(kind, text) { msg.className = 'login-msg ' + kind; msg.innerHTML = text; }

const ERRORS = {
  not_provisioned: 'המייל לא נמצא ברשימת בעלי התפקידים. נא לפנות למיטל פלג להוספה.',
  wrong_password: 'הסיסמה שגויה. נסו שוב, או פנו למיטל לאיפוס.',
  password_too_short: 'הסיסמה קצרה מדי — לפחות 6 תווים.',
  password_already_set: 'כבר נקבעה סיסמה למייל הזה — יש להיכנס איתה.',
  password_not_set: 'טרם נקבעה סיסמה — חזרו שלב אחורה והזינו את המייל שוב.'
};

function errText(e) {
  if ((e || '').indexOf('unknown_action') === 0) {
    return 'מערכת ההתחברות עדיין לא הופעלה בשרת — יש לעדכן את ה-Apps Script ולפרוס גרסה חדשה (הוראות אצל מיטל).';
  }
  return ERRORS[e] || ('שגיאה: ' + (e || 'לא ידועה'));
}

document.getElementById('step-email').addEventListener('submit', async e => {
  e.preventDefault();
  curEmail = document.getElementById('email').value.trim().toLowerCase();
  const btn = document.getElementById('btn-email');
  btn.disabled = true; showMsg('info', 'בודק…');
  const res = await TS.api('auth.status', { email: curEmail }, { cache: 'no' });
  btn.disabled = false;
  if (!res.ok) { showMsg('err', errText(res.error)); return; }
  if (!res.exists) { showMsg('err', ERRORS.not_provisioned); return; }
  msg.className = 'login-msg';
  const first = (res.name || curEmail).split(' ')[0];
  if (res.hasPassword) {
    document.getElementById('hello-login').textContent = res.name || curEmail;
    showStep('login');
  } else {
    document.getElementById('hello-set').textContent = res.name || curEmail;
    showStep('set');
  }
});

document.getElementById('step-set').addEventListener('submit', async e => {
  e.preventDefault();
  const p1 = document.getElementById('pw-new').value;
  const p2 = document.getElementById('pw-new2').value;
  if (p1 !== p2) { showMsg('err', 'הסיסמאות אינן זהות.'); return; }
  showMsg('info', 'קובע סיסמה…');
  const res = await TS.apiPost('auth.setPassword', { email: curEmail, password: p1 });
  if (!res.ok) { showMsg('err', errText(res.error)); return; }
  finishLogin(res);
});

document.getElementById('step-login').addEventListener('submit', async e => {
  e.preventDefault();
  showMsg('info', 'מתחבר…');
  const res = await TS.apiPost('auth.login', { email: curEmail, password: document.getElementById('pw').value });
  if (!res.ok) { showMsg('err', errText(res.error)); return; }
  finishLogin(res);
});

function homeFor(auth) {
  if (auth.role === 'ministry_admin') return 'ministry/';
  if (auth.role === 'network_admin') return 'admin-network/?network=' + encodeURIComponent((auth.networkId || '').replace(/^net_/, ''));
  if (auth.role === 'school_admin' || auth.role === 'school_subject_coordinator') {
    return 'admin-school/?school=' + encodeURIComponent(auth.schoolId || '');
  }
  if (auth.role === 'guide') {
    let slug = auth.guideId;
    if (!slug && window.TS_GUIDES) {
      slug = Object.keys(TS_GUIDES).find(k => (TS_GUIDES[k].email || '').toLowerCase() === auth.email) || '';
    }
    return slug ? 'guide/?g=' + slug : 'guide/?guide=' + encodeURIComponent(auth.email);
  }
  return './';
}

function finishLogin(res) {
  TS.authSet(res);
  showMsg('ok', 'התחברת! מעביר לדשבורד…');
  const next = new URLSearchParams(location.search).get('next');
  location.href = next && next.indexOf('//') < 0 ? next : homeFor(TS.authGet());
}

document.getElementById('email').focus();
</script>
</body>
</html>
