# מריץ אוטומטית את בניית knowledge.json (הידע של עוגן) בכל עדכון תוכן באתר.
# כך כל עמוד שנוסף או משתנה נכנס לידע של עוגן בלי שום פעולה ידנית.
name: build-knowledge

on:
  push:
    branches: [main]
    paths: ["**.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build knowledge.json
        run: node tools/build-knowledge.mjs
      - name: commit if changed
        run: |
          if ! git diff --quiet knowledge.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add knowledge.json
            git commit -m "עדכון אוטומטי של knowledge.json (הידע של עוגן)"
            git push
          fi
