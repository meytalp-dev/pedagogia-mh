# מריץ אוטומטית את בניית knowledge.json (הידע של עוגן) ואת search-index.json
# (אינדקס החיפוש באתר) בכל עדכון תוכן. כך כל עמוד שנוסף או משתנה נכנס
# לידע של עוגן ולחיפוש באתר בלי שום פעולה ידנית.
name: build-knowledge

on:
  push:
    branches: [main]
    paths: ["**.html", "templates/**", "ogdan-data.js", "role-defs.js", "tools/build-nav.mjs", "tools/build-knowledge.mjs", "tools/build-search.mjs", "tools/build-sitemap.mjs"]
  workflow_dispatch:

# שני push רצופים יצרו שתי ריצות מקבילות — השנייה נכשלה ב-push כי הראשונה
# כבר דחפה, והאינדקס נשאר ישן בשקט. ריצה אחת בכל רגע, הבאה ממתינה.
concurrency:
  group: build-knowledge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ההיסטוריה המלאה — לבדיקת ההתיישנות לפי תאריך העדכון האחרון
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # התפריט והפוטר מתחדשים מ-templates/ בכל עמוד שמסומן — כך עמוד
      # שנערך ידנית או נוצר מעטפת ישנה מקבל תמיד את התפריט העדכני.
      - name: refresh nav + footer from templates
        run: node tools/build-nav.mjs
      - name: build knowledge.json
        run: node tools/build-knowledge.mjs
      - name: build search-index.json
        run: node tools/build-search.mjs
      - name: build sitemap.xml
        run: node tools/build-sitemap.mjs
      # התרעה לעורכת (לא שער): עמודים ישנים, קישורים שבורים, תגי שנה.
      # הדוח מופיע ב-Summary של הריצה באקשן.
      - name: freshness report
        run: node tools/check-freshness.mjs
        continue-on-error: true
      - name: commit if changed
        run: |
          if ! git diff --quiet -- knowledge.json search-index.json sitemap.xml '*.html'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add knowledge.json search-index.json sitemap.xml '*.html'
            git commit -m "עדכון אוטומטי של knowledge.json והאינדקס של החיפוש"
            git pull --rebase origin main
            git push
          fi
