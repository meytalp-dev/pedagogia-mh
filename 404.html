<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>העמוד לא נמצא · הבית של המנהיגות הפדגוגית היוצרת</title>
<link rel="icon" type="image/png" href="/logo.png">
<meta name="theme-color" content="#0D3B66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0D3B66;--navy-800:#124D7A;--accent:#0A7799;--canvas:#F8FBFF;
        --text:#102A43;--text2:#52687A;--border:#D8E6F2}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Assistant',system-ui,sans-serif;background:var(--canvas);color:var(--text);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
  .box{max-width:520px;text-align:center;background:#fff;border:1px solid var(--border);
       border-radius:22px;padding:48px 36px;box-shadow:0 12px 34px rgba(13,59,102,.09)}
  .num{font-size:4.6rem;font-weight:800;line-height:1;
       background:linear-gradient(135deg,var(--navy-800),#087B9C);
       -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:1.5rem;color:var(--navy);margin:14px 0 8px}
  p{color:var(--text2);font-size:.98rem}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  a.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 26px;
        font-weight:700;font-size:.95rem;text-decoration:none;transition:all .2s}
  a.main{background:linear-gradient(135deg,#124D7A,#087B9C);color:#fff}
  a.main:hover{box-shadow:0 12px 34px rgba(13,59,102,.18);transform:translateY(-1px)}
  a.line{border:1.5px solid #BED4E7;color:var(--navy);background:#fff}
  a.line:hover{border-color:#27C6F3;background:#E7F9FE}
  .foot{margin-top:26px;font-size:.8rem;color:var(--text2)}
</style>
</head>
<body>
<main class="box">
  <div class="num" aria-hidden="true">404</div>
  <h1>העמוד שחיפשת לא נמצא</h1>
  <p>ייתכן שהכתובת השתנתה, או שהעמוד הועבר למקום אחר.
     החיפוש באתר ימצא אותו ברוב המקרים.</p>
  <div class="row">
    <a class="btn main" href="/">לדף הבית</a>
    <a class="btn line" href="/chipus.html">חיפוש באתר</a>
  </div>
  <div class="foot">הבית של המנהיגות הפדגוגית היוצרת · מינהל הכשרה מקצועית<nav class="foot-links" aria-label="קישורים משפטיים"><a href="negishut.html">הצהרת נגישות</a><a href="kesher.html">יצירת קשר</a><a href="privacy.html">מדיניות פרטיות</a><a href="about.html">מי אנחנו</a></nav></div>
</main>
</body>
</html>
