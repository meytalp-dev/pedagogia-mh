<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שיעור · המרחב הפדגוגי</title>
<meta name="description" content="חומרי שיעור לתלמידים — מינהל הכשרה מקצועית.">
<!-- העמוד נשלח לתלמידים בוואטסאפ, ולכן חשוב שהקישור יציג תצוגה מקדימה ולא כתובת חשופה.
     הכותרת כללית כי העמוד סטטי והשיעור נקבע לפי הפרמטר בכתובת. -->
<meta property="og:type" content="website">
<meta property="og:title" content="חומרי שיעור">
<meta property="og:description" content="פעילות פתיחה, מצגת, משחק, דף עבודה ובוחן — המרחב הפדגוגי, מינהל הכשרה מקצועית.">
<meta property="og:image" content="https://pedagogiamh.co.il/logo.png">
<meta property="og:locale" content="he_IL">
<link rel="icon" type="image/png" href="logo.png">
<!-- אין gate.js ואין auth.js: זה העמוד היחיד שנועד לתלמידים,
     והוא נשלח אליהם בקישור. מערך השיעור והמחוון חסומים בקוד. -->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="lesson-kit.css">
<style>
body{background:var(--canvas);margin:0}
.sh-wrap{max-width:960px;margin:0 auto;padding:18px 18px 50px}
.sh-top{background:var(--grad);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:6px}
.sh-top .kick{font-size:.76rem;font-weight:700;opacity:.85;margin-bottom:5px}
.sh-top h1{font-size:1.45rem;font-weight:800;margin:0 0 5px;line-height:1.3;color:#fff}
.sh-top .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.sh-top .chip{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:.78rem;font-weight:600}
.sh-msg{background:var(--soft-bg);border-radius:14px;padding:20px 22px;font-size:.95rem;color:var(--text2);line-height:1.7}
.sh-msg b{color:var(--navy)}
.sh-foot{text-align:center;font-size:.74rem;color:var(--muted);padding:26px 0 0;line-height:1.7}
.sh-foot a{color:inherit;font-weight:600}
/* שם וכיתה — פעם אחת, לפני שיעור מהמחולל, כדי שהתוצאות יגיעו למורה */
.sh-who{background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--sh-sm)}
.sh-who h2{font-size:1.15rem;color:var(--navy);margin:0 0 4px}
.sh-who p{font-size:.88rem;color:var(--text2);margin:0 0 14px;line-height:1.6}
.sh-who .row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:12px}
.sh-who label{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:700;color:var(--navy)}
.sh-who input{font:inherit;font-size:1rem;padding:11px 13px;border:1.5px solid var(--border);border-radius:12px;width:100%}
.sh-who input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,119,153,.12)}
.sh-who .err{color:#9A2B2B;font-size:.84rem;min-height:1.2em;margin-bottom:6px}
.sh-me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--text2);margin:10px 2px 4px}
.sh-me b{color:var(--navy)}
.sh-me button{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
@media(max-width:480px){.sh-who .row{grid-template-columns:1fr}}
@media(max-width:640px){
  .sh-wrap{padding:12px 12px 40px}
  .sh-top{padding:18px 18px;border-radius:14px}
  .sh-top h1{font-size:1.22rem}
}
</style>
</head>
<body>
<div class="sh-wrap">
  <div id="head"></div>
  <div id="host" class="lk-student"></div>
  <div class="sh-foot">
    המרחב הפדגוגי · מינהל הכשרה מקצועית · משרד העבודה<br>
    האתר נבנה על ידי <a href="https://impactos.co.il/" target="_blank" rel="noopener">impactos · impactos.co.il</a>
  </div>
</div>

<script src="lesson-kit.js"></script>
<script>
(function () {
  /* רק חומרי תלמיד. מערך השיעור (תוכנית המורה) והמחוון אינם ברשימה
     ולכן אינם ניתנים לבקשה דרך הכתובת — גם לא בהקלדה ידנית. */
  var STUDENT_KINDS = ["opener", "deck", "game", "sheet", "quiz"];

  var q = new URLSearchParams(location.search);
  var id = (q.get("id") || "").trim();
  var want = (q.get("r") || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  var kinds = want.filter(function (k) { return STUDENT_KINDS.indexOf(k) !== -1; });
  if (!kinds.length) kinds = STUDENT_KINDS;

  var head = document.getElementById("head");
  var host = document.getElementById("host");

  function fail(msg) {
    head.innerHTML = '<div class="sh-top"><div class="kick">המרחב הפדגוגי</div><h1>לא הצלחנו לפתוח את השיעור</h1></div>';
    host.innerHTML = '<div class="sh-msg">' + msg + "</div>";
  }

  if (!id || !/^[a-z0-9-]{2,60}$/i.test(id)) {
    fail("הקישור חסר את מזהה השיעור, או שהוא לא תקין.<br>בקשו מהמורה קישור חדש.");
    return;
  }

  var E = LessonKit.esc;
  /* שיעור מהמחולל: התוצאות נשלחות למורה, ולכן שואלים שם וכיתה פעם אחת (נשמר בדפדפן).
     בהצבעה ובענן המילים לא נשלח שם. */
  function who(d, then) {
    host.innerHTML = '<div class="sh-who"><h2>לפני שמתחילים</h2>' +
      "<p>כותבים שם וכיתה פעם אחת, כדי שהמורה יראו את התשובות שלכם. בהצבעה ובענן המילים השם לא נשלח.</p>" +
      '<div class="row"><label>שם מלא<input id="sh-name" autocomplete="name" maxlength="60"></label>' +
      '<label>כיתה<input id="sh-cls" maxlength="20" placeholder="למשל: י׳2"></label></div>' +
      '<div class="err" id="sh-err" role="alert"></div><button type="button" class="lk-btn primary" id="sh-go">התחלה</button></div>';
    var me = LessonKit.student() || {};
    document.getElementById("sh-name").value = me.name || "";
    document.getElementById("sh-cls").value = me.cls || "";
    function go() {
      var n = document.getElementById("sh-name").value.trim(), c = document.getElementById("sh-cls").value.trim();
      if (n.length < 2) { document.getElementById("sh-err").textContent = "כותבים שם מלא."; return; }
      if (!c) { document.getElementById("sh-err").textContent = "כותבים כיתה."; return; }
      LessonKit.setStudent(n, c);
      then();
    }
    document.getElementById("sh-go").addEventListener("click", go);
    document.getElementById("sh-cls").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    document.getElementById("sh-name").focus();
  }
  function show(d) {
    var me = LessonKit.student(), gen = /^[a-f0-9]{32}$/.test(id);
    head.innerHTML = '<div class="sh-top">' +
      '<div class="kick">חומרי שיעור</div>' +
      "<h1>" + E(d.topic) + "</h1>" +
      '<div class="chips">' +
        '<span class="chip">' + E(d.subject) + "</span>" +
        '<span class="chip">' + E(d.grade) + "</span>" +
      "</div></div>" +
      (gen && me ? '<div class="sh-me">שלום <b>' + E(me.name) + "</b> · " + E(me.cls) + ' <button type="button" id="sh-chg">לא את/ה? החלפה</button></div>' : "");
    var chg = document.getElementById("sh-chg");
    if (chg) chg.addEventListener("click", function () { head.querySelector(".sh-me").remove(); who(d, function () { show(d); }); });
    LessonKit.mount(host, d, kinds, { student: true });
  }

  LessonKit.load(id).then(function (d) {
    document.title = d.topic + " · שיעור";
    var gen = /^[a-f0-9]{32}$/.test(id);
    /* פתיחה בלבד (הצבעה / ענן) — אנונימית, בלי לשאול שם */
    var onlyOpener = kinds.length === 1 && kinds[0] === "opener";
    if (gen && !onlyOpener && !LessonKit.student()) {
      head.innerHTML = '<div class="sh-top"><div class="kick">חומרי שיעור</div><h1>' + E(d.topic) + "</h1></div>";
      who(d, function () { show(d); });
    } else show(d);
  }).catch(function () {
    fail("השיעור המבוקש לא נמצא.<br>ייתכן שהקישור הועתק חלקית — בקשו מהמורה לשלוח אותו שוב.");
  });
})();
</script>
</body>
</html>
