<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<script src="/analytics.js"></script>
<script src="/auth.js" data-space="netunim"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת תוכניות עבודה בית־ספריות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#fafbfc;
  --line:#e3e6ec; --line-strong:#cfd4de;
  --ink:#1d2233; --ink-2:#4d5568; --ink-3:#828b9e;
  --brand:#2f4b7c; --brand-2:#4a6fa5; --brand-soft:#eaf0f8;
  --accent:#c8622f; --accent-soft:#fdf0e8;
  --ok:#2e7d5b; --ok-soft:#e6f4ee;
  --warn:#b0851f; --warn-soft:#fbf3df;
  --danger:#b4453c; --danger-soft:#fbeceb;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(29,34,51,.05), 0 4px 14px rgba(29,34,51,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Assistant','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand-2)}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
body.gated .app{display:none}
.sidebar{background:#232a3d;color:#dfe3ec;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.brand p{font-size:11.5px;color:#8e97ad;margin-top:3px}

.who{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.who .line1{display:flex;align-items:center;gap:8px}
.who .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.who .nm{font-size:13.5px;font-weight:700;line-height:1.25;color:#fff}
.who .rl{font-size:11.5px;color:#8e97ad}
.who .sc{font-size:11.5px;color:#8e97ad;margin-top:7px;display:flex;align-items:center;gap:5px}
.who button.swap{width:100%;margin-top:9px;background:rgba(255,255,255,.08);color:#c2c9d8;
  border-radius:7px;padding:6px;font-size:12px;font-weight:600}
.who button.swap:hover{background:rgba(255,255,255,.16);color:#fff}

nav{padding:11px 10px;flex:1}
nav .nav-group{margin-bottom:13px}
nav .nav-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#6d768d;padding:6px 10px;font-weight:700}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:right;padding:8px 10px;
  border-radius:var(--r-sm);color:#c3cad9;font-size:13.5px;font-weight:500;transition:background .13s,color .13s;margin-bottom:1px}
nav button:hover{background:linear-gradient(180deg,#2F74C0,#2F9F55,#F2B233,#EF5656,#8F7AC3) no-repeat right center/3px 72%,rgba(255,255,255,.06);color:#fff}
nav button.active{background:linear-gradient(180deg,#2F74C0,#2F9F55,#F2B233,#EF5656,#8F7AC3) no-repeat right center/3px 72%,var(--brand-2);color:#fff;font-weight:600}
nav button .ico{width:18px;text-align:center;font-size:13px;flex:none}
nav button .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button .badge{margin-inline-start:auto;font-size:10.5px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;font-weight:700;flex:none}
nav button.active .badge{background:rgba(255,255,255,.26)}

.sidebar-foot{padding:0 16px 20px;display:flex;flex-direction:column;gap:5px}
.sidebar-foot button{background:rgba(255,255,255,.07);color:#c2c9d8;border-radius:var(--r-sm);padding:7px;font-size:12px;font-weight:600;text-align:center}
.sidebar-foot button:hover{background:rgba(255,255,255,.14);color:#fff}
.side-back{display:block;margin:0 16px 18px;padding:7px;border-radius:var(--r-sm);
 background:rgba(255,255,255,.07);color:#c2c9d8;font-size:12px;font-weight:600;
 text-align:center;text-decoration:none}
.side-back:hover{background:rgba(255,255,255,.14);color:#fff}

.main{overflow-x:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:15px 30px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.topbar .spacer{flex:1}
.content{padding:26px 30px 70px;max-width:1300px}

/* ============ GATE ============ */
#gate{display:none;min-height:100vh;padding:40px 20px;background:
  radial-gradient(1100px 520px at 50% -10%, #33405c 0%, #232a3d 55%, #1b2133 100%)}
body.gated #gate{display:block}
.gate-wrap{max-width:920px;margin:0 auto}
.gate-head{text-align:center;color:#fff;margin-bottom:26px}
.gate-head .mark{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:23px;margin:0 auto 13px;border:1px solid rgba(255,255,255,.18)}
.gate-head h1{font-size:25px;font-weight:800;letter-spacing:-.6px}
.gate-head p{font-size:14px;color:#a8b1c6;margin-top:5px}
.gate-card{background:var(--surface);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.32);overflow:hidden}
.gate-sec{padding:20px 24px;border-bottom:1px solid var(--line)}
.gate-sec:last-child{border-bottom:none}
.gate-sec h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.gate-sec h3 .n{width:21px;height:21px;border-radius:6px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.gate-sec .desc{font-size:12.5px;color:var(--ink-3);margin-bottom:13px;padding-inline-start:29px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.person{display:flex;gap:10px;align-items:center;text-align:right;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);transition:border-color .14s,box-shadow .14s,transform .07s;width:100%}
.person:hover{border-color:var(--brand-2);box-shadow:0 3px 14px rgba(47,75,124,.14)}
.person:active{transform:translateY(1px)}
.person .av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.person .t{flex:1;min-width:0}
.person .t .n{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .t .r{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .pc{font-size:11px;font-weight:800;color:var(--ink-3);flex:none}
.person.unassigned .t .n{color:var(--ink-3);font-weight:600;font-style:italic}
.gate-foot{background:var(--surface-2);padding:15px 24px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.gate-note{text-align:center;color:#8b95ac;font-size:12px;margin-top:16px;line-height:1.7}

/* ============ COMPONENTS ============ */
.btn{background:var(--brand);color:#fff;padding:8px 16px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;
  transition:filter .15s,transform .05s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);filter:none;border-color:var(--ink-3)}
.btn.accent{background:var(--accent)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger:hover{background:#f6d9d7;filter:none}
.btn.block{width:100%;justify-content:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card{margin-top:18px}
.card-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card-head .step{width:24px;height:24px;border-radius:7px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}
.card-head p{font-size:12.5px;color:var(--ink-3);width:100%;margin-top:-2px}
.card-head .spacer{flex:1}
.card-body{padding:18px 20px}

.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
.field label,.field .fld-title{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 11px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(74,111,165,.13)}
textarea{resize:vertical;min-height:60px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#aab2c2}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}

.rows{display:flex;flex-direction:column;gap:9px}
.row-item{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;
  display:flex;gap:10px;align-items:flex-start}
.row-item .num{width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);
  color:var(--ink-3);font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:5px}
.row-item .grow{flex:1;min-width:0}
.row-item .del{color:var(--ink-3);font-size:16px;padding:3px 6px;border-radius:6px;flex:none;line-height:1;margin-top:4px}
.row-item .del:hover{background:var(--danger-soft);color:var(--danger)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mini-label{font-size:11px;font-weight:600;color:var(--ink-3);display:block;margin-bottom:3px}
.add-btn{margin-top:10px;width:100%;border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:9px;
  color:var(--brand-2);font-weight:600;font-size:13px;transition:background .15s,border-color .15s}
.add-btn:hover{background:var(--brand-soft);border-color:var(--brand-2)}

.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
.empty h4{font-size:15px;color:var(--ink-2);margin-bottom:4px}
.empty p{font-size:13px;max-width:460px;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.2px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.7px;margin-top:2px;line-height:1.1}
.stat .n{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.brand .v{color:var(--brand)} .stat.accent .v{color:var(--accent)}

.bar{height:7px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;background:var(--brand-2);border-radius:20px;transition:width .35s ease}
.bar > i.ok{background:var(--ok)} .bar > i.warn{background:var(--warn)} .bar > i.low{background:var(--danger)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.grey{background:#eef0f4;color:var(--ink-3)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:700;
  padding:9px 12px;border-bottom:1.5px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}

.role-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.role-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}

.chk-group{margin-bottom:16px}
.chk-group-head{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;font-weight:700;font-size:14px}
.chk-group-head .spacer{flex:1}
.chk-list{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);background:var(--surface);overflow:hidden}
.chk{display:flex;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:flex-start;transition:background .12s}
.chk:last-child{border-bottom:none}
.chk:hover{background:var(--surface-2)}
.chk input[type=checkbox]{width:17px;height:17px;flex:none;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.chk .txt{flex:1;min-width:0}
.chk .txt .t{font-weight:500;line-height:1.45}
.chk .txt .m{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px}
.chk.done .txt .t{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.chk .side{flex:none;display:flex;gap:6px;align-items:center}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input{width:auto;min-width:130px;padding:6px 10px;font-size:13px;background:var(--surface)}
.filters .lbl{font-size:12.5px;color:var(--ink-3);font-weight:600}

.role-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;
  box-shadow:var(--shadow);border-top:3px solid var(--line-strong)}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.role-card h4{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.role-card .owner{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.role-card .mini-stats{display:flex;gap:14px;margin-top:11px;font-size:12px}
.role-card .mini-stats b{display:block;font-size:17px;font-weight:800;letter-spacing:-.4px}
.role-card .go{margin-top:12px;display:flex;gap:6px}
.month-strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:9px}
.month-cell{border-radius:5px;background:var(--line);height:30px;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;color:var(--ink-3)}
.month-cell.has{background:var(--brand-soft);color:var(--brand)}
.month-cell.full{background:var(--ok-soft);color:var(--ok)}

.note{background:var(--brand-soft);border:1px solid #d3e0f0;border-radius:var(--r-sm);padding:11px 14px;
  font-size:13px;color:var(--brand);display:flex;gap:9px;align-items:flex-start;margin-bottom:16px;line-height:1.6}
.note.warn{background:var(--warn-soft);border-color:#f0e2ba;color:#7d5d0f}
.note.ok{background:var(--ok-soft);border-color:#c6e5d7;color:#1f6349}
.note b{font-weight:700}

.steps-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.flow-step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative}
.flow-step .n{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:13px;margin-bottom:9px}
.flow-step h4{font-size:14px;font-weight:700;margin-bottom:4px}
.flow-step p{font-size:12.5px;color:var(--ink-3);line-height:1.6}

dialog{border:none;border-radius:var(--r);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:540px;width:93vw;color:var(--ink)}
dialog::backdrop{background:rgba(20,24,36,.55)}
dialog .card-head{border-radius:var(--r) var(--r) 0 0}
dialog .dlg-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}

.toast{position:fixed;bottom:22px;left:22px;background:#232a3d;color:#fff;padding:11px 18px;border-radius:10px;
  font-size:13.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:999;opacity:0;transform:translateY(12px);
  transition:opacity .22s,transform .22s;pointer-events:none;max-width:420px}
.toast.show{opacity:1;transform:translateY(0)}

.sec-title{font-size:12.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;margin:24px 0 10px}
.sec-title:first-child{margin-top:0}
.code-chip{font-family:'Courier New',monospace;background:var(--surface-2);border:1px solid var(--line-strong);
  border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;letter-spacing:.5px}

@media print{
  .sidebar,.no-print,#gate{display:none !important}
  .app{display:block}
  .main{padding:0}
  .topbar{position:static;border:none;padding:0 0 12px}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  body{background:#fff;font-size:12px}
  .chk-group{break-inside:avoid}
  @page{margin:14mm}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto}
  .grid-3,.grid-4{grid-template-columns:1fr 1fr}
  .content,.topbar{padding-inline:16px}
}
</style>
</head>
<body class="gated">
<a class="skip" href="#main">דילוג לתוכן הראשי</a>

<!-- ================= GATE / כניסה ================= -->
<div id="gate"><div class="gate-wrap" id="gateWrap"></div></div>

<!-- ================= APP ================= -->
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>תוכניות עבודה בית־ספריות</h1>
      <p id="brandSub">שנת הלימודים תשפ״ז</p>
    </div>
    <div class="who" id="whoBox"></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sideFoot"></div>
    <a href="index.html" class="side-back">&#8592; חזרה לאתר</a>
    <input type="file" id="fileInput" accept=".json" hidden>
  </aside>

  <main id="main" class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">דשבורד</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div id="topActions" class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="card-head"><h3 id="dlgTitle">כותרת</h3></div>
  <div class="card-body" id="dlgBody"></div>
  <div class="dlg-foot">
    <button class="btn" id="dlgOk">אישור</button>
    <button class="btn ghost" id="dlgCancel">ביטול</button>
  </div>
</dialog>

<script>
/* ---- נקודת הזרקה לחבילות הפצה. אין לערוך את השורה הבאה ---- */
/*__SEED_START__*//*__SEED_END__*/
const SEEDED = (typeof __SEED__ !== 'undefined') ? __SEED__ : null;

/* מפתח אחסון ייחודי לכל חבילה — כדי ששני קבצים על אותו מחשב לא ידרסו זה את זה */
const KEY = 'work_plans_v2' + (SEEDED ? '::' + SEEDED.id : '');
const OLD_KEYS = ['work_plans_network_v2','work_plans_network_v1'];

const $ = s=>document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('he-IL').format(Math.round(n||0));
const numOf = v => { const m=String(v??'').replace(/[^\d.]/g,''); return m? parseFloat(m)||0 : 0; };
const uid = ()=> Math.random().toString(36).slice(2,10);
const today = ()=> new Date().toLocaleDateString('he-IL');
const initials = n => { const p=String(n||'').trim().split(/\s+/); return p.length>1? p[0][0]+p[1][0] : (p[0]||'?').slice(0,2); };

function emptyPlan(){ return {updated:'', vision:'', goals:[], objectives:[], actions:[], monthly:[]}; }
function newCode(){ return 'BS-' + Math.floor(1000+Math.random()*9000); }

function newSchool(name){
  const s = {id:uid(), code:newCode(), name, selfRegister:true, staff:[], plans:{}};
  ROLES.forEach(r=>{
    const st = {id:r.id, roleId:r.id, roleLabel:'', name:'', email:'', phone:''};
    s.staff.push(st); s.plans[st.id] = emptyPlan();
  });
  return s;
}
function healSchool(s){
  s.id ||= uid(); s.code ||= newCode(); s.plans ||= {};
  if(s.selfRegister===undefined) s.selfRegister = true;
  if(!Array.isArray(s.staff) || !s.staff.length){
    s.staff = ROLES.map(r=>({id:r.id, roleId:r.id, roleLabel:'',
      name:(s.plans[r.id]&&s.plans[r.id].owner)||'', email:'', phone:''}));
  }
  s.staff.forEach(st=>{
    st.id ||= uid(); st.roleId ||= 'other';
    st.roleLabel ??= ''; st.name ??= ''; st.email ??= ''; st.phone ??= '';
    if(!s.plans[st.id]) s.plans[st.id] = emptyPlan();
    const p = s.plans[st.id];
    p.updated ??= ''; p.vision ??= '';
    ['goals','objectives','actions','monthly'].forEach(k=> p[k] = Array.isArray(p[k])? p[k] : []);
    delete p.owner;
  });
  return s;
}
function freshState(){
  const s = newSchool('בית הספר שלי');
  return {v:2, network:{name:'רשת בתי הספר', year:'תשפ״ז', pin:''},
          schools:[s], activeSchool:s.id, activeStaff:'menahelet', view:'dashboard', session:null};
}
function load(){
  /* חבילת הפצה: זריעת הנתונים ההתחלתיים רק אם אין עדיין נתונים מקומיים */
  if(SEEDED){ try{ if(!localStorage.getItem(KEY)) localStorage.setItem(KEY, SEEDED.data); }catch(e){} }
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
  if(!d && !SEEDED){ for(const k of OLD_KEYS){ try{ d = JSON.parse(localStorage.getItem(k)||'null'); }catch(e){} if(d) break; } }
  if(!d || !Array.isArray(d.schools) || !d.schools.length) return freshState();
  d.v = 2;
  d.network ||= {name:'רשת בתי הספר', year:'תשפ״ז', pin:''};
  d.network.name ??= 'רשת בתי הספר'; d.network.year ??= 'תשפ״ז'; d.network.pin ??= '';
  d.schools.forEach(healSchool);
  if(!d.schools.find(s=>s.id===d.activeSchool)) d.activeSchool = d.schools[0].id;
  d.session ??= null; d.view ||= 'dashboard';
  return d;
}
let state = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('⚠ שגיאת שמירה — ייתכן שהאחסון מלא'); } }

function school(){ return state.schools.find(s=>s.id===state.activeSchool) || state.schools[0]; }
function staffList(s){ return (s||school()).staff; }
function staffById(id, s){ return staffList(s).find(x=>x.id===id); }
function activeStaff(){ return staffById(state.activeStaff) || staffList()[0]; }
function plan(staffId){ const s=school(); return s.plans[staffId || state.activeStaff] || s.plans[staffList()[0].id]; }
function roleOf(st){ return ROLE_BY_ID[st?.roleId] || ROLE_OTHER; }
function roleName(st){ return (st?.roleLabel||'').trim() || roleOf(st).name; }
function isPrincipal(){ return !!(state.session && state.session.principal); }
function touch(id){ const p = plan(id); if(p) p.updated = today(); }

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600);
}
/* generic dialog: fields = [{key,label,type,value,placeholder,options}] */
function form(title, fields, onOk, okLabel){
  const d=$('#dlg');
  $('#dlgTitle').textContent = title;
  $('#dlgOk').textContent = okLabel || 'אישור';
  $('#dlgBody').innerHTML = fields.map(f=>`
    <div class="field">
      <label for="dlgf-${esc(f.key)}">${esc(f.label)}</label>
      ${f.type==='select'
        ? `<select id="dlgf-${esc(f.key)}" data-k="${f.key}">${f.options.map(o=>`<option value="${esc(o.v)}" ${o.v===f.value?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`
        : f.type==='checkbox'
        ? `<label style="display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer"><input type="checkbox" id="dlgf-${esc(f.key)}" data-k="${f.key}" ${f.value?'checked':''} style="width:17px;height:17px;accent-color:var(--brand)"> ${esc(f.note||'')}</label>`
        : `<input type="${f.type||'text'}" id="dlgf-${esc(f.key)}" data-k="${f.key}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}">`}
      ${f.hint? `<div style="font-size:11.5px;color:var(--ink-3);margin-top:4px">${esc(f.hint)}</div>`:''}
    </div>`).join('');
  d.showModal();
  const first = $('#dlgBody').querySelector('input,select'); if(first) setTimeout(()=>first.focus(),50);
  const collect = ()=>{ const o={}; $('#dlgBody').querySelectorAll('[data-k]').forEach(el=>{
    o[el.dataset.k] = el.type==='checkbox'? el.checked : el.value.trim(); }); return o; };
  const ok=()=>{ const v=collect(); d.close(); cleanup(); onOk(v); };
  const no=()=>{ d.close(); cleanup(); };
  const key=e=>{ if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){ e.preventDefault(); ok(); } };
  function cleanup(){ $('#dlgOk').removeEventListener('click',ok); $('#dlgCancel').removeEventListener('click',no); $('#dlgBody').removeEventListener('keydown',key); }
  $('#dlgOk').addEventListener('click',ok); $('#dlgCancel').addEventListener('click',no); $('#dlgBody').addEventListener('keydown',key);
}

/* =========================================================
   4. METRICS
   ========================================================= */
function planCompleteness(p, st){
  let score=0;
  if(st && st.name.trim()) score++;
  if(p.vision.trim()) score++;
  if(p.goals.filter(g=>g.text.trim()).length) score++;
  if(p.objectives.filter(o=>o.text.trim()).length) score++;
  if(p.actions.filter(a=>a.text.trim()).length) score++;
  if(p.monthly.filter(m=>m.event.trim()).length) score++;
  return Math.round(score/6*100);
}
function planStats(p, st){
  const items=[...p.actions,...p.monthly];
  const done=items.filter(i=>i.done).length;
  return {
    goals:p.goals.length, objectives:p.objectives.length, actions:p.actions.length, monthly:p.monthly.length,
    total:items.length, done, pct: items.length? Math.round(done/items.length*100):0,
    budget: p.monthly.reduce((a,m)=>a+numOf(m.cost),0),
    monthsUsed: new Set(p.monthly.map(m=>m.month).filter(Boolean)).size,
    completeness: planCompleteness(p, st)
  };
}
function schoolStats(s){
  const t={total:0,done:0,budget:0,plansFilled:0,goals:0,objectives:0,activities:0,completeness:0};
  const list = staffList(s);
  list.forEach(st=>{
    const ps = planStats(s.plans[st.id], st);
    t.total+=ps.total; t.done+=ps.done; t.budget+=ps.budget;
    t.goals+=ps.goals; t.objectives+=ps.objectives; t.activities+=ps.monthly;
    t.completeness+=ps.completeness;
    if(ps.completeness>=50) t.plansFilled++;
  });
  t.staffCount = list.length;
  t.assigned = list.filter(x=>x.name.trim()).length;
  t.completeness = list.length? Math.round(t.completeness/list.length):0;
  t.pct = t.total? Math.round(t.done/t.total*100):0;
  return t;
}
const barClass = p => p>=80?'ok' : p>=45?'' : p>=20?'warn' : 'low';

function principalStaffId(){
  const s = school();
  return (s.staff.find(x=>x.roleId==='menahelet') || s.staff[0]).id;
}
function selfRegisterFlow(){
  const s = school();
  form('רישום עצמי', [
    {key:'name', label:'שם מלא', placeholder:'השם שלך'},
    {key:'role', label:'התפקיד שלי', type:'select', value:'other',
      options:[...ROLES.map(r=>({v:r.id,t:r.name})), {v:'other',t:'תפקיד אחר (יש למלא בשדה הבא)'}]},
    {key:'label', label:'שם התפקיד (אם בחרת ״תפקיד אחר״)', placeholder:'למשל: רכז ביטחון'},
    {key:'email', label:'דוא״ל (לא חובה)', type:'email'}
  ], v=>{
    if(!v.name) return toast('צריך למלא שם');
    const st = {id:uid(), roleId:v.role, roleLabel:v.role==='other'? (v.label||'תפקיד נוסף') : '',
                name:v.name, email:v.email||'', phone:''};
    s.staff.push(st); s.plans[st.id] = emptyPlan();
    save(); enterAs(st.id,false); toast(`נרשמת: ${v.name}`);
  }, 'רישום וכניסה');
}
function enterAs(staffId, principal){
  state.session = {schoolId: state.activeSchool, staffId, principal:!!principal};
  state.activeStaff = staffId;
  state.view = principal? 'dashboard' : 'form:'+staffId;
  save(); document.body.classList.remove('gated'); render();
  const st = staffById(staffId);
  toast(principal? 'כניסה כמנהל.ת — יש לך גישה לכל התחומים' : `שלום ${st.name||''}`);
}
function logout(){ state.session=null; save(); renderGate(); }
window.logout = logout;

  $('#nav').querySelectorAll('button').forEach(b=> b.onclick = ()=> go(b.dataset.view));

  $('#sideFoot').innerHTML = isPrincipal()
    ? `<button onclick="exportBackup()">⤓ גיבוי מלא (JSON)</button>
       <button onclick="document.getElementById('fileInput').click()">⤒ ייבוא / איסוף קבצים</button>
       <button onclick="exportCsv()">⤓ ייצוא לאקסל (CSV)</button>`
    : `<button onclick="exportMyPlan()">⤓ שליחת התוכנית שלי</button>`;
}
function go(view){
  state.view = view;
  if(view.startsWith('form:')) state.activeStaff = view.slice(5);
  save(); render();
}
window.go = go;

function render(){
  if(!state.session){ renderGate(); return; }
  if(!staffById(state.session.staffId)) { state.session=null; return renderGate(); }
  document.body.classList.remove('gated');
  const v = state.view || 'dashboard';
  const guarded = ['network','master','staff','distribute','settings'];
  if(!isPrincipal()){
    if(guarded.includes(v)) state.view = 'dashboard';
    /* בעל תפקיד רגיל רואה רק את התוכנית שלו */
    if(v.startsWith('form:') && v.slice(5)!==state.session.staffId){
      state.activeStaff = state.session.staffId;
      state.view = 'form:'+state.session.staffId;
    }
    if(state.view==='mychecklist') state.activeStaff = state.session.staffId;
  }
  renderShell();
  const vv = state.view;
  if(vv.startsWith('form:')) return viewForm();
  ({dashboard:viewDashboard, calendar:viewCalendar, network:viewNetwork, mychecklist:viewMyChecklist,
    master:viewMaster, staff:viewStaff, distribute:viewDistribute, settings:viewSettings}[vv] || viewDashboard)();
}
function setHead(title, sub, actions){

function checklistFor(staffId, s){
  s = s||school();
  const p = s.plans[staffId]; if(!p) return [];
  const out=[];
  p.actions.forEach(a=>{ if(a.text.trim()) out.push({id:a.id,sec:'actions',staffId,kind:'פעולה',
    text:a.text, month:a.when||'', done:!!a.done, meta:[]}); });
  p.monthly.forEach(m=>{ if(m.event.trim()||m.needs.trim()) out.push({id:m.id,sec:'monthly',staffId,kind:'פעילות',
    text:m.event||'(פעילות ללא שם)', month:m.month||'', done:!!m.done,
    meta:[m.participants&&`👥 ${m.participants}`, m.cost&&`₪ ${m.cost}`,
          m.needs&&`📦 ${m.needs}`, m.partners&&`🤝 ${m.partners}`].filter(Boolean)}); });
  return out;
}
function toggleItem(staffId, sec, id, val){
  const p = school().plans[staffId]; if(!p) return;
  const it = p[sec].find(x=>x.id===id); if(!it) return;
  it.done = val; p.updated = today(); save();
}
window.toggleItem = toggleItem;
function chkHTML(items, showWho){
  return items.map(i=>{
    const st = staffById(i.staffId), r = roleOf(st);
    return `<label class="chk ${i.done?'done':''}">
      <input type="checkbox" ${i.done?'checked':''}
        onchange="toggleItem('${i.staffId}','${i.sec}','${i.id}',this.checked);this.closest('.chk').classList.toggle('done',this.checked);">
      <div class="txt"><div class="t">${esc(i.text)}</div>
        ${(i.meta.length||showWho)? `<div class="m">
          ${showWho? `<span class="role-chip"><span class="role-dot" style="background:${r.color}"></span>${esc(st.name.trim()||roleName(st))}</span>`:''}
          ${i.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div>`:''}
      </div>
      <div class="side"><span class="pill ${i.kind==='פעולה'?'brand':'grey'}">${esc(i.kind)}</span>
        ${i.month? `<span class="pill grey">${esc(i.month)}</span>`:''}</div>
    </label>`;
  }).join('');
}

        <p>הוא נבנה לבד ממה שממלאים בתוכנית — כל פעולה בסעיף 4 וכל פעילות חודשית בסעיף 5 מופיעה כאן כשורה לסימון.</p>
        <button class="btn" style="margin-top:14px" onclick="go('form:${st.id}')">מעבר למילוי התוכנית</button>
      </div></div></div>`}`;

  const sw=$('#staffSwitch');
  if(sw) sw.onchange=()=>{ state.activeStaff=sw.value; save(); render(); };
}

let masterFilter={who:'',month:'',status:'',q:''};
function viewMaster(){
  const s = school();
  setHead('צ׳ק־ליסט מנהלת', `${s.name} · כל התחומים במקום אחד — נבנה ממה שכל בעל תפקיד מילא`,
    `<button class="btn ghost sm" onclick="go('dashboard')">▤ דשבורד</button>
     <button class="btn sm" onclick="window.print()">⎙ הדפסה</button>`);

  const list = staffList(s);
  const all = list.flatMap(st=>checklistFor(st.id));
  const doneAll = all.filter(i=>i.done).length;
  const pctAll = all.length? Math.round(doneAll/all.length*100):0;
  const f = masterFilter;
  const items = all.filter(i=>
    (!f.who||i.staffId===f.who) && (!f.month||i.month===f.month) &&
    (!f.status|| (f.status==='done'? i.done : !i.done)) &&
    (!f.q || (i.text+' '+i.meta.join(' ')).toLowerCase().includes(f.q.toLowerCase())));

  const groupByWho = !!f.month;
  const groups={}; items.forEach(i=>{ const k=groupByWho? i.staffId : (i.month||'ללא חודש / לאורך השנה');
    (groups[k]=groups[k]||[]).push(i); });
  const order = groupByWho ? list.map(x=>x.id).filter(k=>groups[k])
                           : [...MONTHS,'ללא חודש / לאורך השנה'].filter(k=>groups[k]);

  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat ok"><div class="k">ביצוע בית ספרי כולל</div><div class="v">${pctAll}%</div>
        <div class="bar"><i class="ok" style="width:${pctAll}%"></i></div>
        <div class="n">${doneAll} מתוך ${all.length} משימות</div></div>
      ${list.slice(0,4).map(st=>{
        const r=roleOf(st), it=checklistFor(st.id), d=it.filter(x=>x.done).length;
        const p=it.length? Math.round(d/it.length*100):0;
        return `<div class="stat"><div class="k" style="display:flex;align-items:center;gap:5px">
          <span class="role-dot" style="background:${r.color}"></span>${esc(st.name.trim()||roleOf(st).short)}</div>
          <div class="v" style="color:${r.color}">${p}%</div>
          <div class="bar"><i style="width:${p}%;background:${r.color}"></i></div>
          <div class="n">${d}/${it.length} משימות</div></div>`;
      }).join('')}
    </div>

    <div class="filters no-print">
      <span class="lbl">סינון:</span>
      <select id="fWho" aria-label="סינון לפי בעל.ת תפקיד"><option value="">כל בעלי התפקידים</option>
        ${list.map(st=>`<option value="${st.id}" ${f.who===st.id?'selected':''}>${esc(st.name.trim()||roleName(st))}</option>`).join('')}</select>
      <select id="fMonth" aria-label="סינון לפי חודש"><option value="">כל החודשים</option>${MONTHS.map(m=>`<option ${f.month===m?'selected':''}>${m}</option>`).join('')}</select>
      <select id="fStatus" aria-label="סינון לפי סטטוס"><option value="">הכול</option>
        <option value="open" ${f.status==='open'?'selected':''}>פתוח בלבד</option>
        <option value="done" ${f.status==='done'?'selected':''}>הושלם בלבד</option></select>
      <input type="text" id="fQ" aria-label="חיפוש חופשי בצ׳ק־ליסט" placeholder="חיפוש חופשי…" value="${esc(f.q)}">
      <button class="btn ghost sm" id="fClear">ניקוי</button>
      <span style="margin-inline-start:auto;font-size:12.5px;color:var(--ink-3)">מוצגות ${items.length} מתוך ${all.length}</span>
    </div>

    ${items.length? order.map(k=>{
      const g=groups[k], d=g.filter(i=>i.done).length;
      const st = groupByWho? staffById(k) : null;
      return `<div class="chk-group"><div class="chk-group-head">
        ${st? `<span class="role-dot" style="background:${roleOf(st).color}"></span><span>${esc(st.name.trim()||roleName(st))} · ${esc(roleName(st))}</span>`
            : `<span style="color:var(--brand)">▦</span><span>${esc(k)}</span>`}
        <div class="spacer"></div><span class="pill ${d===g.length?'ok':d?'warn':'grey'}">${d}/${g.length}</span></div>
        <div class="chk-list">${chkHTML(g, !groupByWho)}</div></div>`;
    }).join('')
    : `<div class="card"><div class="card-body"><div class="empty"><div class="big">✦</div><h4>אין משימות להצגה</h4>
        <p>${all.length? 'נסו לשנות את הסינון.' : 'הצ׳ק־ליסט המרכז מתמלא לבד ככל שבעלי התפקידים ממלאים את תוכניות העבודה. ראו מסך ״הפצה ואיסוף״.'}</p>
      </div></div></div>`}

    <div class="card" style="margin-top:20px">
      <div class="card-head"><h3>מעקב מילוי — מה עוד חסר</h3><p>למי לשלוח תזכורת</p></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>תפקיד</th><th>שם</th><th>אמירה</th><th>מטרות</th><th>יעדים</th><th>פעולות</th><th>חודשי</th><th>שלמות</th><th>עודכן</th></tr></thead>
        <tbody>${list.map(st=>{
          const p=s.plans[st.id], c=planCompleteness(p,st);
          const miss='<span class="pill danger">חסר</span>';
          return `<tr>
            <td><span class="role-chip"><span class="role-dot" style="background:${roleOf(st).color}"></span>${esc(roleName(st))}</span></td>
            <td>${st.name.trim()? esc(st.name):'<span class="pill danger">לא שויך</span>'}</td>
            <td>${p.vision.trim()? '<span class="pill ok">✓</span>':miss}</td>
            <td>${p.goals.filter(g=>g.text.trim()).length||miss}</td>
            <td>${p.objectives.filter(o=>o.text.trim()).length||miss}</td>
            <td>${p.actions.filter(a=>a.text.trim()).length||miss}</td>
            <td>${p.monthly.filter(m=>m.event.trim()).length||miss}</td>
            <td style="min-width:105px"><b>${c}%</b><div class="bar"><i class="${barClass(c)}" style="width:${c}%"></i></div></td>
            <td style="font-size:12px;color:var(--ink-3)">${esc(p.updated||'—')}</td>
          </tr>`;}).join('')}</tbody></table></div>
    </div>`;

  $('#fWho').onchange   = e=>{ masterFilter.who=e.target.value; viewMaster(); };
  $('#fMonth').onchange = e=>{ masterFilter.month=e.target.value; viewMaster(); };
  $('#fStatus').onchange= e=>{ masterFilter.status=e.target.value; viewMaster(); };
  let qt; $('#fQ').oninput = e=>{ clearTimeout(qt); const v=e.target.value;
    qt=setTimeout(()=>{ masterFilter.q=v; viewMaster(); const i=$('#fQ'); i.focus(); i.setSelectionRange(v.length,v.length); },350); };
  $('#fClear').onclick  = ()=>{ masterFilter={who:'',month:'',status:'',q:''}; viewMaster(); };
}

/* =========================================================
   9. DASHBOARD / CALENDAR / NETWORK
   ========================================================= */
function viewDashboard(){
  const s=school(), t=schoolStats(s), list=staffList(s);
  setHead(`דשבורד — ${s.name}`, `תמונת מצב של כל תוכניות העבודה · ${state.network.year}`,
    `${isPrincipal()? `<button class="btn ghost sm" onclick="go('master')">✦ צ׳ק־ליסט מנהלת</button>`:''}
     <button class="btn sm" onclick="window.print()">⎙ הדפסה</button>`);

  const cards = list.map(st=>{
    const r=roleOf(st), p=s.plans[st.id], ps=planStats(p,st);
    const months = MONTHS.map(m=>{
      const it=p.monthly.filter(x=>x.month===m);
      const cls= it.length? (it.every(x=>x.done)?'full':'has') : '';
      return `<div class="month-cell ${cls}" title="${esc(m)}: ${it.length} פעילויות">${m.slice(0,3)}</div>`;
    }).join('');
    return `<div class="role-card" style="border-top-color:${r.color}">
      <h4><span class="role-dot" style="background:${r.color}"></span>${esc(roleName(st))}</h4>
      <div class="owner">${st.name.trim()? esc(st.name):'<i>טרם שויך בעל תפקיד</i>'}${p.updated? ' · '+esc(p.updated):''}</div>
      <div class="bar" style="margin-top:10px"><i class="${barClass(ps.completeness)}" style="width:${ps.completeness}%"></i></div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:4px">שלמות ${ps.completeness}% · ביצוע ${ps.pct}%</div>
      <div class="mini-stats">
        <div><b>${ps.goals}</b>מטרות</div><div><b>${ps.objectives}</b>יעדים</div>
        <div><b>${ps.actions}</b>פעולות</div><div><b>${ps.monthly}</b>פעילויות</div>
        <div><b style="font-size:14px">₪${money(ps.budget)}</b>תקציב</div></div>
      <div class="month-strip">${months}</div>
      <div class="go">
        <button class="btn sm" onclick="go('form:${st.id}')">פתיחת התוכנית</button>
        <button class="btn ghost sm" onclick="state.activeStaff='${st.id}';go('mychecklist')">צ׳ק־ליסט</button></div>
    </div>`;
  }).join('');

  const budgets = list.map(st=>({st, b:planStats(s.plans[st.id],st).budget})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  const maxB = Math.max(1,...budgets.map(x=>x.b));
  const objs = list.flatMap(st=> s.plans[st.id].objectives.filter(o=>o.text.trim()).map(o=>({st,o})));

  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat brand"><div class="k">שלמות תוכניות העבודה</div><div class="v">${t.completeness}%</div>
        <div class="bar"><i class="${barClass(t.completeness)}" style="width:${t.completeness}%"></i></div>
        <div class="n">${t.plansFilled} מתוך ${t.staffCount} תוכניות מלאות ברובן</div></div>
      <div class="stat ok"><div class="k">ביצוע בפועל</div><div class="v">${t.pct}%</div>
        <div class="bar"><i class="ok" style="width:${t.pct}%"></i></div>
        <div class="n">${t.done} מתוך ${t.total} משימות</div></div>
      <div class="stat"><div class="k">מטרות / יעדים</div><div class="v">${t.goals} / ${t.objectives}</div>
        <div class="n">מטרות / יעדים מדידים</div></div>
      <div class="stat"><div class="k">פעילויות מתוכננות</div><div class="v">${t.activities}</div><div class="n">לאורך השנה</div></div>
      <div class="stat accent"><div class="k">תקציב בית ספרי</div><div class="v">₪${money(t.budget)}</div><div class="n">סיכום כל התחומים</div></div>
    </div>

    <div class="sec-title">תוכניות העבודה לפי בעלי תפקידים</div>
    <div class="role-grid">${cards}</div>

    <div class="card" style="margin-top:24px">
      <div class="card-head"><h3>חלוקת התקציב בין התחומים</h3></div>
      <div class="card-body">${budgets.length? budgets.map(x=>`
        <div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px">
            <span class="role-chip"><span class="role-dot" style="background:${roleOf(x.st).color}"></span>${esc(x.st.name.trim()||roleName(x.st))}</span>
            <span>₪${money(x.b)} <span style="color:var(--ink-3);font-weight:500">(${Math.round(x.b/t.budget*100)}%)</span></span></div>
          <div class="bar"><i style="width:${x.b/maxB*100}%;background:${roleOf(x.st).color}"></i></div>
        </div>`).join('')
        : `<div class="empty"><div class="big">₪</div><h4>עדיין לא הוזנו עלויות</h4>
           <p>ברגע שבעלי התפקידים ימלאו עלויות בתוכנית החודשית, תופיע כאן חלוקת התקציב.</p></div>`}</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>כל היעדים המדידים בבית הספר</h3><p>התמונה שאפשר להציג לפיקוח או לוועד המנהל</p></div>
      ${objs.length? `<div class="tbl-wrap"><table>
        <thead><tr><th>תחום</th><th>יעד</th><th>מדד</th><th>מ־</th><th>ל־</th><th>בדיקה</th></tr></thead>
        <tbody>${objs.map(({st,o})=>`<tr>
          <td><span class="role-chip"><span class="role-dot" style="background:${roleOf(st).color}"></span>${esc(roleOf(st).short)}</span></td>
          <td style="min-width:280px">${esc(o.text)}</td><td>${esc(o.indicator)||'—'}</td>
          <td>${esc(o.baseline)||'—'}</td><td><b>${esc(o.target)||'—'}</b></td>
          <td>${o.dueMonth? `<span class="pill grey">${esc(o.dueMonth)}</span>`:'—'}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="card-body"><div class="empty"><div class="big">◎</div><h4>אין עדיין יעדים מדידים</h4>
           <p>יעד מדיד הוא מה שהופך תוכנית עבודה למשהו שאפשר לבדוק בסוף השנה. עודדו כל בעל תפקיד להגדיר לפחות שניים.</p></div></div>`}
    </div>`;
}

function viewCalendar(){
  const s=school(), list=staffList(s);
  setHead('לוח שנה מרוכז', `${s.name} · כל הפעילויות של כל התחומים לפי חודשים`,
    `<button class="btn sm" onclick="window.print()">⎙ הדפסה</button>`);

  let busiest='—', bn=0; MONTHS.forEach(m=>{ const c=all.filter(x=>x.month===m).length; if(c>bn){bn=c;busiest=m;} });
  const noMonth = all.filter(x=>!x.month);

  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat brand"><div class="k">סך פעילויות בשנה</div><div class="v">${all.length}</div></div>
      <div class="stat"><div class="k">החודש העמוס ביותר</div><div class="v" style="font-size:20px">${esc(busiest)}</div>
        <div class="n">${bn? bn+' פעילויות':''}</div></div>
      <div class="stat accent"><div class="k">סך עלויות</div><div class="v">₪${money(all.reduce((a,x)=>a+numOf(x.cost),0))}</div></div>
      <div class="stat ok"><div class="k">בוצעו</div><div class="v">${all.filter(x=>x.done).length}</div><div class="n">מתוך ${all.length}</div></div>
    </div>
    ${noMonth.length? `<div class="note warn"><span>⚠</span><div><b>${noMonth.length} פעילויות ללא חודש משויך</b> — הן לא יופיעו בלוח עד שייבחר להן חודש בטופס.</div></div>`:''}
    ${MONTHS.map(mo=>{
      const it=all.filter(x=>x.month===mo), b=it.reduce((a,x)=>a+numOf(x.cost),0);
      return `<div class="card"><div class="card-head"><h3>${esc(mo)}</h3><div class="spacer"></div>

        ${it.length? `<div class="tbl-wrap"><table>
          <thead><tr><th>תחום</th><th>האירוע</th><th>משתתפים</th><th>עלות</th><th>מה צריך</th><th>שותפים</th><th>סטטוס</th></tr></thead>
          <tbody>${it.map(x=>`<tr>
            <td><span class="role-chip"><span class="role-dot" style="background:${roleOf(x.st).color}"></span>${esc(roleOf(x.st).short)}</span></td>
            <td><b>${esc(x.event)}</b></td><td>${esc(x.participants)||'—'}</td>
            <td>${x.cost? '₪'+esc(x.cost):'—'}</td><td>${esc(x.needs)||'—'}</td><td>${esc(x.partners)||'—'}</td>
            <td>${x.done? '<span class="pill ok">בוצע</span>':'<span class="pill warn">מתוכנן</span>'}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="card-body" style="padding:14px 20px;color:var(--ink-3);font-size:13px">אין פעילויות מתוכננות בחודש זה.</div>`}
      </div>`;}).join('')}`;
}

function download(name, content, type){
  const blob = new Blob([type==='text/csv'? '﻿'+content : content], {type:type+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const stamp = ()=> new Date().toISOString().slice(0,10);

function exportBackup(){
  download(`גיבוי-תוכניות-עבודה-${stamp()}.json`, JSON.stringify({kind:'backup', ...state, session:null}, null, 2), 'application/json');
  toast('קובץ הגיבוי ירד');
}
window.exportBackup = exportBackup;

function exportMyPlan(staffId){
  const s=school(), id = staffId || state.session.staffId, st=staffById(id);
  if(!st) return;
  const pkg = {kind:'plan', exportedAt:today(), schoolCode:s.code, schoolName:s.name,
    staffId:st.id, roleId:st.roleId, roleLabel:st.roleLabel, name:st.name, email:st.email, phone:st.phone,
    plan: s.plans[st.id]};
  const who = (st.name.trim()||roleName(st)).replace(/[\\/:*?"<>|]/g,'-');
  download(`תוכנית-${who}-${s.name}-${stamp()}.json`, JSON.stringify(pkg,null,2), 'application/json');
  toast('הקובץ ירד — שלחו אותו במייל למנהלת');
}

/* בניית קובץ HTML עצמאי שמכיל בית ספר אחד בלבד, עם המרשם שלו כבר בפנים */
const SEED_RE = /\/\*__SEED_START__\*\/[\s\S]*?\/\*__SEED_END__\*\//;
function exportSchoolPackage(schoolId, blank){
  const src = state.schools.find(x=>x.id===schoolId); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  if(blank) copy.staff.forEach(st=> copy.plans[st.id] = emptyPlan());
  const seed = {v:2, network:{...state.network}, schools:[copy], activeSchool:copy.id,
                activeStaff:copy.staff[0].id, view:'dashboard', session:null};
  const payload = {id: String(copy.code||copy.id).replace(/[^A-Za-z0-9_-]/g,''), data: JSON.stringify(seed)};
  const block = '/*__SEED_START__*/var __SEED__=' +
    JSON.stringify(payload).replace(/</g,'\\u003c').replace(/>/g,'\\u003e') +
    ';/*__SEED_END__*/';

  if(!SEED_RE.test(PRISTINE_HTML)){
    toast('⚠ נקודת ההזרקה לא נמצאה — יורד קובץ JSON במקום');
    download(`חבילה-${copy.name}-${stamp()}.json`, JSON.stringify(seed,null,2), 'application/json');
    return;
  }
  const out = '<!DOCTYPE html>\n' + PRISTINE_HTML.replace(SEED_RE, block);
  const safe = copy.name.replace(/[\\/:*?"<>|]/g,'-');
  download(`תוכניות-עבודה-${safe}${blank?'':'-עם-נתונים'}.html`, out, 'text/html');
  toast(`החבילה של ${copy.name} ירדה — אפשר לשלוח במייל`);
}
window.exportSchoolPackage = exportSchoolPackage;

function exportCsv(){
  const q = v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['בית ספר','קוד','תפקיד','שם','סוג רשומה','חודש','תוכן','מדד','מ־','ל־','משתתפים','עלות','מה צריך','שותפים','בוצע'];
  const lines=[head.map(q).join(',')];
  state.schools.forEach(s=> s.staff.forEach(st=>{
    const p=s.plans[st.id], base=[s.name,s.code,roleName(st),st.name];
    if(p.vision.trim()) lines.push([...base,'אמירה מרכזית','',p.vision,'','','','','','','',''].map(q).join(','));
    p.goals.forEach(g=> g.text.trim() && lines.push([...base,'מטרה','',g.text,'','','','','','','',''].map(q).join(',')));
    p.objectives.forEach(o=> o.text.trim() && lines.push([...base,'יעד מדיד',o.dueMonth,o.text,o.indicator,o.baseline,o.target,'','','','',''].map(q).join(',')));
    p.actions.forEach(a=> a.text.trim() && lines.push([...base,'פעולה',a.when,a.text,'','','','','','','',a.done?'כן':'לא'].map(q).join(',')));
    p.monthly.forEach(m=> m.event.trim() && lines.push([...base,'פעילות חודשית',m.month,m.event,'','','',m.participants,m.cost,m.needs,m.partners,m.done?'כן':'לא'].map(q).join(',')));
  }));
  download(`תוכניות-עבודה-${stamp()}.csv`, lines.join('\r\n'), 'text/csv');
  toast('קובץ CSV ירד — נפתח באקסל');
}
window.exportCsv = exportCsv;

$('#fileInput').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ handleImport(JSON.parse(rd.result)); }
                  catch(err){ console.warn(err); toast('⚠ הקובץ אינו תקין'); }
                  e.target.value=''; };
  rd.readAsText(f,'utf-8');
};
function handleImport(d){
  if(d && d.kind==='plan') return importPlan(d);
  if(d && Array.isArray(d.schools)) return importBackup(d);
  toast('⚠ לא זוהה סוג הקובץ');
}
function importPlan(d){
  let s = state.schools.find(x=>x.code===d.schoolCode) || state.schools.find(x=>x.name===d.schoolName);
  if(!s){
    if(!confirm(`הקובץ שייך לבית ספר "${d.schoolName}" שאינו קיים כאן. להוסיף אותו?`)) return;
    s = newSchool(d.schoolName || 'בית ספר חדש'); s.code = d.schoolCode || s.code; state.schools.push(s);
  }
  let st = s.staff.find(x=>x.id===d.staffId)
        || s.staff.find(x=>x.name.trim() && x.name.trim()===String(d.name||'').trim())
        || s.staff.find(x=>x.roleId===d.roleId && !x.name.trim());
  if(!st){ st={id:d.staffId||uid(), roleId:d.roleId||'other', roleLabel:d.roleLabel||'', name:d.name||'', email:d.email||'', phone:d.phone||''};
           s.staff.push(st); }
  else { if(d.name) st.name=d.name; if(d.email) st.email=d.email; if(d.phone) st.phone=d.phone;
         if(d.roleLabel) st.roleLabel=d.roleLabel; }
  s.plans[st.id] = d.plan; healSchool(s);
  state.activeSchool = s.id; save(); render();
  toast(`התקבלה תוכנית: ${d.name||roleName(st)} · ${s.name}`);
}
function importBackup(d){
  let added=0, merged=0;
  d.schools.forEach(inc=>{
    healSchool(inc);
    const ex = state.schools.find(x=>x.code===inc.code) || state.schools.find(x=>x.name===inc.name);
    if(!ex){ inc.id = inc.id||uid(); state.schools.push(inc); added++; return; }
    inc.staff.forEach(ist=>{
      const ip = inc.plans[ist.id];
      let est = ex.staff.find(x=>x.id===ist.id)
             || ex.staff.find(x=>x.name.trim() && x.name.trim()===ist.name.trim())
             || ex.staff.find(x=>x.roleId===ist.roleId && !x.name.trim());
      if(!est){ ex.staff.push(ist); ex.plans[ist.id]=ip; return; }
      if(ist.name && !est.name) est.name=ist.name;
      if(ist.email && !est.email) est.email=ist.email;
      if(planCompleteness(ip,ist) > planCompleteness(ex.plans[est.id],est)) ex.plans[est.id]=ip;
    });
    healSchool(ex); merged++;
  });
  save(); render();
  toast(`יובאו: ${added} בתי ספר חדשים · ${merged} אוחדו`);
}

/* =========================================================
   14. BOOT
   ========================================================= */
(function boot(){
  const s = state.session;
  const sc = s && state.schools.find(x=>x.id===s.schoolId);
  if(sc && sc.staff.some(x=>x.id===s.staffId)){
    state.activeSchool = sc.id;
    if(!sc.staff.some(x=>x.id===state.activeStaff)) state.activeStaff = s.staffId;
    render();
  } else {
    state.session = null;
    renderGate();
  }
})();
