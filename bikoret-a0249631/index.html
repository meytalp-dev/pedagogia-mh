<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מעקב המלצות הביקורת</title>
<script src="/api-route.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#13202E; --muted:#5B6B7C; --line:#E2E7EE;
  --navy:#1F4E79; --navy-2:#2B6CB0; --soft:#EAF1F8;
  --red:#B42318; --red-bg:#FDECEA; --amber:#9A6700; --amber-bg:#FFF4D6; --green:#2E7D32; --green-bg:#E7F4E8;
  --violet:#5B3FA8; --violet-bg:#EFEAFB; --gray-bg:#EEF1F5;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
header.top img{height:46px;width:auto;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
button:hover{border-color:var(--navy-2)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{background:#173d60}
button svg{width:18px;height:18px;flex:none}
h1{font-size:26px;line-height:1.3;margin:26px 0 4px;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.tabs{display:flex;gap:4px;background:#E6EBF2;padding:4px;border-radius:12px;width:max-content;max-width:100%;margin-bottom:18px}
.tabs button{border:0;background:transparent;min-height:38px;padding:6px 16px;border-radius:9px;color:var(--muted)}
.tabs button[aria-selected=true]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,32,48,.12)}
.panel[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:30px;line-height:1.1;font-weight:800}
.kpi span{color:var(--muted);font-size:13px}
.kpi.red b{color:var(--red)} .kpi.green b{color:var(--green)} .kpi.navy b{color:var(--navy)} .kpi.violet b{color:var(--violet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 8px;color:var(--navy);font-weight:700}
.bottom{background:var(--soft);border-color:#CFE0F1}
.bottom p{font-weight:600;margin:0;font-size:16px}
[contenteditable=true]{outline:none;border-radius:8px;transition:background .15s}
[contenteditable=true]:hover{background:#F7FAFD}
[contenteditable=true]:focus{background:#FFFBEA;box-shadow:0 0 0 2px #F2D27A}
ul.items{margin:0;padding:0 20px 0 0}
ul.items li{margin:6px 0}
table.matrix{width:100%;border-collapse:collapse;font-size:14px}
table.matrix th,table.matrix td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
table.matrix th:first-child,table.matrix td:first-child{text-align:right}
table.matrix thead th{color:var(--muted);font-weight:600;font-size:13px}
table.matrix tfoot td{font-weight:700}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.edit-note{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.edit-note svg{width:16px;height:16px}
/* filters */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.filters input,.filters select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px;width:100%;color:var(--ink)}
.count{color:var(--muted);font-size:13px;margin:0 0 10px}
/* rows */
.rec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.rec>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px 1fr 170px 150px;gap:12px;align-items:center;padding:12px 14px}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary .pills{display:contents}
.rec[open]>summary{border-bottom:1px solid var(--line);background:#FAFBFD}
.ch{font-weight:700;color:var(--navy);font-size:14px;direction:ltr;text-align:right}
.rtext{font-size:14.5px}
.rtopic{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sev-1{background:var(--red-bg);color:var(--red)} .sev-2{background:var(--amber-bg);color:var(--amber)} .sev-3{background:var(--green-bg);color:var(--green)}
.st{background:var(--gray-bg);color:#344457}
.st.done{background:var(--green-bg);color:var(--green)} .st.prog{background:#E3EEFA;color:var(--navy)} .st.disc{background:var(--violet-bg);color:var(--violet)}
.body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field .box{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;white-space:pre-wrap;font-size:14.5px;background:#fff}
.field select,.field input{font-family:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:42px;background:#fff;color:var(--ink)}
.field.wide{grid-column:1/-1}
.meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;grid-column:1/-1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#13202E;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
.banner{background:#FFF4D6;border:1px solid #F2D27A;border-radius:12px;padding:10px 14px;margin:14px 0 0;font-size:14px;display:none}
.banner.show{display:block}
/* תקציר — נקודות קצרות ולחיצות */
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sumbar .edit-note{margin:0}
#editToggle[aria-pressed=true]{background:#FFF4D6;border-color:#F2D27A}
button.kpi{display:block;text-align:right;width:100%;cursor:pointer;font-weight:400;min-height:auto}
button.kpi:hover{border-color:var(--navy-2);box-shadow:0 2px 8px rgba(31,78,121,.08)}
ul.dots{margin:0;padding:0 20px 0 0}
ul.dots li{margin:4px 0;font-size:16px;font-weight:600}
.chgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#FAFBFD;cursor:pointer;text-align:right}
.chcard:hover{border-color:var(--navy-2)}
.chcard .n{font-size:28px;font-weight:800;color:var(--navy);line-height:1.1}
.chcard .nm{font-weight:700;font-size:15px;margin-top:2px}
.chcard .lb{color:var(--muted);font-size:12.5px}
.chcard .mat{display:inline-block;margin:6px 0 4px;font-size:12.5px;font-weight:600;color:var(--red);background:var(--red-bg);border-radius:999px;padding:1px 9px}
.chcard .tx{font-size:13.5px;color:#344457;line-height:1.45}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.row:first-child{border-top:0}
.row:hover{background:#F7FAFD}
.row .num{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--navy);font-weight:700;font-size:13px;display:grid;place-items:center}
.row .t{font-weight:700;font-size:15.5px;display:block}
.row .s{color:var(--muted);font-size:14px;display:block}
.row .go{display:flex;align-items:center;gap:4px;color:var(--navy-2);font-size:13px;font-weight:600;white-space:nowrap}
.row .go svg{width:16px;height:16px}
td.cl{cursor:pointer;color:var(--navy-2);font-weight:600}
td.cl:hover{background:#F0F5FB}
td.zero{color:#B6C0CC}
body.editing [data-path]{outline:1px dashed #E0B94A;outline-offset:2px;border-radius:6px;cursor:text;background:#FFFDF3}
/* חלון פירוט */
.drawer{position:fixed;inset:0;z-index:20}
.drawer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(15,25,40,.45)}
.sheet{position:absolute;top:0;bottom:0;left:0;width:min(620px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.2)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;background:#fff;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:19px;color:var(--navy)}
.sheet-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.x{min-height:40px;width:40px;padding:0;justify-content:center;flex:none}
.sheet-body{overflow:auto;padding:14px 16px 30px}
.dhint{color:var(--muted);font-size:13px;margin:0 2px 10px}
.item{background:#fff;border:1px solid var(--line);border-right:4px solid var(--line);border-radius:12px;margin-bottom:10px}
.item.sev-1{border-right-color:#E5484D;background:#fff;color:inherit}
.item.sev-2{border-right-color:#F0B429;background:#fff;color:inherit}
.item.sev-3{border-right-color:#46A758;background:#fff;color:inherit}
.item>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.item>summary::-webkit-details-marker{display:none}
.item>summary:hover{background:#FAFBFD;border-radius:12px}
.imeta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ich{color:var(--muted);font-size:13px;font-weight:600}
.item .irec{font-weight:600;font-size:15.5px;line-height:1.55}
.more{display:flex;align-items:center;gap:4px;color:var(--navy-2);font-size:13px;font-weight:600}
.more svg{width:15px;height:15px;transform:rotate(-90deg);transition:transform .15s}
.item[open] .more svg{transform:rotate(90deg)}
.item .m2,.item[open] .m1{display:none}
.item[open] .m2{display:inline}
.idet{padding:0 16px 14px;border-top:1px dashed var(--line)}
.item .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 3px}
.item .txt{font-size:14.5px;line-height:1.7;white-space:pre-wrap;margin:0;color:#2A3744}
.item .note{background:#FFF8E6;border-radius:8px;padding:8px 12px}
.cmts .c{background:#FFFCF0;border:1px solid #F3E3B0;border-radius:10px;padding:8px 12px;margin:0 0 8px}
.cmts .ch2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.cmts .ch2 b{color:var(--ink);font-size:13.5px}
.cmts .ct{margin:4px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.cmts .cdel{border:0;background:none;color:var(--muted);font-size:12.5px;min-height:28px;padding:2px 4px;text-decoration:underline}
.cadd-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cadd-row input{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;background:#fff;color:var(--ink)}
.cadd{margin-top:8px;min-height:36px;font-size:13.5px}
.cerr{color:var(--red);font-size:13px;margin:6px 0 0}
.cstate{color:var(--muted);font-size:13px;margin:4px 0 6px}
.cstate button{border:0;background:none;color:inherit;font:inherit;text-decoration:underline;padding:2px 4px;min-height:28px}
@media (max-width:520px){ .cadd-row{grid-template-columns:1fr} }
textarea.cmt{display:block;width:100%;font-family:inherit;font-size:14.5px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#FFFEF7;color:var(--ink);resize:vertical;min-height:58px}
textarea.cmt:focus{outline:none;border-color:#E0B94A;box-shadow:0 0 0 2px #F7E3A3}
.topic-cmt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin-bottom:12px}
.topic-cmt .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.cbadge{display:inline-flex;align-items:center;gap:3px;color:#9A6700;font-size:12.5px;font-weight:600;margin-inline-start:8px}
.cbadge svg{width:14px;height:14px}
.item .ed{margin-top:12px;min-height:32px;font-size:13px;padding:4px 12px;border:0;background:none;color:var(--navy-2);padding-right:0;text-decoration:underline}
@media (max-width:900px){ .chgrid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:520px){ .row .go span{display:none} .sumbar button{width:100%;justify-content:center} }
footer{text-align:center;color:#8A97A6;font-size:.72rem;padding:20px 16px 28px}
footer a{color:#8A97A6}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .filters input{grid-column:1/-1}
  .rec>summary{grid-template-columns:52px 1fr;grid-template-areas:"ch txt" "ch pills"}
  .rec>summary .ch{grid-area:ch;align-self:start}
  .rec>summary .rtext{grid-area:txt}
  .rec>summary .pills{grid-area:pills;display:flex;gap:6px;flex-wrap:wrap}
  .body{grid-template-columns:1fr}
  .meta-row{grid-template-columns:1fr}
}
@media (max-width:520px){
  h1{font-size:21px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi b{font-size:24px}
  .card{padding:14px}
  header.top img{height:38px}
  .actions{width:100%}
  .actions button{flex:1;justify-content:center}
  table.matrix{font-size:12.5px}
  table.matrix th,table.matrix td{padding:6px 3px}
}
@media print{
  header.top .actions,.tabs,.filters,.edit-note,.banner,.count{display:none!important}
  body{background:#fff}
  .panel[hidden]{display:block}
  .rec{break-inside:avoid}
}
</style>
</head>

 "מערכות מידע", "text": "המנדיי לא תומכת במעקב; מערכת חדשה בפיתוח", "ids": [14, 15, 36, 46, 60]}, {"title": "כוח אדם", "text": "תקנים חסרים באגף ומפקחי חניכות", "ids": [27, 31, 47]}]}], "note": "בטבלה אין אחראי ומועד יעד לכל המלצה, ולכן אי אפשר לעקוב אחרי קצב היישום."}, "rows": [{"id": 1, "chapter": "3.1", "chapterMain": 3, "topic": "תעסוקת התלמידים/חניכות - ניתוח לאחוזי החניכות", "sev": "ליקוי מהותי (מיידי)", "rec": "לבחון הפעלת סנקציות לבתי הספר בהם אחוזי החניכות נמוכים ולעגן את מנגנון הסנקציות בנוהל ההכרה", "status": "לדיון מקצועי", "response": "הנושא נבחן במסגרת צוות מדיניות בתעסוקה. בטרם נטיל סנקציות על המינהל בשיתוף הלשכה המשפטית ליישם את סעיף התמרוץ למעסיקים המהווה חסם משמעותי ביכולת לשפר את אחוזי החניכות", "notes": "לא מדובר בליקוי מהותי. המינהל עסק ועדיין עוסק בנושא מזה זמן במסגרת צוותי עבודה ומדיניות.  לגבי שילוב הנושא  בנוהל ההכרה- הנושא עלה בעבר והוחלט כי לא ייכלל בנוהל אלא ייבחן במסגרת התהודה הבית סיפרית.", "owner": "", "due": "", "comments": []}, {"id": 2, "chapter": "3.1", "chapterMain": 3, "topic": "תעסוקת התלמידים/חניכות - ניתוח לאחוזי החניכות", "sev": "ליקוי מהותי (מיידי)", "rec": "להגדיר לכל בית ספר יעדים פרטניים לאחוזי החניכות הנדרשים בהתאם לאופי התעסוקה והקשיים עימם הוא מתמודד בתחום החניכות כולל קביעת קצב התקדמות לאחוז החניכות הרצוי", "status": "בתהליך", "response": "המינהל  מקבל את ההמלצה. נקבע יעד כללי מחייב לשיפור שנתי מדורג של 10% בשיעור החניכות בכלל בתי הספר, לצד התאמת יעדים ספציפיים למוסדות לפי מאפייני האוכלוסייה והאזור.", "notes": "לא מדובר בליקוי מהותי. השנה נקבע יעד מערכתי של שיפור ב10% , החל מתשפ\"ח ייקבע יעד לכל בית ספר.מערכת המידע לא נתנה מידע מהיימן לגבי אחוי החניכות ולכן הוחלט שהיעד הפרטני ייקבע לשנת תשפ\"ח, יעד אשר הסתמך על נתונים מהיימים של מערכת הדיווח החדשה.", "owner": "", "due": "", "comments": []}, {"id": 3, "chapter": "3.1", "chapterMain": 3, "topic": "תעסוקת התלמידים/חניכות - ניתוח לאחוזי החניכות", "sev": "ליקוי מהותי (מיידי)", "rec": "להגדיר בנוהל הכרה סנקציות לבתי ספר שאחוז העסקה הקיים בהם באחוזים גבוהים אינו במקצוע או ללא תלוש ו/או שלא בשכר (כגון שלילת חלק מהתקצוב)", "status": "במעקב / בירור", "response": "האגף אינו מכיר או מאשר דיווח על תעסוקה ללא תלוש או שלא במקצוע הנלמד. הדבר כתוב מפורשות בנהלים ונאמר בכל פורום של הגופים המפעילים, של המנהלים ושל רכזי החניכות, יחודד שוב בכנס המנהלים הקרוב וכן ברענון הנהלים.  על מנת לקבוע מנגנון סנקציות , יש להגדיר הנושא כנושא בבקרות הנוער ולתקנן מפקח ארצי לנושא החניכות.", "notes": "לא מדובר בליקוי מהותי. המינהל עסק ועדיין עוסק בנושא מזה זמן במסגרת צוותי עבודה ומדיניות.  לגבי שילוב הנושא  בנוהל ההכרה- הנושא עלה בעבר והוחלט כי לא ייכלל בנוהל אלא ייבחן במסגרת התהודה הבית סיפרית.", "owner": "", "due": "", "comments": []}, {"id": 4, "chapter": "3.1", "chapterMain": 3, "topic": "תעסוקת התלמידים/חניכות - ניתוח לאחוזי החניכות", "sev": "ליקוי מהותי (מיידי)", "rec": "על האגף לקבוע תכנית עבודה שיגדיל את מספר בתי הספר שיופעלו במתכונת צמודי מפעל/בסיס", "status": "מתוכנן", "response": "המינהל  מקבל את ההמלצה. מודל 'צמוד מפעל/בסיס' מהווה יעד אסטרטגי; לקראת שנת הלימודים תשפ\"ח יפורסם קול קורא ייעודי להרחבת הפעלת בתי ספר במתכונת זו.", "notes": "לא מדובר בליקוי אלא בהמלצה מקצועית . ההחלטה לצאת בקול  קורא לבית ספר צמוד מפעל התקבלה עוד בטרם החלה הביקורת. הקולות  הקוראים שפורסמו בשנים האחרונות איפשרו למציעים להגיש הצעות גם למודל זה .", "owner": "", "due": "", "comments": []}, {"id": 5, "chapter": "4.3", "chapterMain": 4, "topic": "אפקטיביות ההכשרה המקצועית - זכאים לתעודה לעומת אחוזי חניכות", "sev": "ליקוי מהותי (מיידי)", "rec": "הענקת תעודות תבוצע רק לחניכים שהועסקו בפועל ובהתאם למוגדר בחוק החניכות", "status": "לדיון מקצועי", "response": "המינהל ייבחן את הרעיון ואת השלכותיו . נציין כי הנושא כבר עלה לדיון בעבר והוחלט שייבחן רק לאחר שיושלמו כלל הפעולות הנדרשות מצד המשרד והמינהל לשיפור מצב החניכות (כגון תיקון חקיקה, השלמת תקני כ\"א).", "notes": "לא מדובר בליקוי. זהו נושא מקצועי שעלה לא אחת לדיון", "owner": "", "due": "", "comments": []}, {"id": 6, "chapter": "1.1", "chapterMain": 1, "topic": "מאפייני תכנון ופעילות האגף - תכנית העבודה ותקציב האגף", "sev": "ליקוי מהותי (מ .  ישנם נהלים שעברו תהליך תיקוף ושינוי וטרם אושרו סופית .                                                                       יתקיים דיון מקצועי משותף עם הלשכה המשפטית למיפוי חוזרי מנכ\"ל משרד החינוך הרלוונטיים לאימוץ, ובמקביל ינוסחו נהלים פנימיים ייעודיים לנושאים שאינם מוסדרים.", "notes": "האם עלו במסגרת הביקורת נושאים ספציפיים שאינם מוסדרים?", "owner": "", "due": "", "comments": []}, {"id": 10, "chapter": "1.2", "chapterMain": 1, "topic": "הגדרת תחומי האחריות וההתאמה למבנה של האגף", "sev": "ליקוי מהותי (מיידי)", "rec": "להגדיר גורם במינהל הכשרה מקצועית או באגף הנוער והחניכות שיפקח על בתי הספר בתחום המענה לבטיחות ואבטחת מוסדות החינוך", "status": "בתהליך", "response": "המינהל מקבל את ההמלצה. יוגדר גורם אחראי שירכז ויוביל את מנגנון הפיקוח והבקרה השוטף על עמידת הרשתות המפעילות בהנחיות הבטיחות, הביטחון והמוכנות לחירום. בשלב זה המינהל שכר שירותים מיועץ חיצוני אשר ימפה את הפערים וימליץ על תוכנית עבודה.לגבי גורם מפקח- אין במינהל/אגף בעל תפקיד מוסמך לכך. כן , ניתן יהיה להכליל את בחינת מימוש ההנחיות כחלק מנושאי הבקרות של אגף הבקרה.", "notes": "", "owner": "", "due": "", "comments": []}, {"id": 11, "chapter": "2", "chapterMain": 2, "topic": "בדיקת נתוני הנוכחות ברכיב תשלום התקציב לבתי הספר", "sev": "ליקוי מהותי (מיידי)", "rec": "לפעול למול הרשתות שיאפשרו למינהל להכשרה מקצועית יכולת לצפייה בנתוני חניכות ונוכחות ולתקף את הנושא בנוהל ההכרה. נדרש ליצור מנגנון דיווח קבוע וסנכרון בין מערכות בתי הספר לאגף", "status": "בתהליך", "response": "נתוני החניכות- אגף הנוער  פיתח מערכת מתקדמת, בה ידווחו הנתונים ומטה המינהל יצפה בהם , בדשבורד ובכל חתך שנרצה. לגבי תיקוף הנושא בנוהל ההכרה- כאמור בסעיף 3.1 . נתוני הנוכחות- התקבלה הנחייה שהנושא בבחינה משפטית ואין לדרוש זאת בשלב זה מהגופים המפעילים. המפקחים הפדגוגיים וצוות אגף הבקרה יוכל לדרוש זאת בעת ביקור/בקרה בבית ספר.", "notes": "", "owner": "", "due": "", "comments": []}, {"id": 12, "chapter": "2", "chapterMain": 2, "topic": "בדיקת נתוני הנוכחות ברכיב תשלום התקציב לבתי הספר", "sev": "ליקוי מהותי (מיידי)", "rec": "לקבוע את תשלום תקציב בתי הס function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); if (isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`; }
function cmtBlock(key, ph){
  const list = cmts(key);
  const st = CLOAD==='loading' ? '<p class="cstate">טוען הערות…</p>'
    : CLOAD==='error' ? '<p class="cstate">ההערות של כולם לא נטענו. <button class="cretry">לנסות שוב</button></p>'
    : CLOAD==='offline' ? '<p class="cstate">זה עותק שמור. כדי לראות הערות חדשות ולהוסיף הערה, פותחים את הדף באתר.</p>' : '';
  return `<div class="cmts" data-ck="${key}">`+ st +
    list.map(c=>`<div class="c"><div class="ch2"><span><b>${esc(c.by||'ללא שם')}</b>${c.role?' · '+esc(c.role):''}${c.at?' · '+fmtDate(c.at):''}</span>${c.own&&c.id?`<button class="cdel" data-cdel="${esc(c.id)}">מחיקה</button>`:''}</div><p class="ct">${esc(c.text)}</p></div>`).join('')+
    (CLOAD==='offline' ? '' :
    `<div class="cadd-row"><input class="cby" placeholder="שם" value="${esc(ME.by)}" aria-label="שם"><input class="crole" placeholder="תפקיד" value="${esc(ME.role)}" aria-label="תפקיד"></div>`+
    `<textarea class="cmt cnew" rows="2" placeholder="${ph}"></textarea><button class="cadd">הוספת הערה</button>`)+`</div>`;
}
function capi(body){
  body.doc = 'bakara-noar'; body.t = CTOK;
  const route = window.ApiRoute ? window.ApiRoute.url(CAPI) : Promise.resolve(CAPI);
  return route.then(u=>fetch(u,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)}))
    .then(r=>r.json())
    .catch(()=>{ if (window.ApiRoute) window.ApiRoute.failed(); return {ok:false, error:'network'}; });
}
function setSrv(list){ SRV = {}; (list||[]).forEach(c=>{ (SRV[c.key] = SRV[c.key] || []).push(c); }); }
/* הערות שנכתבו לפני השינוי נשמרו רק בדפדפן — מעבירים אותן לשרת פעם אחת, ומוחקים מהדפדפן רק אחרי אישור */
function localCmts(){
  const out = [];
  state.rows.forEach(r=>cList(r).forEach(c=>out.push({key:'r:'+r.id, by:c.by||'', role:c.role||'', at:c.at||'', text:c.text||'', legacy:true})));
  state.summary.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>cList(it).forEach(c=>out.push({key:`g:${gi}:${ii}`, by:c.by||'', role:c.role||'', at:c.at||'', text:c.text||'', legacy:true}))));
  return out.filter(c=>c.text.trim());
}
function stripLocal(o){ o.rows.forEach(r=>{ delete r.comments; delete r.comment; }); o.summary.groups.forEach(g=>g.items.forEach(it=>{ delete it.comments; delete it.comment; })); return o; }
function redrawCmts(){
  /* טקסט שכבר הוקלד בשדה הערה לא הולך לאיבוד כשההערות מגיעות מהשרת */
  const typed = {};
  document.querySelectorAll('.cmts').forEach(b=>{ const t=b.querySelector('.cnew'); if (t && t.value) typed[b.dataset.ck]=t.value; });
  renderStatic(); renderList();
  document.querySelectorAll('.cmts').forEach(box=>{
    const ph = box.querySelector('.cnew') ? box.querySelector('.cnew').placeholder : 'כתבו כאן הערה';
    const tmp = document.createElement('div'); tmp.innerHTML = cmtBlock(box.dataset.ck, ph);
    const nb = tmp.firstChild; if (nb.querySelector('.cnew') && typed[box.dataset.ck]) nb.querySelector('.cnew').value = typed[box.dataset.ck];
    box.replaceWith(nb);
  });
}
function loadCmts(){
  if (!ONLINE) return;
  CLOAD = 'loading'; document.querySelectorAll('.cmts .cstate').forEach(p=>p.textContent='טוען הערות…');
  const pend = localCmts();
  capi(pend.length ? {a:'add', items:pend} : {a:'list'}).then(j=>{
    if (!j || !j.ok){ CLOAD = 'error'; redrawCmts(); return; }
    setSrv(j.comments); CLOAD = 'ok';
    if (pend.length){
      stripLocal(state);
      const base = JSON.stringify(stripLocal(JSON.parse(document.getElementById('appdata').textContent)));
      try{
        if (JSON.stringify(state)===base){ localStorage.removeItem(KEY); document.getElementById('draftBanner').classList.remove('show'); }
        else localStorage.setItem(KEY, JSON.stringify({base:DATA.savedAt, state}));
      }catch(e){}
    }
    redrawCmts();
  });
}
function replaceBox(box){
  const ph = box.querySelector('.cnew').placeholder;
  const tmp = document.createElement('div'); tmp.innerHTML = cmtBlock(box.dataset.ck, ph);
  const nb = tmp.firstChild; box.replaceWith(nb); refreshBadges(nb); return nb;
}
function cerr(box, msg){ const old = box.querySelector('.cerr'); if (old) old.remove(); box.insertAdjacentHTML('beforeend',`<p class="cerr">${msg}</p>`); }
function refreshBadges(box){
  commentsChanged = true;
  const item = box.closest('.item'); if (!item) return;
  const more = item.querySelector('.more'); let b = more.querySelector('.cbadge');
  const has = box.querySelectorAll('.c').length>0;
  if (has && !b) more.insertAdjacentHTML('beforeend',`<span class="cbadge">${CMT}יש הערה</span>`);
  if (!has && b) b.remove();
}
document.addEventListener('click', e=>{
  if (e.target.closest('.cretry')){ loadCmts(); return; }
  const add = e.target.closest('.cadd'), del = e.target.closest('[data-cdel]');
  if (!add && !del) return;
  const box = e.target.closest('.cmts');
  if (CLOAD==='loading'){ cerr(box, 'רגע, ההערות עוד נטענות. נסו שוב בעוד כמה שניות.'); return; }
  if (add){
    const by = box.querySelector('.cby').value.trim(), role = box.querySelector('.crole').value.trim(), text = box.querySelector('.cnew').value.trim();
    const old = box.querySelector('.cerr'); if (old) old.remove();
    if (!by){ cerr(box, 'צריך לכתוב שם.'); box.querySelector('.cby').focus(); return; }
    if (!text){ box.querySelector('.cnew').focus(); return; }
    ME = {by, role}; try{ localStorage.setItem('bakara-commenter', JSON.stringify(ME)); }catch(err){}
    document.querySelectorAll('.cmts .cby').forEach(i=>{ if(!i.value.trim()) i.value = by; });
    document.querySelectorAll('.cmts .crole').forEach(i=>{ if(!i.value.trim()) i.value = role; });
    add.disabled = true; add.textContent = 'שומר…';
    capi({a:'add', items:[{key:box.dataset.ck, by, role, text, at:new Date().toISOString()}]}).then(j=>{
      if (!document.contains(box)) { if (j && j.ok){ setSrv(j.comments); CLOAD='ok'; } return; }
      if (!j || !j.ok){ add.disabled = false; add.textContent = 'הוספת הערה'; cerr(box, 'ההערה לא נשמרה. בדקו את החיבור ולחצו שוב. הטקסט נשאר כאן.'); return; }
      setSrv(j.comments); CLOAD = 'ok'; replaceBox(box);
    });
  } else {
    if (!confirm('למחוק את ההערה?')) return;
    del.disabled = true;
    capi({a:'del', id:del.dataset.cdel}).then(j=>{
      if (j && j.comments){ setSrv(j.comments); CLOAD = 'ok'; }
      if (!document.contains(box)) return;
      if (!j || !j.ok){
        const msg = j && j.error==='notyours' ? 'אפשר למחוק רק הערה שנכתבה מהדפדפן הזה.' : j && j.error==='notfound' ? 'ההערה כבר נמחקה.' : 'המחיקה לא הצליחה. בדקו את החיבור ונסו שוב.';
        const nb = j && j.comments ? replaceBox(box) : box; del.disabled = false; cerr(nb, msg); return;
      }
      replaceBox(box);
    });
  }
});
const nrec = n => n===1 ? 'המלצה אחת' : `${n} המלצות`;
const byIds =ids => ids.map(i=>state.rows.find(r=>r.id===i)).filter(Boolean);
const FILTERS = {
  all:  ['כל ההמלצות', r=>true],
  sev1: ['ליקוי מהותי (מיידי)', r=>r.sev===SEVS[0]],
  done: ['המלצות שבוצעו', r=>r.status==='בוצע'],
  sev1open: ['ליקויים מהותיים שטרם בוצעו', r=>r.sev===SEVS[0]&&r.status!=='בוצע'],
  disc: ['ממתינות לדיון מקצועי', r=>r.status==='לדיון מקצועי'],
};
function renderLive(){
  const rows = state.rows;
  const k = [['navy','all','המלצות בדוח'],['red','sev1','ליקוי מהותי (מיידי)'],['green','done','בוצעו'],['red','sev1open','מהותיות שטרם בוצעו'],['violet','disc','לדיון מקצועי']];
  $('#kpis').innerHTML = k.map(([c,key,t])=>`<button class="kpi ${c}" data-open="f:${key}"><b>${rows.filter(FILTERS[key][1]).length}</b><span>${t}</span></button>`).join('');
  let h = '<table class="matrix"><thead><tr><th>חומרה</th>'+GROUPS.map(g=>`<th>${g[0]}</th>`).join('')+'<th>סה"כ</th></tr></thead><tbody>';
  const tot = {};
  SEVS.forEach((s,si)=>{
    const rs = rows.filter(r=>r.sev===s);
    h += `<tr><td><span class="pill ${SEVCLS[s]}">${s}</span></td>`;
    GROUPS.forEach(([g],gi)=>{ const n=rs.filter(r=>groupOf(r.status)===g).length; tot[g]=(tot[g]||0)+n; h+= n?`<td class="cl" data-open="c:${si}:${gi}">${n}</td>`:`<td class="zero">0</td>`; });
    h += `<td class="cl" data-open="c:${si}:-1"><b>${rs.length}</b></td></tr>`;
  });
  h += '</tbody><tfoot><tr><td>סה"כ</td>'+GROUPS.map(([g])=>`<td>${tot[g]}</td>`).join('')+`<td>${rows.length}</td></tr></tfoot></table>`;
  $('#matrix').innerHTML = h;
}
function renderStatic(){
  const S = state.summary;
  $('#docTitle').textContent = S.title; $('#docSub').textContent = S.source;
  $('#chapters').innerHTML = S.chapters.map((c,i)=>{
    const rs = state.rows.filter(r=>c.chs.includes(r.chapterMain));
    const m = rs.filter(r=>r.sev===SEVS[0]).length;
    return `<div class="chcard" role="button" tabindex="0" data-open="ch:${i}"><div class="n">${rs.length}</div><div class="nm" data-path="chapters.${i}.name">${esc(c.name)}</div><div class="lb">${esc(c.label)}</div>`+
      (m?`<span class="mat">${m} מהותיות</span>`:'<span class="mat" style="visibility:hidden">0</span>')+`<div class="tx" data-path="chapters.${i}.text">${esc(c.text)}</div></div>`;
  }).join('');
  $('#groups').innerHTML = S.groups.map((g,gi)=>`<div class="card"><h2 data-path="groups.${gi}.title">${esc(g.title)}</h2><div class="rows">`+
    g.items.map((it,ii)=>`<div class="row" role="button" tabindex="0" data-open="g:${gi}:${ii}"><span class="num">${ii+1}</span>`+
      `<span><span class="t" data-path="groups.${gi}.items.${ii}.title">${esc(it.title)}</span><span class="s" data-path="groups.${gi}.items.${ii}.text">${esc(it.text)}</span></span>`+
      `<span class="go">${hasCmt(gi,ii,it)?`<span class="cbadge" title="יש הערות">${CMT}</span>`:''}<span>${nrec(it.ids.length)}</span>${CHEV}</span></div>`).join('')+`</div></div>`).join('');
  $('#note').textContent = S.note;
  applyEditing();
}
function renderSummary(){ renderLive(); }
let editing = false;
function applyEditing(){
  document.body.classList.toggle('editing', editing);
  document.querySelectorAll('#p-sum [data-path]').forEach(el=>{ if(editing) el.setAttribute('contenteditable','true'); else el.removeAttribute('contenteditable'); });
  $('#editToggle').setAttribute('aria-pressed', editing);
  $('#editToggle span').textContent = editing ? 'סיום עריכה' : 'עריכת התקציר';
  $('#editNote').textContent = editing ? 'לוחצים על טקסט ומתקנים. השינויים נשמרים לבד' : 'לחיצה על מספר או על שורה פותחת את ההמלצות עצמן';
}
$('#editToggle').addEventListener('click',()=>{ editing=!editing; applyEditing(); });
function setPath(obj, path, val){ const p=path.split('.'); let o=obj; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; }

/* ---------- חלון פירוט ---------- */
const SEVSHORT = {"ליקוי מהותי (מיידי)":"ליקוי מהותי","ליקוי עם המלצות ליישום":"ליקוי עם המלצות","ליקוי פחות מהותי":"ליקוי פחות מהותי"};
function itemHTML(r, open){
  return `<details class="item ${SEVCLS[r.sev]}"${open?' open':''}><summary>`+
    `<span class="imeta"><span class="ich">סעיף ${esc(r.chapter)} · ${esc(SEVSHORT[r.sev])}</span><span class="pill st ${stCls(r.status)}">${esc(r.status)}</span></span>`+
    `<span class="irec">${esc(r.rec)}</span>`+
    `<span class="more">${CHEV}<span class="m1">תגובת האגף</span><span class="m2">סגירה</span>${cmts('r:'+r.id).length?`<span class="cbadge">${CMT}יש הערה</span>`:''}</span></summary>`+
    `<div class="idet">`+
    `<p class="lbl">החלטות ומענים ליישום</p><p class="txt">${esc(r.response)||'<i style="color:#B42318">אין תגובה כתובה</i>'}</p>`+
    (r.notes?`<p class="lbl">הערות האגף</p><p class="txt note">${esc(r.notes)}</p>`:'')+
    `<p class="lbl">הערות</p>${cmtBlock('r:'+r.id,'כתבו כאן הערה על ההמלצה')}`+
    ((r.owner||r.due)?`<p class="lbl">אחראי · מועד יעד</p><p class="txt">${esc(r.owner||'—')} · ${esc(r.due||'—')}</p>`:'')+
    `<button class="ed" data-edit="${r.id}">עריכה בטבלה</button></div></details>`;
}
let lastFocus = null;
function openDrawer(title, sub, rows, gkey){
  lastFocus = document.activeElement;
  $('#dTitle').textContent = title; $('#dSub').textContent = sub ? `${sub} · ${nrec(rows.length)}` : nrec(rows.length);
  let top = '';
  if (gkey){ const [gi,ii]=gkey.split(':'); const it=state.summary.groups[+gi].items[+ii];
    top = `<div class="topic-cmt"><p class="lbl">הערות על הנושא</p>${cmtBlock('g:'+gkey,'כתבו כאן הערה על הנושא כולו')}</div>`; }
  $('#dBody').innerHTML = top + (rows.length ? (rows.length>1?'<p class="dhint">לחיצה על המלצה פותחת את תגובת האגף ואת שדה ההערות</p>':'') + rows.map(r=>itemHTML(r, rows.length===1)).join('') : '<p>אין המלצות.</p>');
  $('#drawer').hidden = false; $('#dBody').scrollTop = 0; document.body.style.overflow='hidden';
  $('#drawer .x').focus();
}
function closeDrawer(){ $('#drawer').hidden = true; document.body.style.overflow='';
  if (commentsChanged){ commentsChanged=false; renderStatic(); renderList(); lastFocus=null; }
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function handleOpen(code){
  const [kind,a,b] = code.split(':'); const S = state.summary;
  if (kind==='f'){ const [t,fn]=FILTERS[a]; return openDrawer(t,null,state.rows.filter(fn)); }
  if (kind==='c'){ const sev=SEVS[+a]; const rs=state.rows.filter(r=>r.sev===sev&&(+b<0||groupOf(r.status)===GROUPS[+b][0]));
    return openDrawer(sev+(+b<0?'':' · '+GROUPS[+b][0]), null, rs); }
  if (kind==='ch'){ const c=S.chapters[+a]; return openDrawer(`${c.label} · ${c.name}`, null, state.rows.filter(r=>c.chs.includes(r.chapterMain))); }
  if (kind==='g'){ const it=S.groups[+a].items[+b]; return openDrawer(it.title, it.text, byIds(it.ids), `${a}:${b}`); }
}
document.addEventListener('click', e=>{
  if (e.target.closest('[data-close]')) return closeDrawer();
  const ed = e.target.closest('[data-edit]');
  if (ed){ closeDrawer(); gotoRec(ed.dataset.edit); return; }
  if (editing && e.target.closest('[data-path]')) return;
  const o = e.target.closest('[data-open]'); if (o) handleOpen(o.dataset.open);
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && !$('#drawer').hidden) closeDrawer();
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('[role=button][data-open]') && !editing){ e.preventDefault(); handleOpen(e.target.dataset.open); }
});
function gotoRec(id){
  document.querySelector('.tabs [data-tab=tbl]').click();
  ['#q','#fSev','#fSt','#fCh'].forEach(s=>$(s).value=''); renderList();
  const d = document.querySelector(`.rec[data-id="${id}"]`); if (d){ d.open=true; d.scrollIntoView({behavior:'smooth',block:'start'}); }
}
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.dataset.path){ setPath(state.summary, el.dataset.path, el.innerText.trim()); persist(); return; }
  const rec = el.closest('[data-id]');
  if (rec && el.dataset.field){
    const r = state.rows.find(x=>String(x.id)===rec.dataset.id);
    r[el.dataset.field] = (el.tagName==='SELECT'||el.tagName==='INPUT'||el.tagName==='TEXTAREA') ? el.value : el.innerText.replace(/\n$/,'');
    if (el.dataset.field==='status'){ const p=rec.querySelector('.stpill'); p.className='pill st stpill '+stCls(el.value); p.textContent=el.value; renderSummary(); }
    if (el.dataset.field==='sev'){ const p=rec.querySelector('.sevpill'); p.className='pill sevpill '+SEVCLS[el.value]; p.textContent=el.value; renderSummary(); renderStatic(); }
    persist();
  }
});
document.addEventListener('change', e=>{ if (e.target.matches('.field select, .field input')) e.target.dispatchEvent(new Event('input',{bubbles:true})); });

/* ---------- טבלה ---------- */
function fillFilters(){
  SEVS.forEach(s=>$('#fSev').insertAdjacentHTML('beforeend',`<option>${s}</option>`));
  STATUSES.forEach(s=>$('#fSt').insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`));
  const chs = [...new Set(state.rows.map(r=>r.chapterMain))].sort((a,b)=>a-b);
  const names = {1:'פרק 1 · תכנון ומבנה',2:'פרק 2 · נוכחות ותקציב',3:'פרק 3 · חניכות ותעסוקה',4:'פרק 4 · זכאות לתעודה',5:'פרק 5 · פיקוח ובקרה'};
  chs.forEach(c=>$('#fCh').insertAdjacentHTML('beforeend',`<option value="${c}">${names[c]||('פרק '+c)}</option>`));
}

      <div class="field"><label>מועד יעד</label><input type="date" data-field="due" value="${esc(r.due)}"></div>
    </div>
    <div class="field"><label>חומרה (לפי הדוח)</label><select data-field="sev">${opts(SEVS,r.sev)}</select></div>
    <div class="field"><label>נושא / תחום</label><div class="box" contenteditable="true" data-field="topic">${esc(r.topic)}</div></div>
  </div>
</details>`;
}
function renderList(){
  const q = $('#q').value.trim(), fs=$('#fSev').value, ft=$('#fSt').value, fc=$('#fCh').value;
  const open = new Set([...document.querySelectorAll('.rec[open]')].map(d=>d.dataset.id));
  const rows = state.rows.filter(r=>(!fs||r.sev===fs)&&(!ft||r.status===ft)&&(!fc||String(r.chapterMain)===fc)&&
    (!q||[r.rec,r.response,r.notes,r.topic,r.owner,r.chapter].join(' ').includes(q)));
  $('#count').textContent = rows.length===state.rows.length ? `${rows.length} המלצות · לחיצה על שורה פותחת אותה לעריכה` : `מוצגות ${rows.length} מתוך ${state.rows.length}`;
  $('#list').innerHTML = rows.map(recHTML).join('');
  open.forEach(id=>{ const d=document.querySelector(`.rec[data-id="${id}"]`); if(d) d.open=true; });
}
['#q','#fSev','#fSt','#fCh'].forEach(s=>$(s).addEventListener('input',renderList));

/* ---------- טאבים ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  $('#p-sum').hidden = b.dataset.tab!=='sum'; $('#p-tbl').hidden = b.dataset.tab!=='tbl';
}));

/* ---------- שמירה וייצוא ---------- */
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`; }
function download(name, blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
$('#saveCopy').addEventListener('click',()=>{
  const out = JSON.parse(JSON.stringify(state)); out.savedAt = new Date().toISOString();
  /* ההערות המשותפות נכנסות לעותק כדי שיוצגו בו גם בלי חיבור */
  if (SRV){ const pick = l=>l.map(c=>({by:c.by, role:c.role, at:c.at, text:c.text}));
    out.rows.forEach(r=>{ r.comments = pick(cmts('r:'+r.id)); delete r.comment; });
    out.summary.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{ it.comments = pick(cmts(`g:${gi}:${ii}`)); delete it.comment; })); }
  const json = JSON.stringify(out).replace(/</g,'\\u003c');
  const html = '<!doctype html>\n' + PAGE_SOURCE.replace(/(<script id="appdata" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+json+b);
  download(`מעקב המלצות הביקורת ${stamp()}.html`, new Blob([html],{type:'text/html;charset=utf-8'}));
  toast('נשמר עותק מעודכן בתיקיית ההורדות');
});
$('#exportCsv').addEventListener('click',()=>{
  const cols=[['chapter','פרק בדוח'],['topic','נושא / תחום'],['sev','חומרה'],['rec','תוכן ההמלצה'],['status','סטטוס יישום'],['response','החלטות ומענים ליישום'],['notes','הערות האגף'],['cmtx','הערות'],['owner','אחראי'],['due','מועד יעד']];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const cx=r=>cmts('r:'+r.id).map(c=>`${c.by}${c.role?' ('+c.role+')':''}${c.at?' '+fmtDate(c.at):''}: ${c.text}`).join(' | ');
  const lines=[cols.map(c=>q(c[1])).join(',')].concat(state.rows.map(r=>cols.map(c=>q(c[0]==='cmtx'?cx(r):r[c[0]])).join(',')));
  download(`מעקב המלצות הביקורת ${stamp()}.csv`, new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  toast('הקובץ ירד. הוא נפתח באקסל');
});

fillFilters(); renderStatic(); renderLive(); renderList(); loadCmts();
